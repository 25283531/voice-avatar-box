name: android-build

# 安卓 APK：uni-app H5 + Android WebView 壳，**全程在 runner 内完成，不走 DCloud 云打包**。
#
# 思路：app-build 已经能稳定产出 H5，本项目手机端又不依赖 App 原生能力
# （唯一用到 plus.runtime.restart() 的地方已有 H5 降级分支），
# 因此把 H5 塞进 assets/web，用 androidx.webkit 的 WebViewAssetLoader 映射成
# https://elder.local/assets/web/index.html 加载，就是一个功能完整的原生 App。
# 好处：不要 DCloud 账号 / 实名 / 每月 5 次配额，签名用自己的 keystore。
#
# 触发：改动 app/ 或 android/ 时自动跑（paths 增量），也可手动 / 发 Release 时跑。
on:
  push:
    paths:
      - 'app/src/**'
      - 'app/env/**'
      - 'app/package.json'
      - 'app/pnpm-lock.yaml'
      - 'app/vite.config.ts'
      - 'android/**'
      - '.github/workflows/android-build.yml'
  pull_request:
    paths:
      - 'app/src/**'
      - 'app/env/**'
      - 'app/package.json'
      - 'app/pnpm-lock.yaml'
      - 'app/vite.config.ts'
      - 'android/**'
      - '.github/workflows/android-build.yml'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version_name:
        # ⚠️ **刻意不给 default**。
        #   workflow_dispatch 的 input 一旦带 default，dispatch 时即使人不填也会
        #   拿到那个值 —— 于是 `inputs.default` 本身就是**版本号的第二份真源**，
        #   且会在无人察觉的情况下把 gradle 里的真值盖掉。
        #   2026-10-19 真实踩过：清掉了 env 里的 `|| '1.0.0'` 兜底，
        #   却漏了这里的 default，于是手动 dispatch 出来的包版本号退回 100，
        #   被「必须递增」门禁拦下（门禁是对的，配置是错的）。
        #   留空 = 沿用 android/app/build.gradle.kts 里的唯一真源。
        description: 版本名（留空则用 build.gradle.kts 里的值：1.1.0）
        type: string
        required: false
      version_code:
        description: 版本号（留空则用 build.gradle.kts 里的值：110；仅在确实要覆盖时填）
        type: string
        required: false
      sign:
        description: '签名：self=仓库 secrets 里的 keystore（缺省）/ debug=调试签名'
        type: choice
        options: [self, debug]
        default: self

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '10.10.0'
  HUSKY: '0'

jobs:
  apk:
    name: 构建 Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: 安装前端依赖
        working-directory: app
        run: pnpm install --frozen-lockfile --registry https://registry.npmjs.org

      - name: 构建 H5（相对路径，供 WebView 加载）
        working-directory: app
        env:
          VITE_APP_PUBLIC_BASE: './'
        run: |
          set -e
          pnpm build:h5
          test -f dist/build/h5/index.html
          ls -lh dist/build/h5

      - name: 把 H5 与图标装进 Android 工程
        run: |
          set -e
          WEB=android/app/src/main/assets/web
          rm -rf "$WEB"
          mkdir -p "$WEB"
          cp -r app/dist/build/h5/. "$WEB/"
          # 兜底：把 index.html 里的绝对资源路径改成相对路径
          # （WebView 里页面在 /assets/web/ 下，"/xxx" 会解析到虚拟域根目录而 404）
          python - <<'PY'
          import os
          p = 'android/app/src/main/assets/web/index.html'
          s = open(p, encoding='utf-8').read()
          fixed = s.replace('="/', '="./').replace("='/", "='./")
          if fixed != s:
              open(p, 'w', encoding='utf-8').write(fixed)
              print('已把资源路径改为相对路径')
          print([x for x in fixed.split('>') if 'script' in x.lower() or 'stylesheet' in x.lower()][:4])
          PY
          # 图标复用 app/src/static/icons（不重复入库）
          for spec in "hdpi:72x72" "xhdpi:96x96" "xxhdpi:144x144" "xxxhdpi:192x192"; do
            d="android/app/src/main/res/mipmap-${spec%%:*}"
            mkdir -p "$d"
            cp "app/src/static/icons/${spec##*:}.png" "$d/ic_launcher.png"
          done
          du -sh "$WEB"
          test -f "$WEB/index.html"

      - name: 准备签名证书
        id: sign
        if: inputs.sign != 'debug'
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -e
          if [ -z "$KS_B64" ]; then
            echo "::warning::未配置 ANDROID_KEYSTORE_BASE64，回落到 debug 签名"
            exit 0
          fi
          KS="$RUNNER_TEMP/app.keystore"
          echo "$KS_B64" | base64 -d > "$KS"
          # 别名对不上时 gradle 只会给个含糊的报错，这里先自查
          if ! keytool -list -keystore "$KS" -storepass "$STORE_PASS" -alias "$KEY_ALIAS" >/dev/null 2>&1; then
            echo "::error::keystore 里找不到别名 $KEY_ALIAS，实际别名如下："
            keytool -list -keystore "$KS" -storepass "$STORE_PASS" 2>&1 | head -20
            exit 1
          fi
          echo "keystore_file=$KS" >> "$GITHUB_OUTPUT"
          echo "签名证书就绪，别名 $KEY_ALIAS"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Android SDK 组件
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "ANDROID_HOME=$SDK"
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 <<< "y" || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            --install "platforms;android-34" "build-tools;34.0.0" >/dev/null 2>&1 || true

      - name: Gradle 构建 Release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_FILE: ${{ steps.sign.outputs.keystore_file }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          # ⚠️ 这里**刻意不给默认值**。
          #   版本号的唯一真源是 android/app/build.gradle.kts 的 `?: 110 / "1.1.0"`。
          #   曾经这里写的是 `inputs.version_name || '1.0.0'` / `|| '100'`，
          #   于是 push 构建（inputs 为空）恒定传 -PVERSION_CODE=100，
          #   **把 gradle 里的新版本号盖回旧值** —— 文件名写着 1.1.0、
          #   装到手机上版本号却是 100，安卓侧判为低版本、拒绝覆盖安装，
          #   且构建全程不报错。这类「两份真源各自漂移」比没有版本号更危险。
          #   现在只在 dispatch 显式传参时才覆盖，否则交给 gradle 的默认值。
          # 走环境变量而不是直接内插进 shell，避免 dispatch 输入被当成命令执行
          VNAME: ${{ inputs.version_name }}
          VCODE: ${{ inputs.version_code }}
        run: |
          set -e
          chmod +x gradlew
          # ⚠️⚠️ inputs 为空时**必须完全不传 -P**，不能传空串。
          #   `-PVERSION_NAME=""` 会让 gradle 真的存在一个「值为空串」的属性，
          #   而 build.gradle.kts 里的 `(findProperty(...) as String?) ?: "1.1.0"`
          #   只在 **null** 时兜底 —— 空串不是 null ⇒ 兜底失效 ⇒
          #   versionName 变成空串、printElderVersion 打出 "ELDER_VERSION  110"，
          #   awk 切出 $2=110/$3=空 ⇒ 被下面的守卫拦下，整个发版链路红。
          #   这个坑真实发生过一次（2026-10-19 push 触发的构建全红，
          #   而 dispatch 显式传参的那次是绿的 —— 两条路径行为不一致）。
          #   所以这里用数组**按需**追加参数，而不是无条件传空值。
          GRADLE_V_ARGS=()
          [ -n "$VNAME" ] && GRADLE_V_ARGS+=("-PVERSION_NAME=$VNAME")
          [ -n "$VCODE" ] && GRADLE_V_ARGS+=("-PVERSION_CODE=$VCODE")
          echo "传入的版本覆盖参数：${GRADLE_V_ARGS[*]:-（无，用 gradle 里的真源）}"

          # 从 gradle 读回**实际生效**的版本号，让「产物名 == 包内版本」可断言。
          # 只跑 printElderVersion 这个空任务，不触发编译。
          OUT="$(./gradlew --no-daemon -q printElderVersion "${GRADLE_V_ARGS[@]}" 2>/dev/null \
                 | grep -o 'ELDER_VERSION .*' | tail -1 || true)"
          VNAME="$(echo "$OUT" | awk '{print $2}')"
          VCODE="$(echo "$OUT" | awk '{print $3}')"
          # 读不到就**报错**，不猜：宁可构建失败，也不要发一个版本号不明的包。
          if [ -z "$VNAME" ] || [ -z "$VCODE" ]; then
            echo "::error::未能从 gradle 读回生效版本号（printElderVersion 输出='$OUT'），中止发版"
            exit 1
          fi
          echo "本次打包版本：name=$VNAME code=$VCODE"
          ./gradlew --no-daemon --stacktrace assembleRelease "${GRADLE_V_ARGS[@]}"
          ls -lh app/build/outputs/apk/release/
          # 统一文件名，方便下载
          for f in app/build/outputs/apk/release/*.apk; do
            mv "$f" "app/build/outputs/apk/release/elder-companion-${VNAME}-${VCODE}.apk"
          done
          ls -lh app/build/outputs/apk/release/
          # ⚠️ 版本号必须**高于上次发布的 100**。老人换机/升级走的是这里，
          # 版本号不涨 ⇒ 安卓判为低版本、拒绝覆盖安装 ⇒ 表现为「发了新版但装不上」。
          if [ "$VCODE" -le 100 ]; then
            echo "::error::versionCode=$VCODE 未高于上次发布的 100，发版前必须递增"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: elder-app-android-apk
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30
