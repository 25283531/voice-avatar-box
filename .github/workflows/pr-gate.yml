name: pr-gate

# ============================================================================
# 常驻门禁「守门人自检」—— 这个门禁守得住什么、守不住什么
# ============================================================================
# 每一行断言旁边都必须写清边界。本项目哲学：**不写清边界的断言是负债** ——
# 下一个人会把它当成它不是的东西，然后把「门禁是绿的」当成「代码是对的」。
#
# ----------------------------------------------------------------------------
# 守得住（这三件事是机械可判的，所以交给 CI）
# ----------------------------------------------------------------------------
# 1. CODEOWNERS 存在，且每条规则语法合法（模式合法、至少一个 owner、
#    owner 以 @ 开头）。
# 2. 关键危险路径仍被显式（非通配）规则覆盖。有人删掉这些行 —— 无论手滑
#    还是「顺手清理」—— 立刻红。删一行就足以让事故链路失去盯防：
#       启动回填判据写错 -> 重启改写用户角色归属 -> 角色被刷成 preset
#       -> 只读 + 全平台可见 = 跨用户数据泄漏（真实发生过的 P0）。
# 3. .github/workflows/*.yml 全部可通过 yaml.safe_load 解析（挡住写坏的
#    YAML 混进 CI 本体目录）。
#
# ----------------------------------------------------------------------------
# 守不住（这三件事没有机械判据，靠人；写在这里防止误用）
# ----------------------------------------------------------------------------
# 1. **同时篡改代码与基准的自洽绕过。** 改了 catalog.py 再跑
#    gen_redline_baseline.py 重新盖章，diff 里两处都变、黄金副本比对依然
#    全绿 —— 门禁亲手把被削弱的红线盖章为「正确基线」。挡它只能靠人工
#    review 看 diff 全貌：红线正文的每一次变动都必须有人逐字看过。
# 2. **语义正确性。** 判据写错但语法合法、路径覆盖仍在，本门禁全绿。
#    启动回填的 SQL 判据、人格红线本身对不对，机器不知道。挡它靠人工
#    review + 变异测试的纪律（新增断言必须附「改坏 -> 变红」的证明）。
# 3. **覆盖 != 真的有人看。** CODEOWNERS 在文件层面完好，不代表 review
#    真的发生；分支保护是否强制 review 是 GitHub 侧仓库设置，CI 红只代表
#    文件层面完好。另外本门禁自己也可以被改松（改这个yml 让检查消失或
#    永远通过）—— 挡它靠 workflows/ 目录同在危险路径清单里，且分支保护
#    把「守门人自检」设为必需状态检查。
#
# ----------------------------------------------------------------------------
# 触发设计：pull_request 刻意不加 paths 过滤 —— 每个 PR 都必须跑。
# 加 paths 过滤等于给「改一个没被列中的路径」留后门，而这个后门正是
# 危险路径清单存在的意义所要堵的东西。
# ----------------------------------------------------------------------------
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read   # 只读仓库，最小权限

jobs:
  gatekeeper:
    # 固定中文名：将作为分支保护的必需状态检查名。改名 = 分支保护失效，
    # 要改请先改 GitHub 侧设置（见 README「分支保护与 PR 流程」）。
    name: 守门人自检
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ubuntu-latest 镜像通常自带 PyYAML，但显式安装保证确定性：
      # 缺依赖时脚本 fail-closed 报错，绝不静默跳过 YAML 检查。
      - name: 安装 PyYAML
        run: python -m pip install --quiet pyyaml

      # 判据与本地同一个脚本：推 PR 前本地跑同一个命令，exit 0 才推。
      - name: 守门人自检（CODEOWNERS 覆盖 + workflows 可解析）
        run: python tools/ci_gate_check.py
