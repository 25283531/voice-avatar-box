name: docker-build

# 后端镜像构建与发布。
#
#   push 到 main/master（触及 server/**） -> 构建 + 容器冒烟 + 推送 ghcr.io
#                                            标签：latest（主用）+ 短 SHA（回滚定位）
#   pull_request                          -> 只构建 + 容器冒烟，**不推送**
#   workflow_dispatch                     -> 勾选 publish 才推送（可覆盖 tag）
#
# 为什么 PR 不推送（后来人请不要"顺手"放开）：
#   PR 里的代码可能没被 review 过、也可能永远合不进 main，但它触发的构建一旦推上
#   ghcr.io 就是公共产物 —— 任何人 docker pull 就能跑一份未经审计的服务。
#   且 pull_request 事件下 GITHUB_TOKEN 只有只读权限，permissions 里的
#   packages: write 也不生效，硬放开只会拿到 403。发镜像只有两条路：
#   合进 main（自动发 latest），或手动 workflow_dispatch 勾 publish。
#
# latest 的语义：main 上最新一个**通过容器冒烟**的构建。冒烟失败则推送步骤
# 不执行，latest 不会被坏构建污染 —— iStoreOS 上 docker pull
# ghcr.io/25283531/voice-avatar-box:latest 拿到的就是可直接用的版本。
#
# 端口：容器内 8080，对外发布 8064
#   docker run -d -p 8064:8080 -e ELDER_DB=... ghcr.io/25283531/voice-avatar-box:latest
on:
  push:
    branches: [main, master]
    paths:
      - 'server/**'
      - '.github/workflows/docker-build.yml'
  pull_request:
    paths:
      - 'server/**'
      - '.github/workflows/docker-build.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: 推送镜像到 ghcr.io（关闭则只构建自检）
        type: boolean
        default: false
      tag:
        description: 镜像标签（push 到 main 时忽略，固定为 latest + 短 SHA）
        type: string
        default: latest

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  docker:
    name: 构建后端镜像
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 解析镜像标签
        id: meta
        run: |
          IMG="ghcr.io/${{ github.repository }}"
          SHA="${GITHUB_SHA::7}"
          if [ "${{ github.event_name }}" = "push" ]; then
            # 自动发布：latest 常驻 + 短 SHA 便于出问题时回滚定位
            TAGS="latest $SHA"
          else
            # PR：inputs.tag 为空，只打短 SHA（本地加载用，不推送）
            # workflow_dispatch：用输入的 tag（默认 latest），非 SHA 时顺带补一个短 SHA
            TAG="${{ inputs.tag }}"
            [ -n "$TAG" ] || TAG="$SHA"
            TAGS="$TAG"
            [ "$TAG" = "$SHA" ] || TAGS="$TAG $SHA"
          fi
          # ⚠️⚠️ **标签必须带完整的 ghcr.io/<repo>: 前缀**，这不是风格问题。
          # 这里曾经只输出裸名（latest / <短SHA>），于是 buildx 实际执行的是
          #   docker buildx build --tag latest --tag <短SHA> --load
          # 加载进本机 docker 的镜像名字就叫 `latest` 和 `<短SHA>`；
          # 而下面的容器冒烟跑的是
          #   docker run ... ghcr.io/25283531/voice-avatar-box:<短SHA>
          # —— 名字对不上，docker 便以为本地没有、转头去 ghcr.io 拉，
          # 于是报 `manifest unknown` / exit 125。
          # 因为该 tag 从未推送成功过（推送步骤在冒烟之后，冒烟红就不推），
          # 这个"拉 registry 上的自己"还会自我循环：拉不到 -> 冒烟红 -> 不推送
          # -> 下次还是拉不到。改成前缀完整后，构建产物与冒烟/推送引用的是
          # **同一个名字**，冒烟验的必然是本次刚构建的镜像，且推送能直接推它。
          {
            echo "tags<<EOF"
            for t in $TAGS; do echo "${IMG}:${t}"; done
            echo "EOF"
            echo "sha=${SHA}"
          } >> "$GITHUB_OUTPUT"
          echo "将构建标签："
          for t in $TAGS; do echo "  ${IMG}:${t}"; done

      - name: 准备 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 ghcr.io
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建镜像（本地加载，用于冒烟）
        uses: docker/build-push-action@v7
        with:
          context: ./server
          file: ./server/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 启动容器并验证 /api/health
        run: |
          set -e
          IMG="${{ env.IMAGE }}:${{ steps.meta.outputs.sha }}"
          # ⚠️ 必须先确认它**真的在本地**再 docker run。
          # 直接 docker run 一个本地没有的名字时，docker 不会报错退出，
          # 而是转头去 registry 拉，于是失败信息变成
          # 「manifest unknown / exit 125」—— 一个和真因（构建产物没被加载
          # 或名字对不上）毫无关系的报错，排障方向会被直接带偏。
          # 这里显式断言 + 打出 docker images，让"标签没落地"当场自证。
          if ! docker image inspect "$IMG" >/dev/null 2>&1; then
            echo "::error::本次构建产物 $IMG 不在本机镜像库（冒烟必须验本次构建，不能拉 registry）"
            echo "---- docker images ----"
            docker images
            exit 1
          fi
          docker rm -f elder-smoke >/dev/null 2>&1 || true
          docker run -d --name elder-smoke \
            -p 8064:8080 \
            -e ELDER_DB=sqlite:////tmp/elder-smoke.db \
            -e ELDER_JWT_SECRET=ci-smoke-secret \
            "$IMG"
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8064/api/health; then
              echo ""; echo "容器冒烟通过"
              docker logs elder-smoke | tail -5
              docker rm -f elder-smoke >/dev/null 2>&1 || true
              exit 0
            fi
            sleep 1
          done
          echo "容器未在 40s 内就绪，日志如下："
          docker logs elder-smoke | tail -40
          docker rm -f elder-smoke >/dev/null 2>&1 || true
          exit 1

      - name: 推送镜像到 ghcr.io
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish)
        run: |
          set -e
          # tags 已经是 `ghcr.io/<repo>:<tag>` 全名（见"解析镜像标签"步骤），
          # 而 buildx --load 就是按这些名字把它们装进本机 docker 的，
          # 所以这里**直接推、不要再 docker tag**：
          # 早先对裸标签做 `docker tag ${IMG}:${SHA} ${IMG}:${t}` 时，
          # 源镜像 ${IMG}:${SHA} 在本机并不存在（只有裸名 <SHA>），
          # 推送步骤同样会以 "tag ... doesn't exist" 失败 —— 只是它排在
          # 冒烟之后，从没被走到过。
          while IFS= read -r t; do
            [ -n "$t" ] || continue
            docker push "$t"
            echo "已推送 $t"
          done <<< "${{ steps.meta.outputs.tags }}"
          FIRST="$(head -n1 <<< "${{ steps.meta.outputs.tags }}")"
          {
            echo "### 镜像已发布"
            echo '```'
            while IFS= read -r t; do
              [ -n "$t" ] || continue
              echo "docker pull $t"
            done <<< "${{ steps.meta.outputs.tags }}"
            echo "docker run -d -p 8064:8080 --env-file .env $FIRST"
            echo '```'
            echo "- 来源提交：${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}"
            echo "- 触发事件：${GITHUB_EVENT_NAME}"
          } >> "$GITHUB_STEP_SUMMARY"
