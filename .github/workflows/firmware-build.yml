name: firmware-build

# ESP32-S3 固件：在 GitHub runner 上用 Espressif 官方 ESP-IDF 容器编译。
#
# 为什么放 CI：
#   - 本机资源有限，全量编译 2277 个目标（含 LVGL / esp-sr / EAF 形象）耗时长
#   - runner 每次都是干净环境，不受本机 PATH / MSYS / 工具链污染影响
#
# 流程：checkout → merge_to_xiaozhi.py 注入 elder → idf.py set-target esp32s3 → build
#       → merge-bin 出单文件烧录镜像 → 上传 artifact
#
# OTA 地址（重要，改前先读）：
#   CONFIG_OTA_URL 的默认值在 firmware/xiaozhi/main/Kconfig.projbuild，
#   已指向本项目自己的服务端 https://152.136.230.132/api/voice/ota（IP 直连，
#   2026-10-18 起：域名未备案被厂商按 SNI 阻断，连 IP 不带 SNI 可绕过）。
#   本工作流的 server_url 输入**只**覆盖 CONFIG_ELDER_SERVER_URL，不动 OTA_URL；
#   下方「校验 OTA 地址」步骤每次构建都会把生效值打进日志，地址写错**直接让构建失败**
#   （2026-10-18 起从 warning 升级为 exit 1：错误域名曾靠"只警告"静默流出出厂固件）。
#   设备运行时还可被 NVS（settings("wifi") 的 ota_url，见 main/ota.cc
#   的 GetCheckVersionUrl）覆盖，不必重新烧录。
#
# 触发：改动 firmware/ 或本文件时自动跑；也可手动（可覆盖板卡与后端地址）。

on:
  push:
    paths:
      - 'firmware/**'
      - 'tools/merge_to_xiaozhi.py'
      - '.github/workflows/firmware-build.yml'
  workflow_dispatch:
    inputs:
      idf_version:
        description: 'ESP-IDF 版本（对应 espressif/idf 镜像 tag）'
        type: string
        default: v5.5.1
      server_url:
        description: '设备要连的业务后端地址（留空则用 sdkconfig.defaults 里的值）'
        type: string
        default: https://152.136.230.132
      board:
        description: '目标板卡 Kconfig 符号（默认立创·实战派）'
        type: string
        default: CONFIG_BOARD_TYPE_LICHUANG_DEV_S3

env:
  IDF_TARGET: esp32s3
  PROJECT_DIR: firmware/xiaozhi

jobs:
  build:
    name: 编译 ESP32-S3 固件
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # 官方镜像里 IDF_PATH / 工具链已就位；idf.py 需先 source export.sh
    container:
      image: espressif/idf:v5.5.1
    steps:
      - uses: actions/checkout@v4

      - name: 注入 elder 组件到 xiaozhi 源码树
        run: |
          set -e
          python3 tools/merge_to_xiaozhi.py
          python3 tools/merge_to_xiaozhi.py --check

      # ⚠️ 注入副本在 `firmware/xiaozhi/.gitignore` 里，**永远不会出现在
      # `git status` / `git diff` 里** ⇒ 它落后于源树时，本地和 CI 都看不出来，
      # 编出来的固件用的是旧逻辑（2026-10-20 的"改了引导逻辑但屏上还是没码"
      # 就是这一类）。`diff -rq` 是唯一能发现它的手段，必须紧跟在 merge 之后。
      - name: 合并完整性校验（注入副本须与源树逐字节一致）
        run: |
          set -e
          if ! diff -rq firmware/components/elder firmware/xiaozhi/components/elder; then
            echo "::error::注入副本与源树不一致 —— merge 未生效或只拷了一半"
            exit 1
          fi
          echo "注入副本与源树一致"

      - name: 按输入覆盖板卡与后端地址
        env:
          BOARD_SYM: ${{ inputs.board || 'CONFIG_BOARD_TYPE_LICHUANG_DEV_S3' }}
          SERVER_URL: ${{ inputs.server_url }}
        run: |
          set -e
          DEF="$PROJECT_DIR/sdkconfig.defaults"
          python3 - "$DEF" "$BOARD_SYM" "$SERVER_URL" <<'PY'
          import re, sys
          path, board, url = sys.argv[1], sys.argv[2], sys.argv[3]
          s = open(path, encoding='utf-8').read()
          # 板卡：先把所有 CONFIG_BOARD_TYPE_* 置 n，再打开目标项
          s = re.sub(r'^CONFIG_BOARD_TYPE_\w+=y$', lambda m: m.group(0)[:-1] + 'n',
                     s, flags=re.M)
          if re.search(rf'^{re.escape(board)}=', s, flags=re.M):
              s = re.sub(rf'^{re.escape(board)}=.*$', f'{board}=y', s, flags=re.M)
          else:
              s += f'\n{board}=y\n'
          if url.strip():
              if re.search(r'^CONFIG_ELDER_SERVER_URL=', s, flags=re.M):
                  s = re.sub(r'^CONFIG_ELDER_SERVER_URL=.*$',
                             f'CONFIG_ELDER_SERVER_URL="{url.strip()}"', s, flags=re.M)
              else:
                  s += f'\nCONFIG_ELDER_SERVER_URL="{url.strip()}"\n'
          open(path, 'w', encoding='utf-8').write(s)
          print('板卡 =', board)
          print('后端 =', url.strip() or '(沿用默认)')
          PY
          echo "--- sdkconfig.defaults 关键行 ---"
          grep -E 'BOARD_TYPE|ELDER_SERVER_URL|EMOTE|SPIRAM|FLASHSIZE|PARTITION' "$DEF" || true

      # ⚠️ 放在「覆盖板卡与地址」**之后**：自检读的就是被覆盖完的最终值。
      #
      # 防的是 2026-10-19 那类事故：**改了 sdkconfig.defaults 但固件没变**。
      # kconfig 以已存在的 sdkconfig 为准、defaults 只在首次生成时参与，
      # 且**不报错不告警** ⇒ 症状是「唤醒词改成小暖了但设备只认小智」。
      # CI 是干净环境（无 sdkconfig）所以这里本就会绿——真正的风险在本地，
      # 但让**同一套判据**在两边跑，才能保证「本地过了 = CI 会过」。
      - name: 编译前配置自检
        run: |
          set -e
          python3 tools/prebuild_check.py --strict

      - name: 缓存 IDF 组件与 ccache
        uses: actions/cache@v4
        with:
          path: |
            firmware/xiaozhi/managed_components
            /root/.ccache
          key: idf-${{ inputs.idf_version || 'v5.5.1' }}-${{ hashFiles('firmware/xiaozhi/dependencies.lock', 'firmware/xiaozhi/main/idf_component.yml') }}
          restore-keys: |
            idf-${{ inputs.idf_version || 'v5.5.1' }}-

      # ⚠️ sdkconfig 与 build/ **刻意不进缓存**：runner 是干净环境，
      #    sdkconfig 每次由 idf.py set-target 从 sdkconfig.defaults + Kconfig
      #    重新生成。若把本地那份 build/（含指向第三方 OTA 的 sdkconfig）
      #    缓存进来，坏配置会被静默烧进固件 —— 宁可每次多花几十秒重新生成。

      - name: set-target（生成 sdkconfig）
        shell: bash
        run: |
          set -e
          . "$IDF_PATH/export.sh"
          cd "$PROJECT_DIR"
          idf.py set-target "$IDF_TARGET"
          grep -E 'CONFIG_BOARD_TYPE|CONFIG_ELDER_SERVER_URL|CONFIG_USE_EMOTE|CONFIG_SPIRAM' sdkconfig | head -12 || true

      # ⚠️ 第二次自检，位置在 set-target **之后**。
      #
      # 2026-10-19 CI 失败的真因：第一次自检排在 set-target 之前，
      # 而 `build/config/sdkconfig.h` 正是 set-target 才生成的 ⇒ CI 干净环境下
      # 该文件必然不存在 ⇒ C3b 判「缺文件」⇒ --strict 把它当失败 ⇒
      # **编译根本没开始就被自检拦下**。
      #
      # 这次复检有真实判据可查：
      #   * C1 现在能查 sdkconfig 残留冲突（第一次自检时 sdkconfig 还不存在）
      #   * C3b 能确认 CONFIG_IDF_TARGET 真是 esp32s3，而不是默认的 esp32
      #     ——后者曾导致 esp_video 的 rule 把摄像头组件判成无用、编出烧上去
      #       不能用的固件，而且全程不报错
      - name: 编译前配置自检（set-target 后复检）
        run: |
          set -e
          python3 tools/prebuild_check.py --strict

      - name: 编译
        shell: bash
        env:
          IDF_CCACHE_ENABLE: '1'
        run: |
          # ⚠️ 必须 pipefail：idf.py build | tail 时管道退出码取自 tail(0)，
          #    会把构建失败吞掉，导致后续步骤才莫名失败、看不到真正的错误。
          set -eo pipefail
          . "$IDF_PATH/export.sh"
          cd "$PROJECT_DIR"
          idf.py build 2>&1 | tee build/ci-build.log | tail -120
          echo "=== 产物 ==="
          ls -lh build/*.bin build/bootloader/*.bin build/partition_table/*.bin 2>/dev/null || true

      # 体积排名（只读报告，不参与判定）。
      # 为什么必须有：删「用不到的代码」如果只按组件名或印象猜，十次有八次删错
      # 对象 —— 体积几乎不动、功能却回归了。这份排名直接给出谁在占地方，
      # 同时写进 job summary，省得每次下整份日志翻。
      - name: 固件体积报告（组件排名）
        shell: bash
        run: |
          set -eo pipefail
          . "$IDF_PATH/export.sh"
          cd "$PROJECT_DIR"
          idf.py size-components 2>&1 | tee build/size-components.txt > /dev/null
          echo "=== 组件占用排名（前 45 行）==="
          head -45 build/size-components.txt
          echo
          echo "=== app / assets 分区占用 ==="
          python3 - <<'PY'
          import pathlib
          app = sorted(pathlib.Path('build').rglob('xiaozhi.bin'))
          if app:
              n = app[0].stat().st_size
              print(f'  xiaozhi.bin      {n:>9,d} B   app 分区 4,128,768 B   余量 {4128768-n:,d} B ({(4128768-n)*100/4128768:.1f}%)')
          for p in ('generated_assets.bin',):
              f = pathlib.Path('build') / p
              if f.exists():
                  n = f.stat().st_size
                  print(f'  {p:16s}  {n:>9,d} B   assets 分区 8,388,608 B  余量 {8388608-n:,d} B')
          PY
          {
            echo '### 固件体积（size-components 前 45 行）'
            echo '```'
            head -45 build/size-components.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # ⚠️ **产物级断言**：只断言"编译成功"正是 2026-10-19 那次事故能漏过去的
      # 直接原因 —— 源码改了、编译也绿，但二进制里没有新代码，用户烧完发现行为
      # 一点没变，而所有日志/CI 都是绿的。这里直接对 .bin 做字节检索。
      - name: 产物自检（新代码确实进了固件）
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"
          python3 - <<'PY'
          import pathlib, sys
          bins = sorted(pathlib.Path('build').rglob('xiaozhi.bin'))
          if not bins:
              sys.exit('找不到 build/**/xiaozhi.bin')
          data = bins[0].read_bytes()
          # 7 位激活码的屏显格式串（elder_bind_guide.cc::show_guide）
          needle = '激活码\n%s\n%s'.encode()
          if needle not in data:
              sys.exit('固件里检索不到屏显新格式串 ⇒ 改的代码没编进去（不是编译失败，是没生效）')
          # 反面：旧 13 位实现的格式串必须已经不存在
          if '%s\n激活码 %s'.encode() in data:
              sys.exit('固件里仍有旧的 ShowNotification 格式串 ⇒ 注入副本是旧版')
          print(f'产物自检通过：{bins[0]} {len(data)} bytes')

          # ---- 双引擎唤醒模型必须**真在产物里**（2026-10-20 加）----
          # 为什么不能只查配置：build_default_assets.py 里 wakenet 的打包条件是
          #   use_esp_wake_word or use_afe_wake_word
          # 而本项目为了自定义唤醒词+离线命令词必须选 CONFIG_USE_CUSTOM_WAKE_WORD=y，
          # 于是 wakenet 被**静默跳过** —— CONFIG_SR_WN_WN9_NIHAOXIAOAN_TTS2=y 照样
          # 出现在 sdkconfig、prebuild_check 的 C2b2/C2b3/C2b4 全部 PASS，但
          # srmodels.bin 里一个 wn9 都没有。真机症状：WakeNet 引擎拿不到模型，
          # 「两个引擎都保留」退化成纯 MultiNet（唤醒率明显变低），且没有任何报错。
          # 所以这里只能认产物：assets 里必须同时出现 mn7_cn 与 wn9_nihaoxiaoan。
          assets = sorted(pathlib.Path('build').rglob('generated_assets.bin'))
          if not assets:
              sys.exit('找不到 build/**/generated_assets.bin ⇒ 无从校验唤醒模型')
          adata = assets[0].read_bytes()
          for pat, why in ((b'mn7_cn', 'MultiNet（自定义唤醒词 + 离线服药命令词）'),
                           (b'wn9_nihaoxiaoan', 'WakeNet「你好小安」唤醒模型')):
              if pat not in adata:
                  sys.exit(
                      f'assets 里检索不到 {pat.decode()} ⇒ {why}没被打包进去。'
                      f'注意：这不是编译失败，是配置自检全绿但引擎拿不到模型。'
                  )
          print(f'双引擎模型自检通过：{assets[0].name} 同时含 mn7_cn 与 wn9_nihaoxiaoan'
                f'（{len(adata)} bytes）')
          PY

      - name: 校验 OTA 地址指向本项目服务端
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"
          # CONFIG_OTA_URL 默认值在 main/Kconfig.projbuild（https://152.136.230.132/api/voice/ota）。
          # 本工作流只覆盖 CONFIG_ELDER_SERVER_URL，不动 OTA_URL —— 这里是把关：
          # 万一将来有人改掉默认值或 sdkconfig.defaults 里覆盖了它，构建日志必须当场可见。
          # sdkconfig 是 set-target 刚生成的新文件，不含本机历史构建的残留。
          #
          # ⚠️⚠️ 2026-10-18 事故：本步骤曾**只打 ::warning:** —— 一次构建里
          #   CONFIG_OTA_URL = https://voice.25088866.xyz/api/voice/ota
          #   （正确域名 voice.250886.xyz 多了一个 8），warning 打完 job 照绿、
          #   用户照下固件，设备全连去一个不存在的域名，静默失声。
          #   **warning 在绿色流水线里等于不存在**，故升级为失败即红：
          #   只放行 ①本项目 IP ②本项目域名 ③明文 http（仅可能是内网联调），其余一律 exit 1。
          OTA="$(grep -E '^CONFIG_OTA_URL=' sdkconfig | head -1 | cut -d= -f2- | tr -d '"' || true)"
          if [ -z "$OTA" ]; then
            # sdkconfig 没落显式行 ⇒ 生效值是 Kconfig.projbuild 的 default。
            # 把默认值也抓来一起校验，堵住"只改 Kconfig 默认值"的漏网形态。
            OTA="$(grep -A3 '^config OTA_URL' main/Kconfig.projbuild \
                    | grep -m1 'default' | sed 's/.*default "//; s/".*//' || true)"
            echo "CONFIG_OTA_URL 未在 sdkconfig 显式设置 -> Kconfig.projbuild 默认值：${OTA:-<解析失败>}"
          else
            echo "CONFIG_OTA_URL = $OTA"
          fi
          case "$OTA" in
            https://152.136.230.132/*)
              echo "OTA 地址指向本项目服务端（IP 直连），OK" ;;
            https://voice.250886.xyz/*)
              echo "OTA 地址指向本项目服务端（域名，备案恢复后的形态），OK" ;;
            http://*)
              # 明文 http 只可能是内网/本机联调（公网 OTA 必须 https）。放行但大声标注。
              echo "::warning::OTA 地址是明文 http（$OTA）—— 仅限内网联调，别让它流出到出厂固件" ;;
            *)
              echo "::error::CONFIG_OTA_URL 既不是本项目 IP（https://152.136.230.132/...）/域名（https://voice.250886.xyz/...）也不是内网 http 地址（当前：${OTA:-<空>}）"
              echo "::error::2026-10-18 事故形态：错误域名静默烧进固件而 job 照绿。构建中止。"
              echo "::error::确需指向别处：先改 main/Kconfig.projbuild 或 sdkconfig.defaults，并同步更新本校验与 docs/DEPLOY.md。"
              exit 1 ;;
          esac

      # 失败时把真正的编译错误打出来（上面的 tail -120 可能被 LVGL 的 #warning 刷屏盖住）
      - name: 输出编译错误（失败时）
        if: failure()
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          echo "=== 从完整日志中提取错误 ==="
          grep -nE "^FAILED:|error:|undefined reference|No such file or directory|collect2: error" build/ci-build.log 2>/dev/null | head -60 || true
          echo "=== idf.py 控制台日志 ==="
          grep -nE "^FAILED:|error:|undefined reference" build/log/idf_py_stdout_output_* 2>/dev/null | head -40 || true

      - name: 生成单文件烧录镜像
        shell: bash
        run: |
          set -e
          . "$IDF_PATH/export.sh"
          cd "$PROJECT_DIR"
          # ⚠️⚠️ `-o` 后面**不能**带 build/ 前缀。
          # idf.py merge-bin 内部会先 chdir 到 build 目录再调 esptool（日志里
          # 明确打印 "Running merge_bin in directory .../firmware/xiaozhi/build"），
          # 于是 `-o build/merged-flash.bin` 被解析成 build/build/merged-flash.bin，
          # 父目录不存在 ⇒ esptool 抛 FileNotFoundError、退出码 1。
          # 这个失败曾被 `|| echo warning` 吞掉，而后 summary 无条件写着
          # 「烧录用这一个 elder-firmware-esp32s3-merged-flash.bin」——
          # **用户按提示去下载，文件根本不存在**。绿灯 + 不存在的文件 = 最坏的一种假绿。
          # 现在：失败即失败，不再吞。
          idf.py merge-bin -o merged-flash.bin
          test -s build/merged-flash.bin || {
            echo "::error::merged-flash.bin 未生成，单文件烧录镜像不可用"
            exit 1
          }
          echo "merged-flash.bin = $(stat -c%s build/merged-flash.bin) 字节"

      # ⚠️⚠️ **合并镜像自检**：上面「产物自检」是在 build/**/xiaozhi.bin 上做
      #   **串检索（presence）**，它对「偏移错位」天然零鉴别力 —— 串放错位置也照样
      #   在，断言照样绿。而用户烧的是合并镜像。两种静默失败必须分开抓：
      #     A. merge 读到旧/别人的 xiaozhi.bin（缓存、并发、路径串了）→ 串检索能抓
      #     B. 读对了但 app 偏移错位 / flasher_args 被改     → 串检索**抓不到**
      #   所以这里不做串检索，做**按 flasher_args.json 声明的偏移逐字节比对**。
      #   跟着 flasher_args.json 走、不硬编码 0x20000：merge-bin 本身就是读这个
      #   文件拼的，用同一个源判定，才不至于「断言和拼装各说一套」。
      #
      #   ⚠️ 校验**全部** flash_files 段，不止 app：assets（语音资源）段换回旧版
      #   是最难查的一类 —— 固件逻辑全对、代码全对，但语音资源是旧的，表现为
      #   「行为怪但一切看起来都对」。只比 app 段会放过它。
      #
      #   ⚠️⚠️ 光比 `merged[off:off+len(want)] == want` 仍是**前缀比对**：
      #   want 被截断（比如 merge 读到一个只写了一半的文件）时前缀照样相等，
      #   断言照样绿 —— 而步骤名写着「逐字节一致」，**名字比行为强**正是这一轮
      #   反复栽的形态。故补一条：本段结束到下一段起点之间的填充必须全是 0xFF。
      #   esptool merge-bin 的填充值就是 0xFF（已在真实产物上逐段实测：各间隙
      #   非 0xFF 字节数为 0），所以「有非 0xFF 残留」只可能是 app 被截断后
      #   后面还留着别的数据。
      #
      #   ⚠️ 本闸门只能发现「合并镜像与 build/ 源文件不一致」。以下两类发现不了，
      #   因为它的参照物只有输入本身，没有产物之外的锚点：
      #     ① 源文件与镜像**一致地**被损坏（构建期源就坏了，merge 忠实传递）：
      #        源、镜像、长度、偏移、内容五个维度全部自洽，与"基准"无法区分。
      #     ② 截断落在"真实内容恰好等于填充值 0xFF"的区域：
      #        ota_data_initial.bin 整段 8192B 全是 0xFF、partition-table.bin 尾
      #        2848B 是 0xFF，截掉后原地留下的填充与真值逐字节相同。
      #   ② 里这两段能关，是因为**长度由 ESP-IDF 规范钉死**（分区表恒 0xC00、
      #   ota_data_initial 恒 0x2000）—— 规范常量就是产物之外的锚点，
      #   见下面 FIXED_LEN。其余段长度随构建变，没有这种锚点。
      #   ① 要闭合需引入产物之外的尺寸锚点（app 有 ESP image header 可用，
      #   assets 无任何内部锚点）—— 属于生成端职责，不在本步骤反推。
      #   **刻意只闭合能闭合的、明说关不掉的**：部分闭合会制造"这一维已覆盖"
      #   的错觉，比不闭合更危险。
      - name: 合并镜像自检（各段与 build/ 源文件逐字节一致）
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"
          python3 - <<'PY'
          import json, pathlib, sys
          b = pathlib.Path('build')
          args = json.loads((b / 'flasher_args.json').read_text())
          merged = (b / 'merged-flash.bin').read_bytes()
          segs = sorted((int(o, 16), f) for o, f in args['flash_files'].items())
          #: ESP-IDF 规范里**长度固定**的段。间隙全 0xFF 这条不变量有个盲区：
          #  若某段内容本身就以 0xFF 结尾（ota_data_initial 整段都是 0xFF，
          #  分区表的尾部也是），把它截断后「前缀相等 + 间隙全 0xFF」两条都成立
          #  ⇒ 截断被静默放过。这两段长度是规范钉死的，直接按常量判。
          #  其余段（bootloader / app / assets）长度随构建变，没有独立真源，
          #  **盲区无法消除** —— 见本步骤末尾的已知边界说明。
          FIXED_LEN = {'partition-table.bin': 0xC00, 'ota_data_initial.bin': 0x2000}
          bad, checked = [], 0
          for i, (off, fname) in enumerate(segs):
              f = b / fname
              if not f.exists():
                  bad.append(f'{fname}: 源文件不存在'); continue
              want = f.read_bytes()
              if not want:
                  # 空源文件：`merged[off:off] == b''` 恒成立，会一路绿到底
                  bad.append(f'{fname}: 源文件为空（0 字节）'); continue
              base = pathlib.PurePosixPath(fname).name
              if base in FIXED_LEN and len(want) != FIXED_LEN[base]:
                  bad.append(f'{fname}: 长度 {len(want)} != 规范 {FIXED_LEN[base]:#x}'
                             f'（若 IDF 改了规范请更新 FIXED_LEN）'); continue
              if len(merged) < off + len(want):
                  bad.append(f'{fname}: 合并镜像太短（{len(merged)} < {off:#x}+{len(want)}）'); continue
              if merged[off:off + len(want)] != want:
                  bad.append(f'{fname}: {off:#x} 处与源文件不一致'); continue
              # 截断防线：本段之后到下一段之前必须是纯 0xFF 填充
              nxt = segs[i + 1][0] if i + 1 < len(segs) else len(merged)
              end = off + len(want)
              if end > nxt:
                  # 段重叠：不静默跳过。重叠说明 flasher_args 与分区表已经不自洽，
                  # 此时「比对了通过」没有意义 —— 必须红。
                  bad.append(f'{fname}: 段区间 {off:#x}..{end:#x} 越过下一段起点 {nxt:#x}（段重叠）')
                  continue
              gap = merged[end:nxt]
              non_ff = len(gap) - gap.count(0xFF)
              if non_ff:
                  # 把**实际字节**打出来：截断与「esptool 改了填充约定」会报同一句话，
                  # 但修法完全相反（前者产物坏了要重烧，后者要改本闸门）。只给非 0xFF
                  # 的字节数，看日志的人无从区分这两种情况。
                  uniq = sorted(set(gap))[:4]
                  bad.append(f'{fname}: {end:#x}..{nxt:#x} 非 0xFF 填充'
                             f'（{len(gap)} 字节，实际字节 {uniq}）'
                             f' —— 源文件疑似被截断；若为 [0] 则是填充策略变了')
                  continue
              checked += 1
              print(f'  OK {fname:34s} {len(want):>9d} 字节 @ {off:#x}  (间隙 {len(gap)}B 全 0xFF)')
          if bad:
              sys.exit('合并镜像与源文件不一致 ⇒ 偏移错位 / 段被截断 / merge-bin 读到旧文件：\n  '
                       + '\n  '.join(bad))
          print(f'全部 {checked} 段逐字节一致且间隙纯 0xFF，合并镜像总长 {len(merged)} 字节')
          print('')
          print('已知边界（不要假装本闸门能覆盖）：')
          print('  bootloader / app / assets 三段长度随构建变化，没有独立真源，')
          print('  因此「该段尾部本身就是 0xFF 时被截断」无法检出。')
          print('  要彻底消除，需要 esptool 输出各段真实长度（上游不支持），')
          print('  或改为自建合并镜像并逐段比对（同样受此限）。')
          PY

      - name: 整理产物
        if: always()
        run: |
          set -e
          mkdir -p "$GITHUB_WORKSPACE/out"
          cd "$PROJECT_DIR"
          cp -v build/bootloader/bootloader.bin        "$GITHUB_WORKSPACE/out/" 2>/dev/null || true
          cp -v build/partition_table/partition-table.bin "$GITHUB_WORKSPACE/out/" 2>/dev/null || true
          cp -v build/ota_data_initial.bin             "$GITHUB_WORKSPACE/out/" 2>/dev/null || true
          cp -v build/generated_assets.bin             "$GITHUB_WORKSPACE/out/" 2>/dev/null || true
          # 单文件烧录镜像：改名成一眼能认出的名字（artifact 里散落一堆 bin 时，
          # 用户最容易搞错的就是"该烧哪个"）。flasher_args.json 不引用它，改名安全。
          # ⚠️ 这一步是**硬校验**：merged 镜像是用户日常唯一要烧的文件，
          # 它不在就说明上面的步骤出了问题，必须让 job 红掉而不是静默交付一堆散件。
          if [ ! -s build/merged-flash.bin ]; then
            echo "::error::build/merged-flash.bin 不存在 —— 不再产出只含散件的 artifact"
            echo "::error::（曾经发生：job 绿、summary 让用户下一个从未生成的文件）"
            exit 1
          fi
          cp -v build/merged-flash.bin \
               "$GITHUB_WORKSPACE/out/elder-firmware-esp32s3-merged-flash.bin"
          cp -v build/flasher_args.json                "$GITHUB_WORKSPACE/out/" 2>/dev/null || true
          # 应用镜像文件名随工程名变化，统一抓取。
          # ⚠️ 必须排除 merged-flash.bin：它就在 build/ 根下，不排除会被再拷一份，
          #    artifact 里于是出现两个 12.4MB 的同内容大文件（其中一个还叫模糊的名字），
          #    用户「该烧哪个」的困惑正是这么来的。合并镜像上面已按固定名拷过。
          find build -maxdepth 1 -name "*.bin" \
               ! -name "generated_assets.bin" ! -name "ota_data_initial.bin" \
               ! -name "merged-flash.bin" -exec cp -v {} "$GITHUB_WORKSPACE/out/" \; 2>/dev/null || true
          echo "=== 收集到的产物 ==="
          ls -lh "$GITHUB_WORKSPACE/out" || true
          test -n "$(ls -A "$GITHUB_WORKSPACE/out")" || { echo "::error::未收集到任何 bin"; exit 1; }

      # ⚠️ **最终上传件自检**：上面那道「产物自检」在 merge-bin 之前、且只查
      #    build/**/xiaozhi.bin —— 它证明「编译出的应用镜像里有新代码」，
      #    但用户真正烧的是 out/elder-firmware-esp32s3-merged-flash.bin。
      #    这两者之间还隔着一次 esptool 合并，历史上恰恰在这一段出过事
      #    （合并镜像没生成 / 拷错文件 / 用户下到散件）。所以这里对
      #    **即将被 upload-artifact 打包的那份字节**再断言一遍。
      - name: 产物自检（最终上传的合并镜像）
        shell: bash
        run: |
          set -e
          cd "$GITHUB_WORKSPACE/out"
          python3 - <<'PY'
          import pathlib, sys
          merged = pathlib.Path('elder-firmware-esp32s3-merged-flash.bin')
          if not merged.exists() or merged.stat().st_size == 0:
              sys.exit('最终上传件 elder-firmware-esp32s3-merged-flash.bin 不存在或为空')
          data = merged.read_bytes()
          needle = '激活码\n%s\n%s'.encode()
          if needle not in data:
              sys.exit('合并镜像里检索不到屏显新格式串 ⇒ 用户烧的那份文件里没有这次修复')
          if '%s\n激活码 %s'.encode() in data:
              sys.exit('合并镜像里仍有旧的 ShowNotification 格式串 ⇒ 合并进来的是旧应用镜像')
          # 偏移级一致性由上面「合并镜像自检（app 段逐字节一致）」负责。
          # 这里刻意**不再**做 `app_bytes in data` 的包含性判断：它和串检索同族，
          # 偏移错位时仍然成立，只会给人「已经校验过了」的错觉。
          print(f'最终上传件自检通过：{merged.name} {len(data)} 字节')
          PY

      # ⚠️ 交付的 flasher_args.json 必须**路径可解析**。
      #   「整理产物」把 bootloader/ 与 partition_table/ 两个子目录里的文件**平铺**
      #   拷进 out/，而 json 里仍写着 `bootloader/bootloader.bin`、
      #   `partition_table/partition-table.bin` ⇒ 用户照 json 烧会找不到文件，
      #   而 README 里那句「其余文件是按 flasher_args.json 分地址烧写的备选」
      #   就成了假话（与「让用户去下一个从未生成的文件」同一族）。
      #
      #   ⚠️ 必须同时改**嵌套子对象**：json 里除了 flash_files，还有
      #   bootloader / app / partition-table / otadata / assets 五个子对象
      #   各自带 `file` 字段。只改 flash_files 会让 json **内部自相矛盾**
      #   （同一段两处路径不同），比不改更难查。
      #
      #   位置**必须在「生成 SHA256SUMS」之前**：否则清单哈希的是改写前的 json，
      #   用户拿清单对账会对不上。
      - name: 重写交付的 flasher_args.json（平铺布局下路径须可解析）
        shell: bash
        run: |
          set -e
          cd "$GITHUB_WORKSPACE/out"
          python3 - <<'PY'
          import json, pathlib, sys
          j = pathlib.Path('flasher_args.json')
          if not j.exists():
              sys.exit('out/flasher_args.json 不存在 —— 整理产物步骤未拷入')
          args = json.loads(j.read_text(encoding='utf-8'))
          known = set(args['flash_files'].values())
          def rewrite(o):
              if isinstance(o, dict):
                  return {k: rewrite(v) for k, v in o.items()}
              if isinstance(o, list):
                  return [rewrite(v) for v in o]
              if isinstance(o, str) and o in known:
                  return pathlib.PurePosixPath(o).name
              return o
          new = rewrite(args)
          j.write_text(json.dumps(new, indent=4, ensure_ascii=False), encoding='utf-8')
          missing = sorted(p for p in set(new['flash_files'].values())
                           if not pathlib.Path(p).exists())
          if missing:
              sys.exit(f'重写后仍有不可解析路径：{missing}')
          print('flasher_args.json 已按平铺布局重写，'
                f'{len(new["flash_files"])} 段路径全部可解析')
          for k in ('bootloader', 'app', 'partition-table', 'otadata', 'assets'):
              sub = new.get(k)
              if isinstance(sub, dict) and 'file' in sub:
                  ok = pathlib.Path(sub['file']).exists()
                  print(f'  子对象 {k:16s} -> {sub["file"]:28s} exists={ok}')
          PY

      - name: 生成 SHA256SUMS（用户烧录前对账）
        shell: bash
        run: |
          set -e
          cd "$GITHUB_WORKSPACE/out"
          # job summary 里只印 16 位截断值，用户没法拿它和本地 sha256 对账
          # （sha256sum 出来是 64 位）。这里给一份完整摘要文件，随 artifact 一起下发。
          #
          # ⚠️ 不能写 `sha256sum * > SHA256SUMS.txt`：`*` 展开**先于**重定向，
          #   重跑时 SHA256SUMS.txt 已在 glob 结果里 ⇒ 它被算进自己的清单
          #   （内容每跑一次都变，且是自我指涉）。显式跳过自己，先写临时文件再改名。
          : > /tmp/SHA256SUMS.txt
          for f in *; do
            [ -f "$f" ] || continue
            [ "$f" = "SHA256SUMS.txt" ] && continue
            sha256sum "$f" >> /tmp/SHA256SUMS.txt
          done
          mv /tmp/SHA256SUMS.txt SHA256SUMS.txt
          # 空清单会静默交付一个「什么都没有」的对账文件 —— 用户以为有校验，
          # 实际 `sha256sum -c` 什么也不验。必须红。
          test -s SHA256SUMS.txt || { echo "::error::out/ 无可校验文件"; exit 1; }
          cat SHA256SUMS.txt

      - name: 汇总产物信息（job summary）
        if: always()
        shell: bash
        run: |
          # 名字/大小/校验和打进 job summary：用户不用下载就能确认下对了文件，
          # 也能跟本地 esptool 烧录前的 md5 对账。
          # ⚠️ 校验和必须打**完整 64 位**：曾经只 `cut -c1-16`，用户本地
          #    `sha256sum` 出来的 64 位没法直接比对（得手工截断），等于给了个
          #    不可用的对账工具 —— 而「用户到底烧了哪个文件」正是本轮事故里
          #    最需要回答的问题。完整值同时落进 out/SHA256SUMS.txt 随 artifact 下发。
          cd "$GITHUB_WORKSPACE/out" 2>/dev/null || exit 0
          {
            echo "### ESP32-S3 固件产物（artifact: elder-firmware-esp32s3）"
            echo
            echo "| 文件 | 字节数 | SHA256 |"
            echo "| --- | --- | --- |"
            for f in *; do
              [ -f "$f" ] || continue
              # SHA256SUMS.txt 由上一步生成，别把它自己也列进表里（自我指涉）
              [ "$f" = "SHA256SUMS.txt" ] && continue
              printf '| `%s` | %s | `%s` |\n' \
                "$f" "$(stat -c%s "$f" 2>/dev/null || echo '?')" \
                "$(sha256sum "$f" 2>/dev/null | cut -d' ' -f1 || echo '?')"
            done
            echo
            echo "**烧录用这一个**：\`elder-firmware-esp32s3-merged-flash.bin\`（offset 0x0，esptool 单文件直烧）"
            echo "其余文件是按 \`flasher_args.json\` 分地址烧写的备选；日常只下 merged 那个即可。"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 上传固件产物
        uses: actions/upload-artifact@v4
        with:
          name: elder-firmware-esp32s3
          path: out/
          retention-days: 30
          if-no-files-found: error
