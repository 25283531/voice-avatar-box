name: server-ci

# 后端代码检查：每次改动 server/ 或 tools/ 都跑一遍业务闭环冒烟测试。
# 覆盖：健康检查 -> 登录 -> 设备 -> 激活码(Luhn 与固件一致) -> 绑定
#       -> 提醒复杂规则 -> 排期 -> 设备同步 -> 回执 -> 统计 -> 鉴权
on:
  push:
    branches: [main, master]
    paths:
      - 'server/**'
      - 'tools/**'
      # ↓ firmware/components/elder/ 是 elder-host-test job 的被测代码：
      # reminder.c 一改就必须重跑宿主测试，否则「改了固件不跑
      # 对应门禁」就等于那个 job 形同虚设。之前漏了这条，改固件不会触发它。
      - 'firmware/components/elder/**'
      - '.github/workflows/server-ci.yml'
  pull_request:
    paths:
      - 'server/**'
      - 'tools/**'
      - 'firmware/components/elder/**'
      - '.github/workflows/server-ci.yml'
  workflow_dispatch:

jobs:
  smoke:
    name: 后端冒烟测试
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # ⚠️⚠️ **这里的弱口令是刻意的，不要照抄到生产。** 逐条说清：
      #
      #  1. 为什么要设：tools/ 下 8 个冒烟脚本（smoke_server / roles / home /
      #     models / mail / memory / usage / admin_presets）**硬依赖**
      #     admin/admin123 登录。改造它们会让范围失控，于是改在这里集中供一次。
      #  2. 为什么弱口令在这里**没有现实风险**：GitHub 托管的 runner 是**一次性
      #     虚拟机**、跑完即销毁，且**不可从公网访问**；它连的数据库是 runner 本地
      #     的 SQLite / 临时 MySQL，跑完一起没。不存在"攻击者能用它登录"。
      #  3. ⚠️ 反过来说：**这个变量的语义是"我明确接受一个新装库使用弱种子口令"**，
      #     生产/内网/任何长期存在的环境**都不该**设它 —— 不设才会走随机口令分支
      #     （`secrets.token_urlsafe(16)`，启动日志 WARNING 打一次）。
      #  4. ⚠️ 它只在**空库**建种子账号时生效，对存量库没用。存量库请走
      #     `ELDER_RESET_ADMIN_PASSWORD` 一次性轮换（见 docs/DEPLOY.md §5.2）。
      ELDER_SEED_ADMIN_PASSWORD: admin123
    defaults:
      run:
        working-directory: .
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: server/requirements.txt

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r server/requirements.txt

      # 语音链路要 ctypes 直连系统 libopus 编解码。**CI 必须装**，否则
      # smoke_voice 里最关键的两条编解码断言会走 SKIP 分支变绿 —— 那是假绿：
      # 编码/解码没真跑过，却显示「全过」。GitHub 的 ubuntu-latest 自带 libopus，
      # 这里仍显式 apt 装一次：不依赖 runner 镜像的隐式状态，换 runner 也不会突然变 SKIP。
      - name: 安装 libopus
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libopus0
          ldconfig -p | grep -i opus || (echo "::error::libopus 未进入动态链接库缓存" && exit 1)

      # 挡住「用 urllib.parse.urlparse 解析 SQLite 连接串」的回退：
      # urlparse 会把 sqlite:///C:/a/b.db 的 path 解析成 /C:/a/b.db，
      # Windows 上 mkdir 直接抛 WinError 123（文件名、目录名或卷标语法不正确），
      # 服务一启动就崩。必须用 SQLAlchemy 自己的 make_url()。
      # 三个形态一起断言，顺带守住 sqlite:////data/elder.db 的四斜杠（绝对路径）写法。
      - name: 校验 SQLite 连接串解析
        run: |
          python - <<'PY'
          from sqlalchemy.engine import make_url

          cases = {
              "sqlite:///./x.db": "./x.db",
              "sqlite:////data/elder.db": "/data/elder.db",
              "sqlite:///C:/a/b.db": "C:/a/b.db",
          }
          for url, expected in cases.items():
              got = make_url(url).database
              assert got == expected, f"{url} -> {got!r}, 期望 {expected!r}"
              print(f"OK {url} -> {got}")
          PY

      # 上面那步守的是「连接串能不能被正确解析」，**不守「默认值落在哪」** ——
      # 而后者才是运行库跑进仓库树、再被 `git clean -xdf` 静默删掉的成因
      # （design-p2 §B.1 R2/R3）。本步是今天**唯一**管默认值位置的断言。
      #
      # 它是纯函数直调（不起服务、不建 uvicorn）：解析逻辑在 app/dbpath.py 里，
      # 所以能在同一进程内被喂各种输入。⚠️ 这条**必须**留在 CI 里：本机（Windows）
      # 与 runner（Linux）的默认目录布局不同，本地跑绿不能证明 CI 分支对。
      - name: 运行库默认路径解析冒烟（含双库冲突 / 0 字节 / 不落回仓库树）
        run: python tools/run_smoke.py logs/smoke_smoke_db_path.log python tools/smoke_db_path.py

      # 提醒提示音乐是**固化进固件的资源**（assets/common/reminder_chime.ogg，
      # 由 tools/make_reminder_chime.py 生成）。它被删/换坏/忘接进 OnPlayTone 时，
      # 运行时**零报错**：提醒照样到点、屏照样变、回执照样回，只是没有声音。
      # 这条静态门禁同时守住「先响音乐、再念内容」这个顺序（顺序反了照样能编译）。
      # 纯文件解析 + 源码切片，不起服务；A8 的逐包解码在 runner（有 libopus0）真跑。
      - name: 提醒音乐资源门禁（OGG 结构 / 时长 / 固件接入顺序）
        run: python tools/run_smoke.py logs/smoke_smoke_reminder_chime.log python tools/smoke_reminder_chime.py

      # P0：`devices.id` 无 AUTOINCREMENT ⇒ 删掉最大行后 pk 被复用，而已删设备的
      # 旧 device_token（ep 与代次都是 0）会**通过鉴权读到另一家人**的提醒与回执；
      # 同一根因还有一条不需要 token 的通道（Interaction / ChatUsage 无 cascade ⇒
      # 孤儿行挂到新设备名下）。两条都必须在这一步变红。
      #
      # 为什么必须起真实服务：缺陷依赖「删→建→旧 token」三跳的**跨请求状态**，
      # 进程内直调测不出来。P5 是前置自检——若哪天引擎不再复用 pk，P5 会
      # **SKIP 并单独列出**（不是 PASS），P1/P2/P3 一并 SKIP，避免反向假绿。
      - name: 设备 pk 复用 / 旧 token 复活冒烟（P0，含 WS 侧与从属行）
        run: python tools/run_smoke.py logs/smoke_smoke_pk_reuse.log python tools/smoke_pk_reuse.py

      # P0：SQLite 默认 rollback-journal 下「一个读事务挂住 ⇒ 所有写事务失败」。
      # 2026-10-20 生产实证：老人说话的同一分钟里
      #   UPDATE devices SET last_seen_at=?  -> 500 database is locked（后台看着像离线）
      #   埋点写入失败（不影响本轮对话）      -> 用量/记忆账本静默丢失
      # 语音回合里 ASR/LLM/TTS 每段都是秒级网络等待，读事务长挂是**常态**。
      # 这条用例自带反向自检：退回 rollback-journal 必须真的抛 locked，
      # 否则说明用例没观察到竞争，正例的绿没有证明力。
      - name: SQLite 并发冒烟（读事务不得饿死写事务，含反向自检）
        run: python tools/run_smoke.py logs/smoke_smoke_sqlite_concurrency.log python tools/smoke_sqlite_concurrency.py

      # 求助邮箱**不许写死**：解析顺序 env → 管理端 SMTP（notify_to → from_addr）→ 空串。
      # 之前写死的 support@voice.250886.xyz 指向一个不可达域名，而已登录页的
      # 「忘记用户名 › 发邮件给管理员」是忘记用户名后**唯一**能解绑设备的通道。
      # 两个阶段共用同一个库文件（证明「DB 里有地址时 env 仍然优先」），
      # 故第二阶段用另一个空闲端口，避免 TIME_WAIT 让 bind 失败。
      - name: 求助邮箱解析冒烟（env → 管理端 SMTP → 空串，含死信箱回归）
        run: python tools/run_smoke.py logs/smoke_smoke_support_email.log python tools/smoke_support_email.py

      # 端口必须与 tools/smoke_ports.py 的 DEFAULT_PORTS 一致（那里是唯一真源）。
      # 同一 job 内两个脚本用不同端口，MySQL job 整体又与 SQLite job 错开 ——
      # 虽然它们跑在不同 runner 上不会真撞车，但保持全表唯一才能在本地
      # 「并行跑全部冒烟」时也确定不冲突。
      - name: 运行业务闭环冒烟测试
        # 经 run_smoke 落盘：红灯时日志进 artifact（见末尾「失败诊断」步骤）
        run: python tools/run_smoke.py logs/smoke_smoke_server.log python tools/smoke_server.py 8100
      # 注册 / 鉴权安全边界冒烟（65 条断言）：
      #   - 匿名注册开关 + "第一个注册者=管理员" 的老规则不再复活；
      #   - **种子管理员不再是可猜测口令**：空库未配 ELDER_SEED_ADMIN_PASSWORD 时
      #     admin/admin123 必须登不上，随机口令以 WARNING 打进日志且能登录；
      #   - 存量库（口令已是 admin123）每次启动告警、只对命中者告警；
      #   - ELDER_RESET_ADMIN_PASSWORD 一次性轮换 + 幂等 + 不误伤其它账号。
      #
      # ⚠️ 为什么它**必须**挂在这个 job 里：上面 job 级的
      # ELDER_SEED_ADMIN_PASSWORD=admin123 会一路继承进来，导致"随机口令"分支
      # 在 CI 上永远走不到。脚本里对每个需要随机口令的场景都显式
      # `env.pop("ELDER_SEED_ADMIN_PASSWORD")` 来触发，所以挂进来才有意义 ——
      # 不挂的话整套断言就是"只在本机能跑"。
      # 端口 8121 已在 tools/smoke_ports.py 登记。
      - name: 注册 / 鉴权 / 种子口令冒烟（含 P0 默认口令断言）
        # 经 run_smoke 落盘：红灯时日志进 artifact（见末尾「失败诊断」步骤）
        run: python tools/run_smoke.py logs/smoke_smoke_auth.log python tools/smoke_auth.py 8121
      # 角色域冒烟：/api/roles 全闭环 + 四条 P0 越权断言。
      # 之所以单列一步而不是塞进 smoke_server：这四类缺陷（P0-1~4）曾经
      # **全部是活的**，而它们的特点是「接口照常返回 200，只是返回了别人的
      # 数据 / 真的删了别人的配置」，业务闭环冒烟**发现不了**。
      - name: 角色与权限冒烟（含 P0 安全断言）
        # 经 run_smoke 落盘：红灯时日志进 artifact（见末尾「失败诊断」步骤）
        run: python tools/run_smoke.py logs/smoke_smoke_roles.log python tools/smoke_roles.py 8101
      # 人格预设运营后台（/api/admin/presets，105 条断言）。
      # 之所以必须挂在 SQLite job 而不是 mysql-smoke job：它**直连 sqlite3
      # 改库**注入脏数据（T08「把 guardrails.hard 清空后红线是否仍齐全」——
      # 那个值没有任何接口能写出来，只能像老库那样直接改列），且它会
      # **重启服务两次**（T14/T27）。塞进 mysql job 的话，步骤名写着 mysql、
      # 实际跑的是 SQLite —— 正是本项目最该防的假绿。
      #
      # 端口 8118 已在 tools/smoke_ports.py 登记（唯一真源），与 8110-8117 错开。
      - name: 人格预设运营后台冒烟（红线不出库 + 审计同事务 + 重启不变式）
        # 经 run_smoke 落盘：红灯时日志进 artifact（见末尾「失败诊断」步骤）
        run: python tools/run_smoke.py logs/smoke_smoke_admin_presets.log python tools/smoke_admin_presets.py 8118
      # 陪聊计量 + 「取消会员制」核心不变量（端口 8106，已在 smoke_ports.py 登记）。
      # 它守着本次产品决策：把 free_daily_seconds 压到 0，已绑定设备仍 unlimited。
      # ⚠️ 少了这一步，「有人把按用量拦人的逻辑加回来」不会被任何测试发现 ——
      # 因为除了它，其余冒烟都不把上限压到 0。
      - name: 陪聊计量冒烟（授权设备无限量 + 会员端点已下线）
        # 经 run_smoke 落盘：红灯时日志进 artifact（见末尾「失败诊断」步骤）
        run: python tools/run_smoke.py logs/smoke_smoke_quota.log python tools/smoke_quota.py 8106
      # token 用量：网关提取真实 usage + 双端接口（/api/usage 与 /api/admin/usage）
      # + 越权隔离。进程内起服务（usage 路由在 main.py 已接线，冒烟另走进程内
      # attach 覆盖同一份路由对象），端口 8120 已在 smoke_ports.py 登记。
      # 挂 SQLite job 而不进 mysql-smoke：它验的是 token 归一化口径与权限边界，
      # 与跑什么库无关；MySQL 侧由 smoke_server/smoke_roles 的真实往返覆盖。
      - name: token 用量冒烟（网关提取 + 双端接口 + 越权隔离）
        # 经 run_smoke 落盘：红灯时日志进 artifact（见末尾「失败诊断」步骤）
        run: python tools/run_smoke.py logs/smoke_smoke_usage.log python tools/smoke_usage.py 8120
      # 音色目录 + 服务就绪度面板（端口 8124，已在 smoke_ports.py 登记）。
      #
      # ⚠️ 少这一步会漏掉两类回归，别的冒烟都抓不到：
      # ① 有人为了「体验好」把未配置的用途硬报成已就绪 —— 页面于是虚报
      #    「已就绪」，管理员以为能用，直到老人没声音才发现（假绿，且方向相反）；
      # ② 前端又把音色清单硬编码回 index.html —— 于是「下拉框里有的音色，
      #    恢复出厂默认后却是另一个」，第二份真源复活。
      - name: 音色目录与就绪度冒烟（零配置如实反映 + 音色单一真源）
        # 经 run_smoke 落盘：红灯时日志进 artifact（见末尾「失败诊断」步骤）
        run: python tools/run_smoke.py logs/smoke_smoke_voice_catalog.log python tools/smoke_voice_catalog.py 8124
      # 可信反代 + 307 scheme（端口 8125，已在 smoke_ports.py 登记）。
      # 守的是 2026-10-18 线上事故：管理后台在 HTTPS 页面里请求
      # /api/admin/presets 被浏览器 Mixed Content 拦掉（Failed to fetch），
      # 根因是 uvicorn 不信任 Docker 网桥网关对端的 X-Forwarded-Proto，
      # Starlette 的 307 重定向于是生成 http:// 绝对地址。
      # 药方曾是「--forwarded-allow-ips=*」—— 本脚本的 B3/A3 断言专门钉死
      # 那个药方为什么错（两层语义相反：uvicorn 层信任所有人取 XFF 最左段，
      # ratelimit 层谁都不信，合起来限速器两头落空）。
      # D 组还静态核对 Dockerfile CMD：--proxy-headers 必须在、
      # 默认值不能写死 *（写成 * 会当场转红）。
      - name: 可信反代与 307 scheme 冒烟（Mixed Content 事故回归）
        # 经 run_smoke 落盘：红灯时日志进 artifact（见末尾「失败诊断」步骤）
        run: python tools/run_smoke.py logs/smoke_smoke_proxy_headers.log python tools/smoke_proxy_headers.py 8125
      # 前端模板卫生（静态扫描，不起服务、不占端口）。
      # 守的是 2026-10-18 线上事故：AI 配置弹窗的 API Key 标签渲染成
      # 「function () { [native code] }」—— 标签用的标识符被放进了
      # methods: 段，Vue 3 bind 之后 toString() 就是那串乱码。
      # L3（data() 重复键）还当场抓到过一个真 bug：SMTP 测试结果与
      # AI 测试结果同名，后者静默覆盖前者。
      # 这三个缺陷在浏览器里都不报错（一个显示乱码、一个渲染成空、
      # 一个互相串数据），只有静态扫描能在合并前抓住。
      - name: 前端模板卫生冒烟（方法插值 / 孤儿引用 / 重复键）
        # 经 run_smoke 落盘：红灯时日志进 artifact（见末尾「失败诊断」步骤）
        run: python tools/run_smoke.py logs/smoke_smoke_frontend_hygiene.log python tools/smoke_frontend_hygiene.py
      # 语音链路冒烟（WS 协议逐字段对固件 + Opus 编解码 + OTA 签发口径）。
      # 挂在 SQLite job：它直连 sqlite 造激活码/设备，且进程内起 uvicorn。
      #
  # ⚠️ 这一步有个**假绿陷阱**：smoke_voice 对 libopus 缺失是「打印警告后
  # 跳过那两条编解码断言、其余照跑」，所以在没装 libopus 的机器上它照样
  # 绿、只是少测了最核心的东西。因此上面那步装了还不够，**这里必须再加一道
  # 断言**：libopus 没真加载上就直接 exit 1，让「编解码被跳过」变成红。
  # 本机（Windows 开发环境）没装 libopus 时同理会红，这是有意为之 ——
  # 想在本机跑通就装一个 opus dll 并设 ELDER_LIBOPUS_PATH。
      - name: 语音链路冒烟（WS 协议 / Opus 编解码 / OTA）
        env:
          # ⚠️ 这一步要真跑 libopus（下面的断言会拿它编解码）。Python 一旦在
          # C 库里段错误，默认只留一句 "Segmentation fault (core dumped)" +
          # exit 139，**stdout 缓冲区也一起丢**（stdout 非 tty 时是块缓冲），
          # 于是日志里既看不到崩在哪一行、也看不到崩之前跑完了哪些断言 ——
          # 上一轮就是这么只能靠猜的。PYTHONFAULTHANDLER 让 faulthandler 在
          # 致命信号到来时把**当前 Python 调用栈**打到 stderr，
          # 于是"exit 139"会变成"exit 139 + 崩在 opus_codec.py 第几行"。
          # 它只是加诊断，不放宽任何断言。
          PYTHONFAULTHANDLER: '1'
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, "server")
          from app.voice.opus_codec import libopus_available
          if not libopus_available():
              print("::error::libopus 未加载，smoke_voice 的编解码断言会被 SKIP —— 拒绝假绿")
              raise SystemExit(1)
          print("libopus OK")
          PY
          python tools/smoke_voice.py 8119

      # MQTT+UDP 传输冒烟（F1）：broker 协议 + AES-128-CTR 音频面 + 端到端。
      # 与 smoke_voice 分开而不是并进去：它**自己起 MQTT broker 与 UDP 口**
      # （进程内 asyncio server），且自带 4 条反向变异自检（每条变异各起一个
      # 子进程，内存里改写 mqtt_udp.py）。合进去会让 smoke_voice 的
      # libopus 前置断言与这边的端口/变异逻辑缠在一起。
      # 端口 8132 已在 tools/smoke_ports.py 登记；broker/UDP 口
      # （18183/18884，变异子进程各 +1）不在上游默认段上，不会撞到
      # runner 上真装了的 mosquitto。
      - name: MQTT+UDP 传输冒烟（broker / AES 音频面 / 端到端 + 反向变异）
        run: python tools/run_smoke.py logs/smoke_mqtt_udp.log python tools/smoke_mqtt_udp.py 8132

      # 声纹认人冒烟（F3）：提供者契约 + 说话人登记 CRUD + 端到端个性化注入。
      # 同样独立成脚本：它自己起一个**假声纹 HTTP 服务**（复刻上游
      # VoiceprintProvider 的契约），并自带 4 条反向变异（内存里改写
      # voiceprint.py / session.py）。生产默认关闭（ELDER_VOICEPRINT_URL 空），
      # 所以这里测的是"开着的时候一切正确"，不是"默认行为"。
      # 端口 8133 与假声纹口 18099 均已在 smoke_ports.py / 脚本头部登记。
      - name: 声纹认人冒烟（提供者契约 / 登记 CRUD / 端到端 + 反向变异）
        run: python tools/run_smoke.py logs/smoke_voiceprint.log python tools/smoke_voiceprint.py 8133

      # 展示时区判定冒烟（端口 8135，假 IP 地理位置服务 8335，均已在
      # smoke_ports.py / 脚本头部登记）。
      # 守的是「用户端/设备端按各自 IP 所在国家/地区显示，管理端统一北京时间」
      # 这条口径里最容易错的一环：**提醒的"早上 8 点"挂在哪个时区上**。
      # 挂错了完全无症状（接口 201、界面正常，只是老人半夜被叫醒），
      # 所以断言全部落在**绝对时刻**上，并配 4 条反向变异。
      # 全程打本机假 IP 库（不依赖公网、不需要任何凭据），
      # 因此也不会因为第三方服务抖动而假红。
      - name: 展示时区冒烟（IP→国家→时区 + 提醒按规则时区展开 + 反向变异）
        run: python tools/run_smoke.py logs/smoke_geo.log python tools/smoke_geo.py 8135

      # 腾讯云语音冒烟（端口 8134，假上游 8234 = 8134+100，变异子进程再 +100）。
      # 为什么它必须进 CI：腾讯云的两条链路**没有真实密钥就无法验证**，而
      # 三种失败的错误信息互不相干（签名错是 401 / 音色不支持 24k 是
      # InvalidParameterValue.SampleRate / 音色 ID 抄成火山的字符串是
      # InvalidParameterValue.VoiceType），管理员点「保存」时一条都不会提前暴露。
      # 脚本用「对齐官方文档的测试向量（CanonicalRequest / StringToSign 全文
      # 不依赖 SecretKey，可逐字节复现）+ 假上游独立复算签名」把能验的都验掉，
      # **不需要任何凭据**，配合 4 条反向变异（Codec / UTC 日期 / DataLen 口径 /
      # 文本分段）。此前只在本机跑 ⇒ 这套断言对 GitHub 上的每个 PR 都不存在。
      - name: 腾讯云语音冒烟（TC3 签名对齐文档向量 + 假上游验签 + 反向变异）
        run: python tools/run_smoke.py logs/smoke_tencent_voice.log python tools/smoke_tencent_voice.py 8134

      # 模型接入点冒烟（九种 kind 注册 / usage 平滑过渡 / 四家报文协议切换 /
      # 错误五码分诊 / 密钥脱敏 / 设备下发兜底 / context_window 裁剪）。
      # 为什么必须进 CI（此前它只在本机跑，等于这套断言对 GitHub 上的每个
      # PR 都不存在）：它守的正是「接入层」——**任何一次协议拼装改动
      # （换 path、换字段名、换 priority 口径）都只在这里留下痕迹**。
      # 2026-10-22 起它还覆盖两个本地自建服务（I 组：只选风格就保存、
      # 本地 FastEmbed 的 /embed 单条与批量两种报文）——那正是本轮新接的
      # 协议分支，不进 CI 的话「提交时绿、合并后没人再跑」。
      # 全程打本地 127.0.0.1 上的假厂商（不花一分钱、不需要任何凭据），
      # 端口 8104 已在 tools/smoke_ports.py 登记。
      - name: 模型接入点冒烟（kind/usage/协议切换/错误分诊/本地自建服务）
        # 经 run_smoke 落盘：红灯时日志进 artifact（见末尾「失败诊断」步骤）
        run: python tools/run_smoke.py logs/smoke_smoke_models.log python tools/smoke_models.py 8104

      # 进程内故障注入：审计写失败时业务写必须回滚（T32 的**运行时**形态）。
      # 不起 HTTP 子进程、不占端口（进程内直调端点函数），所以不需要在
      # smoke_ports.py 登记；也不进 mysql-smoke job —— 它 monkeypatch 的
      # 是进程内模块，与跑什么库无关，SQLite 上验的就是回滚语义本身。
      - name: 审计同事务故障注入（record 抛异常 -> 业务写回滚）
        # 经 run_smoke 落盘：红灯时日志进 artifact（见末尾「失败诊断」步骤）
        run: python tools/run_smoke.py logs/smoke_qa_audit_rollback.log python tools/qa_audit_rollback.py
      # 人格 eval 门禁：**必须挂在 smoke job 里**（而不是另开一个）——
      # 这样复用已装好的依赖，且与 SQLite 冒烟同环境。
      # 分级：医疗安全类失败 -> 本步红；长度/用词类只打印⚠️ -> 本步绿。
      - name: 人格 eval 门禁（医疗安全类硬失败）
        # 经 run_smoke 落盘：红灯时日志进 artifact（见末尾「失败诊断」步骤）
        run: python tools/run_smoke.py logs/smoke_eval_persona.log python tools/eval_persona.py
      # ---- 以下三步守的是「只有老库 / 只有重启才暴露」的缺陷 ----
      # 它们曾经**全部是活的**，而当时 CI 是绿的 —— 因为门禁里没有它们。
      # 每一份对应一个真实事故，不是「保险性冗余」：
      #   qa3_r2_restart     服务重启把用户派生角色永久刷成 preset
      #                      → 角色变只读 + **全平台可见**（跨用户信息泄漏）
      #   qa3_migration      模型加了列但忘登记 schema_patch.NEW_COLUMNS
      #                      → **只在老库升级时炸**，全新部署永远看不出来
      #   qa3_device_binding 新建设备重启后被自动绑上平台预设角色
      # ⚠️ **这三步只在 SQLite job 里跑，不要复制到 mysql-smoke job** ——
      # 不是漏了，是**跑不了**：三个脚本都直连 `sqlite3`（构造老库 / 改列 / 读行），
      # 且各自 `boot()` 里无条件 `env["ELDER_DB"] = f"sqlite:///{DB}"`，
      # **会覆盖掉 CI 传入的 mysql 连接串**。硬塞进 mysql-smoke job 的话，
      # 步骤名写着 mysql+pymysql、实际跑的是 SQLite ——
      # 那正是本项目最该防的「假绿」，比不接更坏。
      # MySQL 侧由 qa3_migration 的 T6（MySQL DDL 静态体检）
      # 加上 mysql-smoke job 里 smoke_server/smoke_roles 的真实 MySQL 往返共同覆盖。
      #
      # 端口：三个脚本都不占冒烟端口段 —— qa3_r2_restart=8113、
      # qa3_device_binding=8114（qa3_migration 不起服务），
      # 均由 tools/smoke_ports.py 统一登记，与冒烟的 8100-8106 无冲突。
      - name: 重启不变式（回填不改角色归属）
        # 经 run_smoke 落盘：红灯时日志进 artifact（见末尾「失败诊断」步骤）
        run: python tools/run_smoke.py logs/smoke_qa3_r2_restart.log python tools/qa3_r2_restart.py
      - name: 迁移完整性（ORM 列与 NEW_COLUMNS 对账）
        # 经 run_smoke 落盘：红灯时日志进 artifact（见末尾「失败诊断」步骤）
        run: python tools/run_smoke.py logs/smoke_qa3_migration.log python tools/qa3_migration.py
      - name: 设备绑定归属（重启不被绑上平台预设）
        # 经 run_smoke 落盘：红灯时日志进 artifact（见末尾「失败诊断」步骤）
        run: python tools/run_smoke.py logs/smoke_qa3_device_binding.log python tools/qa3_device_binding.py
      # 服务端 → 设备 MCP 工具通道（服药确认走的就是它）。
      # 为什么必须在 CI 跑：这条链路的失效形态统一是「设备没反应」——
      # 超时、id 类型写错、结果解析写错，三种原因在日志里长得一模一样。
      # 本脚本用假 WS 把「下发 tools/call → 回包 → 唤醒 Future → 翻译成
      # LLM 话术」三层一次跑通，不连真设备、不占端口。
      - name: MCP 工具通道 + 服药确认
        run: python tools/run_smoke.py logs/smoke_mcp_confirm.log python tools/test_mcp_confirm.py
      # 和风天气：按需缓存 + 降级 + 预热。用假 client，不消耗真实 API 次数、
      # 不需要任何凭据（缺 PyJWT/cryptography 时脚本会明确"跳过"而不是假绿）。
      # 为什么必须进 CI：这个子系统的核心承诺是「60 分钟内同一城市只调一次上游」，
      # 而缓存写错、TTL 写成 0、预热条件写反，现象**全都是「天气照样能查到」**——
      # 功能测试看不出来，只有调用计数和账单能发现。T4/T6 就是那两个计数器。
      - name: 和风天气按需缓存（计费红线 + 降级 + 预热）
        run: python tools/run_smoke.py logs/smoke_weather.log python tools/test_weather.py
      # 可播性过滤 + 缓冲区尾巴补播 + TTS 返回体格式判别。
      # 为什么必须进 CI：这三件事的失败现象**全都是"老人听到的声音不对"**，
      # 而协议层、状态机、token 计量全部正常 —— 没有任何现有断言会红。
      # 2026-10-21 真机事故就是「念出"我要调用 get_weather"，然后静音」：
      # 前者是规划语没过滤，后者是 _run_turn 从不 flush 缓冲区尾巴。
      # 这个脚本是纯函数级断言（秒级、不联网、不需要 libopus），
      # 所以放在天气之后、重活之前。
      - name: 语音可播性过滤 + 尾巴补播 + TTS 格式判别
        run: python tools/run_smoke.py logs/smoke_speech_guard.log python tools/test_speech_guard.py
      # 音频下行节流器（虚拟播放时钟）。
      # 为什么必须进 CI：它是 2026-10-22「声音断断续续 + 响应慢」的正主，
      # 而它的失效形态是**老人听不到声音、服务端日志全绿**——协议层、
      # 状态机、token 计量没有任何一个会红。本脚本是纯内存断言（不起服务、
      # 不占端口、不需要 libopus），毫秒级跑完。
      # ⚠️ T8/T9 两条是变异验证过的：把「popleft 前查队列」的防护删掉、
      # 或把 finish() 里的排空等待删掉，它们必须变红，否则就是假绿。
      - name: 音频下行节流器（虚拟播放时钟）
        run: python tools/run_smoke.py logs/smoke_audio_pacing.log python tools/test_audio_pacing.py
      # 唤醒应答（「你好，<称呼>，要聊点什么？」）。
      # 为什么必须进 CI：这条功能的三类失效**没有一类会让协议层报错** ——
      # ① 没接上（代码写了但 detect 分支没调），现象是「线上没反应」；
      # ② 该闭嘴时开口，把老人一口气说的后半句吃掉（比不回应更烦）；
      # ③ 读称呼期间本轮开始，两路 TTS 抢同一条下行音频通道 ⇒ 破音。
      # 本脚本纯内存 + 临时库，不占端口、不联网、不需要 libopus。
      # ⚠️ 第 1 组与第 4 组做过变异验证：删掉 detect 里的接线、或删掉第二次
      #    跳过检查，它们必须变红，否则就是假绿。
      - name: 唤醒应答（称呼 / 跳过判据 / 抢通道防护）
        run: python tools/run_smoke.py logs/smoke_wake_greet.log python tools/test_wake_greet.py
      # 会员制遗留五张表必须**真的**被删掉。
      # 这条门禁是补 875b38c 留下的洞：当时删表函数整个被掏空，全仓 CI 依然全绿
      # （qa3_migration 的老库 DDL 根本不建这五张表，删表分支恒为空操作）。
      # 本脚本自己先按历史结构建出这五张表，再用「表还在不在」而不是函数返回值作判据。
      - name: 会员遗留表真删（掏空实现必变红）
        # 经 run_smoke 落盘：红灯时日志进 artifact（见末尾「失败诊断」步骤）
        run: python tools/run_smoke.py logs/smoke_qa3_drop_tables.log python tools/qa3_drop_tables.py
      # 失败诊断：把每个冒烟脚本的结论搬进 job summary。
      #
      # 为什么加这个（2026-10-19 实际踩到的）：
      # server-ci 红了，但 GitHub 网页上的日志正文是**异步加载的**，
      # 没有 token 时 API / web /日志下载端点三条路全都拿不到正文——
      # 于是只能靠猜「哪个 step 红了」，而本地和干净 clone 都绿，
      # 猜了半天才发现不是代码问题。
      # 结论：**「构建/测试红了但看不到为什么」本身就是缺陷**，
      # 排查成本高到下次干脆不看了。
      #
      # 这里做的事：每个脚本把输出写进 logs/，失败时把**结论行**
      # （FAIL 断言 + 汇总行）摘出来贴到 summary。
      # 只摘结论不贴全文——全文动辄上万行，summary 会撑爆且没人看。
      - name: 失败诊断（把结论贴进 job summary）
        if: failure()
        shell: bash
        run: |
          {
            echo "### 后端冒烟失败诊断"
            echo
            if [ -d logs ]; then
              for f in logs/*.log; do
                [ -f "$f" ] || continue
                echo "#### \`$(basename "$f" .log)\`"
                echo
                echo '```'
                # 只留 FAIL/汇总/异常三类行：这是排查需要的信息，其余是噪音
                grep -E "FAIL|共 [0-9]+ 条|passed|Traceback|Error:|AssertionError|未就绪" "$f" \
                  | head -25 || echo "(无匹配行——脚本可能在起服务阶段就崩了，看上面步骤)"
                echo '```'
                echo
              done
            else
              echo "没有 logs/ 目录：失败发生在**跑脚本之前**（装依赖 / 环境准备阶段）。"
            fi
            echo "排查顺序建议：① 看上面哪条 FAIL 最刺眼 ② 本地跑同名脚本 ③ 若本地绿、CI 红，"
            echo "差异多半在 Linux/Windows 环境或并发残留进程，别改业务代码。"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 保留完整日志（供下载排查）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: server-ci-logs
          path: logs/
          retention-days: 7
          if-no-files-found: ignore

  # elder 组件的宿主单元测试：断网提醒链路的「离线可用」证据。
  #
  # 为什么必须是独立 job（而不是塞进 smoke）：
  #   smoke job 要装 Python 依赖、起服务、占端口、连数据库；
  #   而本测试只需要一个 C 编译器。它验的东西与后端**完全无关**
  #   （验的是 reminder.c 这个纯 C 文件；离线命令词源已随上游回归删除），
  #   混进 smoke 只会让「后端挂了」和「固件提醒逻辑坏了」两种红灯混在一起，
  #   排查时先要猜是哪个。独立 job 的红灯只有一个含义：断网提醒链路出问题。
  #
  # 为什么它必须每天真跑：这份测试在接入本 job 之前**从来没有被执行过一次**
  #   （仓库里没有任何 workflow 引用过它）。一份没跑过的测试不构成任何证据 ——
  #   「文件躺在磁盘上」和「门禁是绿的」是两回事，而前者常被当成后者。
  #   接入后它第一次真编译就暴露了 3 个编译级问题 + 1 个真实逻辑缺陷
  #   （见 commit：day_ordinal 用 UTC 日号，导致每天 08:00 误判跨天、
  #    把已确认的服药记录清空并让提醒二次响铃）。
  elder-host-test:
    name: elder 断网链路宿主测试
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # ubuntu-latest 自带 gcc/make，这里显式确认一次：
      # 「编译器缺失」必须当场红成一条清楚的错误，而不是让 make 报一句
      # 难懂的 command not found —— 后者容易被误读成「代码有问题」。
      - name: 确认 C 工具链
        run: |
          gcc --version | head -1
          make --version | head -1

      - name: 编译并运行宿主测试
        run: make -C tools/test_elder_host CC=gcc

      # 挡住「测试没真正跑 / 全被跳过」的假绿。
      # 上游 run 步骤非零退出已经会让 job 变红，所以这一步只处理
      # 「退出码是 0 但内容不对」的情形：
      #   - 一条断言都没跑（0 通过 0 失败）—— 例如被改成空 main；
      #   - 十五组用例里有一组整段没输出 —— 例如新增用例忘了注册，
      #     main() 里漏调，测试静默少跑一组还照样全绿；
      #   - 一组用例的标题被改了但门禁还 grep 旧标题 —— 也会永远红，
      #     所以标题清单必须与 test_elder_host.c 的 printf 一一对应。
      # 这三种形态用「只看退出码」的门禁一律抓不到，而它们恰恰是
      # 「测试文件存在」被误当成「测试有效」的主要途径。
      - name: 断言各组用例都真的执行了
        run: |
          set -euo pipefail
          LOG=$(mktemp)
          make -C tools/test_elder_host CC=gcc > "$LOG" 2>&1 || {
            cat "$LOG"; exit 1
          }
          cat "$LOG"

          # ① 用例组标题必须逐组出现（断网新建 + 断网确认一组已于 2026-10-20
          #    随离线命令词一起删除，回归上游小智后改由对话确认）。
          #    标题是 grep -qF 子串匹配，取各组 printf 行里的独有片段。
          #    ⚠️ 这里只查「还在的组」—— 已删组的标题绝不能加回来当断言，
          #    否则 CI 会因为「找不到该组」永远红，而不是因为真出问题才红。
          for t in \
            "提醒时间存储在设备本地" \
            "不抹掉设备本地自建的提醒" \
            "系统时钟不可信" \
            "本地日边界" \
            "跨天重置生效" \
            "漏服 15 分钟未确认必须升级" \
            "按键确认窗 30 秒超时必须回退" \
            "坏数据必须被 CRC 拦下" \
            "上电后第一个 tick" \
            "当天已确认服药后重启" \
            "未到点就重启" \
            "跨过日界后重启" \
            "旧格式 blob 的提醒与服药记录" \
            "响过位图必须跟着新下标重算" \
            "开机后必须补响"
          do
            grep -qF "$t" "$LOG" || {
              echo "::error::用例组未执行：$t —— 新增用例可能忘了在 main() 里注册"
              exit 1
            }
          done

          # ② 汇总行必须存在，且通过数不为 0、失败数为 0
          SUMMARY=$(grep -E '^=== [0-9]+ 通过 / [0-9]+ 失败 ===$' "$LOG" || true)
          if [ -z "$SUMMARY" ]; then
            echo "::error::没找到「=== N 通过 / M 失败 ===」汇总行，测试未真正运行"
            exit 1
          fi
          echo "断言汇总：$SUMMARY"
          PASSED=$(echo "$SUMMARY" | sed -E 's/^=== ([0-9]+) .*/\1/')
          FAILED=$(echo "$SUMMARY" | sed -E 's#.*/ ([0-9]+) 失败 ===$#\1#')
          if [ "$PASSED" -eq 0 ]; then
            echo "::error::通过数为 0 —— 断言一条都没跑，拒绝假绿"
            exit 1
          fi
          if [ "$FAILED" -ne 0 ]; then
            echo "::error::失败数为 $FAILED —— 断网提醒链路有断言不成立"
            exit 1
          fi

          # ③ 打到 job summary：不用点进日志就能看到这次验了什么
          {
            echo "### elder 断网链路宿主测试"
            echo
            echo '```'
            cat "$LOG"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # 用真实 MySQL 再跑一遍同一套业务闭环。
  # 必要性：SQLite 覆盖不到 pymysql 的连接/握手路径，而线上部署踩的坑正是
  #   (2013, 'Lost connection to MySQL server during query')
  # —— mysqld 尚未就绪时客户端直接在读握手包阶段被断开。这个 job 保证
  # wait_for_db() 的重试逻辑对 MySQL 真的有效。
  mysql-smoke:
    name: MySQL 真实路径冒烟
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # ⚠️ 这里**必须**重设种子口令，job 级的 env 不会跨 job 继承。
    # 漏掉它的后果不是"少测点什么"，而是整条链路假绿式地崩：
    #   MySQL 是 service container，每次 run 都是**空库** → 走"种子管理员"分支；
    #   没设 ELDER_SEED_ADMIN_PASSWORD 时该分支按设计生成**随机口令**
    #   （secrets.token_urlsafe(16)，见 server/app/security.py）；
    #   而 tools/smoke_server.py 硬编码用 admin/admin123 登录
    #   → 第一条断言就 401 → 后续拿不到 token 的用例连环 FAIL，
    #   最后在生成激活码那步 IndexError 崩掉。
    # 实测证据：run 39031736168 的 MySQL job 里，服务端日志打的是
    #   「【安全】种子管理员已创建：用户名 admin，ELDER-INITIAL-***」
    # 而 smoke 侧是「[FAIL] 登录默认管理员 -> 401」。
    # ⚠️ 弱口令的合理性（一次性 runner、库跑完即销毁）与上面 smoke job
    # 的注释完全一致，此处不再重复；生产/内网**不要**设它。
    env:
      ELDER_SEED_ADMIN_PASSWORD: admin123
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: smoke-pass
          MYSQL_DATABASE: elder_companion
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -psmoke-pass"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: server/requirements.txt

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r server/requirements.txt

      - name: 等 MySQL 真正可查询
        run: |
          python - <<'PY'
          import sys, time
          import pymysql
          last = None
          for i in range(60):
              try:
                  c = pymysql.connect(host="127.0.0.1", user="root", password="smoke-pass",
                                      database="elder_companion", connect_timeout=5)
                  c.close()
                  print(f"MySQL 已可查询（第 {i+1} 次尝试）")
                  sys.exit(0)
              except Exception as e:
                  last = e
                  time.sleep(2)
          print("MySQL 始终不可用:", last)
          sys.exit(1)
          PY

      # 端口同 SQLite job（8100/8101）—— 端口表全局唯一，不因换数据库就换端口。
      # 早先这里写的是 8098/8096，恰好与 smoke_quota 的默认 8098、
      # smoke_models/smoke_mail 的默认 8096 撞车，等于留了两套互相冲突的端口表。
      - name: 跑业务闭环（mysql+pymysql）
        env:
          ELDER_DB: mysql+pymysql://root:smoke-pass@127.0.0.1:3306/elder_companion?charset=utf8mb4
        # 经 run_smoke 落盘：红灯时日志进 artifact（见末尾「失败诊断」步骤）
        run: python tools/run_smoke.py logs/mysql-smoke_smoke_server.log python tools/smoke_server.py 8100
      # MySQL 变体必须重跑角色域冒烟与 eval：
      # SQLite 覆盖不到 JSON 列与 ALTER TABLE 的方言差异，而本轮新增的
      # traits / guardrails / agent_key 全都是 JSON / 补列相关 ——
      # 「SQLite 绿、MySQL 炸」正是这套迁移最容易出问题的地方。
      - name: 角色与权限冒烟（mysql+pymysql）
        env:
          ELDER_DB: mysql+pymysql://root:smoke-pass@127.0.0.1:3306/elder_companion?charset=utf8mb4
        # 经 run_smoke 落盘：红灯时日志进 artifact（见末尾「失败诊断」步骤）
        run: python tools/run_smoke.py logs/mysql-smoke_smoke_roles.log python tools/smoke_roles.py 8101
      - name: 人格 eval 门禁（mysql+pymysql）
        env:
          ELDER_DB: mysql+pymysql://root:smoke-pass@127.0.0.1:3306/elder_companion?charset=utf8mb4
        # 经 run_smoke 落盘：红灯时日志进 artifact（见末尾「失败诊断」步骤）
        run: python tools/run_smoke.py logs/mysql-smoke_eval_persona.log python tools/eval_persona.py
      # ★ 这一条是**下面那段注释唯一的例外**，而且是有意的例外。
      #
      # 上面的注释说「故意不放 qa3_*，因为它们跑不到 MySQL」—— 这条仍然成立，
      # 但 qa3_drop_tables 是**特意写来能跑 MySQL 的**：
      #   * 它用 SQLAlchemy Core 的 Table(...) 建老库表，不是写死 SQLite DDL；
      #   * 它尊重外部 ELDER_DB，MySQL 分支**新建专属库** elder_droptables_test，
      #     跑完 DROP DATABASE 删掉，不污染共享库（不这么做的话，它会在库里留下
      #     五张已删表的残留，后续 job 排查时分不清「表是谁留下的」）。
      #
      # 为什么要挂：此前 MySQL 侧执行 DROP 的次数是 **0 条** —— 新库 + 当前 ORM
      # 已无这五张表的映射 ⇒ create_all 不建它们 ⇒ 删表分支恒为空操作。
      # 挂上之后，这个 job 会真正发出 5 条 DROP，补齐方言覆盖。
      - name: 会员遗留表真删（mysql+pymysql 真发 DROP）
        env:
          ELDER_DB: mysql+pymysql://root:smoke-pass@127.0.0.1:3306/elder_companion?charset=utf8mb4
        # 经 run_smoke 落盘：红灯时日志进 artifact（见末尾「失败诊断」步骤）
        run: python tools/run_smoke.py logs/mysql-smoke_qa3_drop_tables.log python tools/qa3_drop_tables.py
      # ⚠️ 这里**故意不**放 qa3_r2_restart / qa3_migration / qa3_device_binding。
      # 理由不是「MySQL 不重要」，而是那三份脚本**跑不到 MySQL**：
      #   * 它们直连 `sqlite3`（构造老库 DDL、改列、读行做指纹比对）；
      #   * 各自 boot() 里无条件 `env["ELDER_DB"] = f"sqlite:///{DB}"`，
      #     会**静默覆盖**下面这个 mysql 连接串。
      # 放进来 = 步骤名写着 mysql+pymysql、实际全程跑 SQLite，
      # 在日志里显示为「MySQL 路径已验证」—— 这是**假绿**，
      # 比不接更坏：它会让人以为 JSON 列 / ALTER TABLE ADD COLUMN ... JSON
      # 已在真 MySQL 上验过，从而不再去查那个真正的风险。
      #
      # MySQL 侧的真实覆盖现状（勿夸大）：
      #   * JSON 列与补列方言差异 → 由上面 smoke_server / smoke_roles
      #     在真 MySQL 上的往返间接覆盖；
      #   * MySQL DDL 片段静态体检 → qa3_migration 的 T6（纯静态，不连库）；
      #   * ⚠️ **老库升级真跑 MySQL、UPDATE 的 rowcount 幂等性、
      #     JSON 列写入非 dict 的行为差异 —— 目前无人覆盖**。
      # 要补这三条，正确做法是先把那三份脚本改成尊重外部 ELDER_DB
      # （并给sqlite3 直连加方言分支），属于独立一轮工作，
      # 在那之前这里必须保持为空。
      #
      # ⚠️ 这段注释**下面不允许再挂任何 step**。上一轮曾在这里留过一个
      # 「- name: 角色与权限冒烟（mysql+pymysql）」的空步骤（无 uses、无 run），
      # 后果不是「那一步红」而是**整个 workflow 启动失败**：
      #   空步骤 → workflow 启动失败 → jobs=0 → PR 上根本没有检查项
      #   → 后端业务冒烟（smoke_server / smoke_roles / eval_persona /
      #     qa3_* 与整个 MySQL job）全部静默失效
      # 而它在 diff 里只是几行注释 + 一个孤零零的 name，看起来完全无害；
      # 失败形态还是「PR 上没有检查项」，**看起来像通过** —— 这比红更危险。
      # tools/ci_gate_check.py 的「步骤非空」断言现在会当场拦下它。

  # 两个 compose 文件的语法校验。
  # 必要性：MySQL 变体是 overlay 叠加文件（docker-compose.mysql.yml 不能单独用），
  # 写坏了本地 `docker compose config` 才报错，而这个仓库平时并不起容器 ——
  # 加一道 CI 挡住 YAML 语法错误、变量引用错误与「少了主文件」的用法错误。
  compose-config:
    name: Compose 文件校验
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 校验默认形态（内置 SQLite）
        working-directory: server
        run: docker compose config --quiet
      - name: 校验 MySQL 变体（必须与主文件一起加载）
        working-directory: server
        run: docker compose -f docker-compose.yml -f docker-compose.mysql.yml config --quiet

  dockerfile-lint:
    name: Dockerfile 语法检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: server/Dockerfile
          failure-threshold: warning
          ignore: DL3008,DL3013

