name: server-ci

# 后端代码检查：每次改动 server/ 或 tools/ 都跑一遍业务闭环冒烟测试。
# 覆盖：健康检查 -> 登录 -> 设备 -> 激活码(Luhn 与固件一致) -> 绑定
#       -> 提醒复杂规则 -> 排期 -> 设备同步 -> 回执 -> 统计 -> 鉴权
on:
  push:
    branches: [main, master]
    paths:
      - 'server/**'
      - 'tools/**'
      - '.github/workflows/server-ci.yml'
  pull_request:
    paths:
      - 'server/**'
      - 'tools/**'
      - '.github/workflows/server-ci.yml'
  workflow_dispatch:

jobs:
  smoke:
    name: 后端冒烟测试
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: .
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: server/requirements.txt

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r server/requirements.txt

      # 挡住「用 urllib.parse.urlparse 解析 SQLite 连接串」的回退：
      # urlparse 会把 sqlite:///C:/a/b.db 的 path 解析成 /C:/a/b.db，
      # Windows 上 mkdir 直接抛 WinError 123（文件名、目录名或卷标语法不正确），
      # 服务一启动就崩。必须用 SQLAlchemy 自己的 make_url()。
      # 三个形态一起断言，顺带守住 sqlite:////data/elder.db 的四斜杠（绝对路径）写法。
      - name: 校验 SQLite 连接串解析
        run: |
          python - <<'PY'
          from sqlalchemy.engine import make_url

          cases = {
              "sqlite:///./x.db": "./x.db",
              "sqlite:////data/elder.db": "/data/elder.db",
              "sqlite:///C:/a/b.db": "C:/a/b.db",
          }
          for url, expected in cases.items():
              got = make_url(url).database
              assert got == expected, f"{url} -> {got!r}, 期望 {expected!r}"
              print(f"OK {url} -> {got}")
          PY

      - name: 运行业务闭环冒烟测试
        run: python tools/smoke_server.py 8099

  # 用真实 MySQL 再跑一遍同一套业务闭环。
  # 必要性：SQLite 覆盖不到 pymysql 的连接/握手路径，而线上部署踩的坑正是
  #   (2013, 'Lost connection to MySQL server during query')
  # —— mysqld 尚未就绪时客户端直接在读握手包阶段被断开。这个 job 保证
  # wait_for_db() 的重试逻辑对 MySQL 真的有效。
  mysql-smoke:
    name: MySQL 真实路径冒烟
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: smoke-pass
          MYSQL_DATABASE: elder_companion
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -psmoke-pass"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: server/requirements.txt

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r server/requirements.txt

      - name: 等 MySQL 真正可查询
        run: |
          python - <<'PY'
          import sys, time
          import pymysql
          last = None
          for i in range(60):
              try:
                  c = pymysql.connect(host="127.0.0.1", user="root", password="smoke-pass",
                                      database="elder_companion", connect_timeout=5)
                  c.close()
                  print(f"MySQL 已可查询（第 {i+1} 次尝试）")
                  sys.exit(0)
              except Exception as e:
                  last = e
                  time.sleep(2)
          print("MySQL 始终不可用:", last)
          sys.exit(1)
          PY

      - name: 跑业务闭环（mysql+pymysql）
        env:
          ELDER_DB: mysql+pymysql://root:smoke-pass@127.0.0.1:3306/elder_companion?charset=utf8mb4
        run: python tools/smoke_server.py 8098

  # 两个 compose 文件的语法校验。
  # 必要性：MySQL 变体是 overlay 叠加文件（docker-compose.mysql.yml 不能单独用），
  # 写坏了本地 `docker compose config` 才报错，而这个仓库平时并不起容器 ——
  # 加一道 CI 挡住 YAML 语法错误、变量引用错误与「少了主文件」的用法错误。
  compose-config:
    name: Compose 文件校验
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 校验默认形态（内置 SQLite）
        working-directory: server
        run: docker compose config --quiet
      - name: 校验 MySQL 变体（必须与主文件一起加载）
        working-directory: server
        run: docker compose -f docker-compose.yml -f docker-compose.mysql.yml config --quiet

  dockerfile-lint:
    name: Dockerfile 语法检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: server/Dockerfile
          failure-threshold: warning
          ignore: DL3008,DL3013
