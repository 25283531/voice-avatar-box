name: server-ci

# 后端代码检查：每次改动 server/ 或 tools/ 都跑一遍业务闭环冒烟测试。
# 覆盖：健康检查 -> 登录 -> 设备 -> 激活码(Luhn 与固件一致) -> 绑定
#       -> 提醒复杂规则 -> 排期 -> 设备同步 -> 回执 -> 统计 -> 鉴权
on:
  push:
    branches: [main, master]
    paths:
      - 'server/**'
      - 'tools/**'
      - '.github/workflows/server-ci.yml'
  pull_request:
    paths:
      - 'server/**'
      - 'tools/**'
      - '.github/workflows/server-ci.yml'
  workflow_dispatch:

jobs:
  smoke:
    name: 后端冒烟测试
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: .
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: server/requirements.txt

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r server/requirements.txt

      - name: 运行业务闭环冒烟测试
        run: python tools/smoke_server.py 8099

  dockerfile-lint:
    name: Dockerfile 语法检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: server/Dockerfile
          failure-threshold: warning
          ignore: DL3008,DL3013
