name: app-pack

# 手机端原生包：Android APK
#
# 用 DCloud 官方 HBuilderX Linux CLI 做**云打包**（编译在 DCloud 云端完成，
# 本机/CI 都不需要 macOS、Xcode、Android Studio、Android SDK）。
#
# 触发：Actions → app-pack → Run workflow，或发 Release 自动跑。
#
# 为什么不能在 runner 上"纯本地"打：uni-app 的 App 端原生运行时（含 nvue/原生插件引擎）
# 是 DCloud 以闭源 AAR 形式提供的离线 SDK，开源 CLI 只能产出 App 资源、打不出 APK；
# 而且离线打包还额外需要 DCloud 后台按「包名 + 签名 SHA1」申请的 AppKey。
# 两条路（云打包 / 离线 Gradle 打包）都绕不开 DCloud 账号，云打包是省事的那条。
#
# iOS 暂不做：没有 Apple 开发者证书（云打包 iOS 必须有 p12 + mobileprovision）。
# 将来有证书时把 ios job 从 git 历史里恢复即可。
#
# 需要在 Settings ▸ Secrets and variables ▸ Actions 里配置：
#   DCLOUD_USERNAME / DCLOUD_PASSWORD   DCloud 账号（云打包强制登录，免费注册）
#   UNI_APPID                           自己在 DCloud 后台建的应用 appid（形如 __UNI__XXXXXXX）
#                                       —— 不能复用小智的 __UNI__36A515E，云打包会校验归属
#   Android 自有证书（可选，不配则用 DCloud 公共证书，能装但不能上架商店）：
#     ANDROID_KEYSTORE_BASE64 / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD / ANDROID_STORE_PASSWORD
on:
  workflow_dispatch:
    inputs:
      uni_appid:
        description: 'uni-app appid（DCloud 后台自己建的应用，形如 __UNI__XXXXXXX；留空则用 secrets.UNI_APPID）'
        type: string
        default: ''
      android_packagename:
        description: Android 包名
        type: string
        default: com.elder.companion
      android_cert:
        description: '证书：cloud=DCloud 云端证书（推荐，需 appid 归自己）/ public=DCloud 公共证书 / self=自有 keystore'
        type: choice
        options: [cloud, public, self]
        default: cloud
      version_name:
        # ⚠️ 刻意不给 default（与 android-build.yml 同一个理由，见该文件与 D39）：
        #   input 的 default 会成为版本号的第二份真源，并在 dispatch 时
        #   无人察觉地盖掉 app/src/manifest.json 里的真值。
        #   留空 = 沿用 manifest.json 里的值。
        description: 版本名（留空则用 src/manifest.json 里的值）
        type: string
        required: false
      version_code:
        description: 版本号（留空则用 src/manifest.json 里的值；仅在确实要覆盖时填）
        type: string
        required: false
  release:
    types: [published]

env:
  HX_VERSION: 4.87.2025121004
  HX_DIR: /home/runner/hbuilderx
  NODE_VERSION: '20'
  PNPM_VERSION: '10.10.0'
  HUSKY: '0'

jobs:
  # ================================================================ Android
  android:
    name: 打包 Android APK
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: 安装前端依赖（HBuilderX 本地编译 App 资源需要）
        working-directory: app
        run: pnpm install --frozen-lockfile --registry https://registry.npmjs.org

      - name: 写入 appid 与版本号
        working-directory: app
        env:
          UNI_APPID: ${{ inputs.uni_appid || secrets.UNI_APPID }}
          # ⚠️ 同样不给兜底：inputs 有值才覆盖 manifest.json 里的值。
          #   传空串会让下面的正则把 versionCode 写成 ""，产出无法安装的包。
          VERSION_NAME: ${{ inputs.version_name }}
          VERSION_CODE: ${{ inputs.version_code }}
        run: |
          python -c "
          import json, os, re
          p = 'src/manifest.json'
          s = open(p, encoding='utf-8').read()
          appid = os.environ.get('UNI_APPID', '').strip()
          if appid:
              s = re.sub(r'\"appid\"\s*:\s*\"[^\"]*\"', '\"appid\": \"%s\"' % appid, s, count=1)
          # 只在**显式非空**时改写：空串会把版本号写成 \"\"，
          # 而 manifest.json 里的原值恰恰是唯一真源（D39）。
          for key, env in (('versionName', 'VERSION_NAME'), ('versionCode', 'VERSION_CODE')):
              val = os.environ.get(env, '').strip()
              if val:
                  s = re.sub(r'\"%s\"\s*:\s*\"[^\"]*\"' % key, '\"%s\": \"%s\"' % (key, val), s, count=1)
          open(p, 'w', encoding='utf-8').write(s)
          d = json.loads(s)
          print('appid ->', d.get('appid'), '| version ->', d.get('versionName'), d.get('versionCode'))
          # 写空版本号会产出一个装不上的包，且云打包照样成功 —— 当场拦下。
          assert d.get('versionCode'), 'versionCode 为空，拒绝出包'
          "

      - name: 缓存 HBuilderX CLI
        id: hx
        uses: actions/cache@v6
        with:
          path: ${{ env.HX_DIR }}
          key: hbuilderx-${{ env.HX_VERSION }}

      - name: 下载 HBuilderX Linux CLI
        if: steps.hx.outputs.cache-hit != 'true'
        run: |
          set -e
          mkdir -p "$HX_DIR"
          curl -sSL -o /tmp/hx.tar.gz \
            "https://download1.dcloud.net.cn/download/HBuilderX.${HX_VERSION}.linux_x64.full.tar.gz"
          tar -xzf /tmp/hx.tar.gz -C "$HX_DIR"
          find "$HX_DIR" -maxdepth 2 -name cli

      - name: 安装无头运行环境
        run: |
          sudo apt-get update -qq
          # 逐个装：Ubuntu 24.04 上 libasound2 已改名 libasound2t64，
          # 一次性装会让整条命令因一个包失败（exit 100）
          for p in xvfb libgtk-3-0 libnss3 libxss1 libgbm1 libatk-bridge2.0-0 \
                   libcups2 libdrm2 libxkbcommon0 libasound2t64 libasound2; do
            sudo apt-get install -y -qq "$p" >/dev/null 2>&1 || echo "skip $p"
          done
          which xvfb-run

      - name: 生成打包配置
        env:
          PACKAGENAME: ${{ inputs.android_packagename || 'com.elder.companion' }}
          CERT_SELF: ${{ inputs.android_cert }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KS_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          STORE_PASS: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -e
          case "$CERT_SELF" in
            self)
              [ -n "$KS_B64" ] || { echo "::error::缺少自有证书 secrets（ANDROID_KEYSTORE_BASE64 等）"; exit 1; }
              echo "$KS_B64" | base64 -d > /tmp/app.keystore
              python -c "
          import json, os
          cfg = {'project': os.path.join(os.environ['GITHUB_WORKSPACE'], 'app'), 'platform': 'android', 'safemode': False,
                 'android': {'packagename': os.environ['PACKAGENAME'], 'androidpacktype': '0',
                             'certalias': os.environ['KS_ALIAS'], 'certfile': '/tmp/app.keystore',
                             'certpassword': os.environ['KS_PASS'], 'storepassword': os.environ['STORE_PASS']}}
          json.dump(cfg, open('/tmp/pack-android.json', 'w'), ensure_ascii=False, indent=2)
          "
              ;;
            public)
              python -c "
          import json, os
          cfg = {'project': os.path.join(os.environ['GITHUB_WORKSPACE'], 'app'), 'platform': 'android', 'safemode': False,
                 'android': {'packagename': os.environ['PACKAGENAME'], 'androidpacktype': '1'}}
          json.dump(cfg, open('/tmp/pack-android.json', 'w'), ensure_ascii=False, indent=2)
          "
              ;;
            *)
              # cloud：DCloud 云端证书（与该 appid 绑定，不需要上传 keystore）
              python -c "
          import json, os
          cfg = {'project': os.path.join(os.environ['GITHUB_WORKSPACE'], 'app'), 'platform': 'android', 'safemode': False,
                 'android': {'packagename': os.environ['PACKAGENAME'], 'androidpacktype': '3'}}
          json.dump(cfg, open('/tmp/pack-android.json', 'w'), ensure_ascii=False, indent=2)
          "
              ;;
          esac
          cat /tmp/pack-android.json

      - name: 云打包（Android）
        env:
          DCLOUD_USERNAME: ${{ secrets.DCLOUD_USERNAME }}
          DCLOUD_PASSWORD: ${{ secrets.DCLOUD_PASSWORD }}
        run: |
          set -e
          if [ -z "$DCLOUD_USERNAME" ] || [ -z "$DCLOUD_PASSWORD" ]; then
            echo "::error::缺少 secrets DCLOUD_USERNAME / DCLOUD_PASSWORD（云打包必须登录 DCloud 账号）"
            exit 1
          fi
          HX=$(find "$HX_DIR" -maxdepth 3 -type f -name cli | head -1)
          HXB=$(dirname "$HX")
          echo "HBuilderX: $HXB"
          cd "$HXB"
          xvfb-run -a ./cli open || true
          sleep 8

          # ---- 登录：cli 登录失败时仍返回 0，必须自己看输出 ----
          ./cli user login --username "$DCLOUD_USERNAME" --password "$DCLOUD_PASSWORD" 2>&1 | tee /tmp/dcloud-login.log
          if grep -qiE "not been registered|FAILED|错误|失败|error" /tmp/dcloud-login.log \
             && ! grep -qiE ":OK|成功|success" /tmp/dcloud-login.log; then
            echo "::error::DCloud 账号登录失败（见上面 cli 输出）。"
            echo "::error::请到 https://account.dcloud.net.cn/ 用同一账号密码登录确认；"
            echo "::error::DCLOUD_USERNAME 必须是 DCloud 的登录名（邮箱 / 手机号 / 用户名），不是任意邮箱。"
            exit 1
          fi

          ./cli project open --path "$GITHUB_WORKSPACE/app"

          # ---- 打包：云端排队 3~15 分钟，cli 持续输出进度，最后给下载链接 ----
          set +e
          ./cli pack --config /tmp/pack-android.json 2>&1 | tee /tmp/pack-android.log
          set -e
          ./cli app quit || true

          if grep -qiE "user not login|未登录|请先登录" /tmp/pack-android.log; then
            echo "::error::打包未真正执行：DCloud 账号处于未登录状态"
            exit 1
          fi

      - name: 收集 APK
        run: |
          set -e
          mkdir -p "$GITHUB_WORKSPACE/out"
          # 渠道一：本地产物（安心打包 safemode=true / 离线打包）
          find "$GITHUB_WORKSPACE/app/unpackage" -name "*.apk" \
            -exec cp {} "$GITHUB_WORKSPACE/out/" \; 2>/dev/null || true
          # 渠道二：传统云打包只在 stdout 给一个临时下载链接，本地不会留文件
          URL=$(grep -oE 'https?://service\.dcloud\.net\.cn/build/download/[A-Za-z0-9._=&%-]+' \
                /tmp/pack-android.log 2>/dev/null | head -1 || true)
          [ -n "$URL" ] || URL=$(grep -oE 'https?://[^ "]+download[^ "]+' \
                /tmp/pack-android.log 2>/dev/null | head -1 || true)
          if [ -n "$URL" ]; then
            echo "云打包下载链接: $URL"
            curl -sSL --retry 3 --retry-delay 5 -o "$GITHUB_WORKSPACE/out/app.apk" "$URL"
          fi
          ls -lh "$GITHUB_WORKSPACE/out"
          test -n "$(ls -A "$GITHUB_WORKSPACE/out")" || {
            echo "::error::未拿到 APK —— 下面是 cli pack 的完整输出，据此判断云端失败原因："
            cat /tmp/pack-android.log
            exit 1
          }

      - uses: actions/upload-artifact@v4
        with:
          name: elder-app-android
          path: out/*.apk
          retention-days: 30
