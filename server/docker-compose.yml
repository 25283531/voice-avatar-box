# 老人陪伴提醒助手 —— 一键部署
#
# 核心栈（默认启动）：
#   elder-db      MySQL 8        业务数据
#   elder-server  本服务          业务 API + 管理页面   http://localhost:8080
#
# 语音栈（可选，需要时加 --profile xiaozhi）：
#   xiaozhi-*     复用 xiaozhi-esp32-server 官方镜像，承载 ASR/LLM/TTS 与 OTA
#
# 访问入口：http://localhost:8064 （容器内 8080，对外只映射 8064）
#
#   docker compose up -d
#   docker compose --profile xiaozhi up -d
#
services:

  # ------------------------------------------------------------ 业务数据库
  elder-db:
    image: mysql:8.0
    container_name: elder-db
    restart: unless-stopped
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-time-zone=+08:00
      --default-authentication-plugin=mysql_native_password
      --skip-name-resolve
      --innodb-buffer-pool-size=256M
      --max-connections=200
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      MYSQL_DATABASE: elder_companion
      TZ: Asia/Shanghai
    volumes:
      - elder-db-data:/var/lib/mysql
    healthcheck:
      # 不能用 mysqladmin ping —— 它只判断「服务在跑」，即使认证失败也返回 0，
      # 容易在 mysqld 尚未能接受查询时误判为就绪。这里执行真实的 SELECT 1，
      # 并把 stderr 丢掉，只用退出码表达健康与否。
      test:
        - CMD-SHELL
        - mysql -h 127.0.0.1 -uroot -p"$$MYSQL_ROOT_PASSWORD" -e "SELECT 1" >/dev/null 2>&1
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s
    networks: [elder-net]

  # ------------------------------------------------------------ 业务后端
  elder-server:
    build: .
    container_name: elder-server
    restart: unless-stopped
    depends_on:
      elder-db:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
      ELDER_DB: mysql+pymysql://root:${MYSQL_ROOT_PASSWORD:-123456}@elder-db:3306/elder_companion?charset=utf8mb4
      # 启动时最多等多久数据库（秒）。即使 elder-db 判定 healthy，mysqld 也可能
      # 还在初始化，直接连会得到 (2013, 'Lost connection ... during query')。
      ELDER_DB_WAIT_SEC: ${ELDER_DB_WAIT_SEC:-180}
      ELDER_JWT_SECRET: ${ELDER_JWT_SECRET:-please-change-this-secret-in-production}
      ELDER_CORS: ${ELDER_CORS:-*}
      ELDER_XIAOZHI_WS: ${ELDER_XIAOZHI_WS:-ws://xiaozhi-server:8000/xiaozhi/v1/}
      ELDER_XIAOZHI_OTA: ${ELDER_XIAOZHI_OTA:-http://xiaozhi-server:8003/xiaozhi/ota/}
    # 对外只发布一个端口，默认 8064（8080 常与其它服务冲突）
    ports:
      - "${ELDER_HTTP_PORT:-8064}:8080"
    networks: [elder-net]
    security_opt:
      - seccomp:unconfined

  # ============================================================ 语音链路（可选）
  xiaozhi-server:
    image: ghcr.io/xinnan-tech/xiaozhi-esp32-server:server_latest
    container_name: xiaozhi-server
    restart: unless-stopped
    profiles: ["xiaozhi"]
    ports:
      - "8000:8000"     # WebSocket 语音通道
      - "8003:8003"     # OTA / 视觉分析
    environment:
      TZ: Asia/Shanghai
    volumes:
      - ./data/xiaozhi:/opt/xiaozhi-esp32-server/data
    networks: [elder-net]
    security_opt:
      - seccomp:unconfined

  xiaozhi-web:
    image: ghcr.io/xinnan-tech/xiaozhi-esp32-server:web_latest
    container_name: xiaozhi-web
    restart: unless-stopped
    profiles: ["xiaozhi"]
    depends_on: [xiaozhi-server]
    ports:
      - "8002:8002"     # 小智智控台（设备管理 / 音色 / 角色）
    environment:
      TZ: Asia/Shanghai
    volumes:
      - ./data/web:/uploadfile
    networks: [elder-net]

volumes:
  elder-db-data:

networks:
  elder-net:
    driver: bridge
