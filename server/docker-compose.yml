# 老人陪伴提醒助手 —— 一键部署（**单一镜像**，默认 SQLite，零外部依赖）
#
# ⚠️ 本文件只包含一个服务：elder-server。这不是简化，是刻意设计的项目约束。
#
# 历史沿革：早期为快速验证，语音/AI 链路直接复用了 xiaozhi-esp32-server 的官方
# 容器（profiles: xiaozhi），等于把角色、音色、记忆、大模型调用都放在了第三方进程里。
# 现在语音链路已改为**自研**（server/app/voice/），与本服务同进程、同端口：
#   - 设备连的 WebSocket 就是本容器的 /api/voice/v1/ws
#   - 地址由服务端按请求 Host 自动推导下发（见 _voice_endpoints），无需手工配置
#   - 因此不再有任何 profile，也不再需要 xiaozhi 那些额外的容器与端口
#
# 一个镜像承担全部平台级能力：
#   业务面   注册/登录/找回密码、账号邮箱、工单、设备管理、配网、提醒日程
#   会员面   套餐、订单（4 位订单号 + 区间随机金额）、人工核销、陪聊配额
#   语音面   WebSocket 语音链路、ASR/LLM/TTS 编排、MCP 工具、多模型路由
#   角色面   预置角色与形象、用户自建角色、人格与语气演化、长期记忆
#
# 数据持久化：
#   命名卷 elder-data 挂到容器 /data，库文件是 /data/elder.db。
#   `docker compose down` 不会删卷，数据还在；`docker compose down -v` 会连卷一起删。
#
# 访问入口：http://localhost:8064 （容器内 8080，对外只映射 8064）
#
#   docker compose up -d                        # 默认形态（内置 SQLite）
#   docker compose -f docker-compose.yml -f docker-compose.mysql.yml up -d   # 用户量大时改用 MySQL
#
#   注：只有在用户量上来之后才需要接 MySQL，详见 docs/DEPLOY.md。
#
services:

  elder-server:
    build: .
    container_name: elder-server
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      # 内置 SQLite 的落点：容器里 /data 是命名卷（见下方 volumes）。
      # 四条斜杠 = sqlite:// + 绝对路径 /data/elder.db，别写成三条（那会变成相对路径）。
      ELDER_DB: sqlite:////data/elder.db
      # SQLite 是本地文件，不需要等数据库就绪；这个变量只在切到 MySQL 时才起作用。
      ELDER_DB_WAIT_SEC: ${ELDER_DB_WAIT_SEC:-180}
      ELDER_JWT_SECRET: ${ELDER_JWT_SECRET:-please-change-this-secret-in-production}
      ELDER_CORS: ${ELDER_CORS:-*}
      # ---------------------------------------------------------------- 语音链路
      # 自研语音链路与本服务同源同端口，设备地址由服务端自动推导，**默认不用配**。
      # 只有当部署在反代后面、且 Host 头没被正确透传时才需要显式指定，例如：
      #   ELDER_VOICE_PUBLIC_BASE: https://voice.2508866.xyz
      # 注意必须给 https（服务端会自动换成 wss），给 ws:// 会导致设备拒绝连接。
      ELDER_VOICE_PUBLIC_BASE: ${ELDER_VOICE_PUBLIC_BASE:-}
      # ---------------------------------------------------------------- 部署模式
      # ELDER_DEPLOY_MODE 三种取值（完整决策表见 docs/DEPLOY.md §4.2）：
      #   auto   —— 默认，不声明拓扑，按请求现场推导（= 上面的历史行为）
      #   direct —— 显式声明"公网直暴露 / 反代后置"，推导逻辑同 auto
      #   tunnel —— Cloudflare Tunnel 等 TLS 前置形态，**必须配对外地址，
      #              否则容器启动直接失败**（缺地址时设备"能心跳不能说话"）
      # 三种模式各自怎么配（**取消注释即生效，默认行为不变**）：
      #
      #   # ① Cloudflare Tunnel（当前生产形态，iStoreOS + cloudflared）：
      #   ELDER_DEPLOY_MODE: tunnel
      #   ELDER_PUBLIC_BASE_URL: ${ELDER_PUBLIC_BASE_URL:-https://voice.2508866.xyz}
      #   # 想给 WS 单独一个域名（Cloudflare Tunnel 支持多 hostname）再加一行：
      #   # ELDER_WS_PUBLIC_BASE_URL: ${ELDER_WS_PUBLIC_BASE_URL:-wss://voice-ws.2508866.xyz}
      #
      #   # ② 公网服务器直暴露（有公网 IP，对外 http://IP:8064）：
      #   ELDER_DEPLOY_MODE: direct
      #   #   direct 不需要对外地址 —— 设备按请求 Host 推导 ws://IP:8064，
      #   #   明文部署下这是对的。风险与取舍见 docs/DEPLOY.md §4.2。
      #
      #   # ③ 有头域的反代（Nginx/Caddy 正确透传 Host）：
      #   #   反代终止 TLS 时 scheme 推导同样不可信（uvicorn 不信任非回环对端的
      #   #   X-Forwarded-Proto），按 ① 配 tunnel + 对外地址最稳；
      #   #   若反代确实把源站当明文 HTTP 用，direct 即可。
      # 旧变量 ELDER_VOICE_PUBLIC_BASE（上面那行）仍然有效，与新变量
      # ELDER_PUBLIC_BASE_URL 同时配置时以新变量为准并打 WARNING。
    volumes:
      - elder-data:/data
    # 对外只发布一个端口，默认 8064（8080 常与其它服务冲突）。
    # 语音 WebSocket 复用这一个端口，不要再开第二个。
    ports:
      - "${ELDER_HTTP_PORT:-8064}:8080"
    networks: [elder-net]
    security_opt:
      - seccomp:unconfined

volumes:
  # 内置 SQLite 库文件所在卷（elder.db）。备份/迁移就是拷这个文件。
  elder-data:

networks:
  elder-net:
    driver: bridge
