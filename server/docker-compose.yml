# 老人陪伴提醒助手 —— 一键部署（默认 SQLite，零外部依赖）
#
# 默认只起一个服务，数据落在内置 SQLite 文件里：
#   elder-server  本服务   业务 API + 管理页面 + 内置 SQLite   http://localhost:8064
#
# 为什么默认不用 MySQL：
#   本项目面向家用 / 单机部署，一台机器跑一个容器最省事。SQLite 是 Python 标准库自带
#   （无需额外依赖、无需额外的数据库容器、无需等待数据库就绪），`docker compose up -d`
#   就能直接用。要换成 MySQL 时再叠加 docker-compose.mysql.yml 即可，见 docs/DEPLOY.md。
#
# 数据持久化：
#   命名卷 elder-data 挂到容器 /data，库文件是 /data/elder.db。
#   `docker compose down` 不会删卷，数据还在；`docker compose down -v` 会连卷一起删。
#
# 访问入口：http://localhost:8064 （容器内 8080，对外只映射 8064）
#
#   docker compose up -d                        # 仅业务面（SQLite）
#   docker compose --profile xiaozhi up -d      # 再带上语音链路
#   docker compose -f docker-compose.yml -f docker-compose.mysql.yml up -d   # 改用 MySQL
#
services:

  # ------------------------------------------------------------ 业务后端
  elder-server:
    build: .
    container_name: elder-server
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      # 内置 SQLite 的落点：容器里 /data 是命名卷（见下方 volumes）。
      # 四条斜杠 = sqlite:// + 绝对路径 /data/elder.db，别写成三条（那会变成相对路径）。
      ELDER_DB: sqlite:////data/elder.db
      # SQLite 是本地文件，不需要等数据库就绪；这个变量只在切到 MySQL 时才起作用。
      ELDER_DB_WAIT_SEC: ${ELDER_DB_WAIT_SEC:-180}
      ELDER_JWT_SECRET: ${ELDER_JWT_SECRET:-please-change-this-secret-in-production}
      ELDER_CORS: ${ELDER_CORS:-*}
      ELDER_XIAOZHI_WS: ${ELDER_XIAOZHI_WS:-ws://xiaozhi-server:8000/xiaozhi/v1/}
      ELDER_XIAOZHI_OTA: ${ELDER_XIAOZHI_OTA:-http://xiaozhi-server:8003/xiaozhi/ota/}
    volumes:
      - elder-data:/data
    # 对外只发布一个端口，默认 8064（8080 常与其它服务冲突）
    ports:
      - "${ELDER_HTTP_PORT:-8064}:8080"
    networks: [elder-net]
    security_opt:
      - seccomp:unconfined

  # ============================================================ 语音链路（可选）
  xiaozhi-server:
    image: ghcr.io/xinnan-tech/xiaozhi-esp32-server:server_latest
    container_name: xiaozhi-server
    restart: unless-stopped
    profiles: ["xiaozhi"]
    ports:
      - "8000:8000"     # WebSocket 语音通道
      - "8003:8003"     # OTA / 视觉分析
    environment:
      TZ: Asia/Shanghai
    volumes:
      - ./data/xiaozhi:/opt/xiaozhi-esp32-server/data
    networks: [elder-net]
    security_opt:
      - seccomp:unconfined

  xiaozhi-web:
    image: ghcr.io/xinnan-tech/xiaozhi-esp32-server:web_latest
    container_name: xiaozhi-web
    restart: unless-stopped
    profiles: ["xiaozhi"]
    depends_on: [xiaozhi-server]
    ports:
      - "8002:8002"     # 小智智控台（设备管理 / 音色 / 角色）
    environment:
      TZ: Asia/Shanghai
    volumes:
      - ./data/web:/uploadfile
    networks: [elder-net]

volumes:
  # 内置 SQLite 库文件所在卷（elder.db）。备份/迁移就是拷这个文件。
  elder-data:

networks:
  elder-net:
    driver: bridge
