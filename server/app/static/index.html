<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>老人陪伴提醒助手 · 管理后台</title>
<style>
  :root{
    --bg:#f5f7fa; --panel:#ffffff; --line:#e3e8ef; --text:#1f2937; --muted:#6b7280;
    --brand:#2563eb; --brand-soft:#eff6ff; --ok:#16a34a; --warn:#d97706; --bad:#dc2626;
    --radius:10px;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
       font:14px/1.6 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
  #app{max-width:1180px;margin:0 auto;padding:20px 16px 60px}
  h1{font-size:19px;margin:0}
  h2{font-size:16px;margin:0 0 12px}
  .muted{color:var(--muted)}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
        padding:16px;margin-bottom:14px}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .row>*{margin:0}
  header.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
  nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
  nav button{border:1px solid var(--line);background:var(--panel);border-radius:20px;
        padding:6px 16px;cursor:pointer;color:var(--text)}
  nav button.on{background:var(--brand);border-color:var(--brand);color:#fff}
  button{border:1px solid var(--line);background:var(--panel);border-radius:6px;
        padding:6px 12px;cursor:pointer;color:var(--text);font-size:13px}
  button.primary{background:var(--brand);border-color:var(--brand);color:#fff}
  button.danger{color:var(--bad);border-color:#f3c7c7}
  button:disabled{opacity:.5;cursor:not-allowed}
  input,select,textarea{border:1px solid var(--line);border-radius:6px;padding:6px 9px;
        font-size:13px;background:#fff;color:var(--text);font-family:inherit}
  textarea{width:100%;min-height:82px;resize:vertical}
  label{display:block;font-size:12px;color:var(--muted);margin-bottom:3px}
  .grid{display:grid;gap:10px}
  .g2{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g3{grid-template-columns:repeat(3,minmax(0,1fr))}
  .g4{grid-template-columns:repeat(4,minmax(0,1fr))}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
  th{color:var(--muted);font-weight:600;font-size:12px}
  /* 数字列右对齐（token 用量对账场景，位数对齐才可比） */
  th.num,td.num{text-align:right;font-variant-numeric:tabular-nums}
  code{background:#f1f5f9;padding:1px 5px;border-radius:4px;font-size:12px}
  .tag{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;
       background:var(--brand-soft);color:var(--brand)}
  .tag.ok{background:#e8f7ee;color:var(--ok)}
  .tag.bad{background:#fdeaea;color:var(--bad)}
  .tag.warn{background:#fdf3e3;color:var(--warn)}
  /* 已取消 / 已过期：终态，不该再抢注意力，用中性灰 */
  .tag.dim{background:#f1f5f9;color:var(--muted)}
  .kpi{background:var(--brand-soft);border-radius:var(--radius);padding:12px}
  .kpi .n{font-size:24px;font-weight:700;color:var(--brand);line-height:1.2}
  .kpi .l{font-size:12px;color:var(--muted)}
  .big-code{font:22px/1.4 ui-monospace,Consolas,monospace;letter-spacing:1px;
       background:#0f172a;color:#7dd3fc;padding:12px 16px;border-radius:8px;
       display:inline-block;margin:8px 0}
  .bars{display:flex;align-items:flex-end;gap:6px;height:120px;padding-top:8px}
  .bars .b{flex:1;background:var(--brand);border-radius:4px 4px 0 0;min-height:2px;position:relative}
  .bars .x{text-align:center;font-size:11px;color:var(--muted);margin-top:4px}
  .err{background:#fdeaea;color:var(--bad);padding:8px 12px;border-radius:6px;margin-bottom:10px}
  .mask{position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;
        align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto}
  .modal{background:#fff;border-radius:12px;padding:18px;width:100%;max-width:720px}
  .close{float:right;border:none;background:none;font-size:20px;cursor:pointer;color:var(--muted)}
  .empty{padding:20px;text-align:center;color:var(--muted)}
  /* ---- 人格预设页专用 ---- */
  /* 档位按钮组：10 维 traits 绝不让运营填 0-1 浮点，一律渲染成单选按钮组。
     选中态用「实心主色」而不是「勾」，因为按钮组是单选语义，
     勾容易被读成多选（多选会让人以为能同时设"很简短"和"详细"）。 */
  .bands{display:flex;gap:6px;flex-wrap:wrap}
  .bands button{font-size:12px;padding:5px 11px}
  .bands button.on{background:var(--brand);border-color:var(--brand);color:#fff}
  .bands button.on.bad{background:var(--bad);border-color:var(--bad)}
  .traitrow{display:grid;grid-template-columns:78px1fr;gap:8px;align-items:start;
        padding:7px 0;border-bottom:1px dashed var(--line)}
  .traitrow .dim{font-size:13px;padding-top:5px}
  .traitrow .eff{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.5}
  .fold{margin-top:12px;border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .fold>summary{cursor:pointer;padding:8px 12px;background:#f8fafc;font-size:13px;
        list-style:none;user-select:none}
  .fold>summary::-webkit-details-marker{display:none}
  .fold>summary:before{content:"▸ ";color:var(--muted)}
  .fold[open]>summary:before{content:"▾ "}
  .fold .inner{padding:8px 12px}
  /* ---- 填写说明区 ---- */
  /* 每块一个浅底卡片而不是靠标题分隔：这些说明要读很久，
     连续十几行 13px 正文贴在一起会让人找不到自己在读哪一条。 */
  .guideblk{border:1px solid var(--line);border-radius:8px;padding:10px 12px;
        margin-bottom:10px;background:#fcfdfe}
  .guideblk h2{font-size:14px;margin:0 0 8px}
  .guideblk p{margin:5px 0;font-size:13px;line-height:1.75}
  /* 字段所在页面的角标：说明写在人格预设页，但片段/灯效其实在形象页填，
     不标出来管理员会在这页找半天。 */
  .guideblk .where{font-size:12px;font-weight:400;color:var(--muted);margin-left:8px}
  .guideblk .ex{background:#0f172a;color:#7dd3fc;padding:10px 12px;border-radius:8px;
        font:12px/1.65 ui-monospace,Consolas,monospace;overflow:auto;margin:6px 0;
        white-space:pre-wrap}
  .guideblk .warn{background:#fdf3e3;color:#8a5a00;padding:7px 10px;border-radius:6px;
        font-size:13px;line-height:1.7}
  .audit{border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:8px}
  .audit pre{white-space:pre-wrap;word-break:break-all;background:#f8fafc;padding:6px 8px;
        border-radius:6px;font-size:12px;margin:4px 0 0}
  .drawer{position:fixed;top:0;right:0;bottom:0;width:420px;max-width:92vw;background:#fff;
        border-left:1px solid var(--line);box-shadow:-6px 0 24px rgba(15,23,42,.12);
        overflow:auto;padding:16px;z-index:20}
  @media(max-width:820px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
<body>
<div id="app">

  <!-- ============================ 登录 ============================ -->
  <div v-if="!token" class="card" style="max-width:380px;margin:80px auto">
    <h2>登录管理后台</h2>
    <div v-if="err" class="err">{{err}}</div>
    <label>用户名</label>
    <input id="lu" v-model="loginForm.username" style="width:100%;margin-bottom:10px" @keyup.enter="doLogin" />
    <label>密码</label>
    <input id="lp" v-model="loginForm.password" type="password" style="width:100%;margin-bottom:14px" @keyup.enter="doLogin" />
    <button id="lb" class="primary" style="width:100%" :disabled="busy" @click="doLogin">登 录</button>
    <p class="muted" style="margin-top:12px;font-size:12px">
      首次部署的管理员口令由启动日志给出（形如 <code>ELDER-INITIAL-PASSWORD=…</code>），
      重启不再显示；也可在部署前用 <code>ELDER_SEED_ADMIN_PASSWORD</code> 指定。登录后请立即修改。
    </p>
  </div>

  <!-- ============================ 主体（仅管理员） ============================ -->
  <!-- 非管理员不走这条分支：见文件末尾的横幅模板。tab 也按 isAdmin 过滤，
       双保险避免「外壳渲染出来再被 403 弹错误条」的旧体验。 -->
  <template v-else-if="isAdmin">
    <header class="bar">
      <div>
        <h1>老人陪伴提醒助手 · 管理后台</h1>
        <div class="muted" style="font-size:12px">
          业务面由本服务提供 · 语音链路走 xiaozhi-esp32-server
        </div>
      </div>
      <div class="row">
        <span class="muted" style="font-size:12px">{{user.username}}</span>
        <button @click="openPassword">修改密码</button>
        <button @click="logout">退出</button>
      </div>
    </header>

    <nav>
      <button v-for="t in tabs" :key="t.k" :class="{on:tab===t.k}" @click="tab=t.k">{{t.n}}</button>
    </nav>

    <div v-if="err" class="err">{{err}}</div>

    <!-- ---------------------- 概览 ---------------------- -->
    <section v-if="tab==='home'">
      <div class="grid g4" style="margin-bottom:14px">
        <div class="kpi"><div class="n">{{devices.length}}</div><div class="l">设备总数</div></div>
        <div class="kpi"><div class="n">{{devices.filter(d=>d.online).length}}</div><div class="l">在线设备</div></div>
        <div class="kpi"><div class="n">{{reminders.length}}</div><div class="l">全平台提醒规则</div></div>
        <div class="kpi"><div class="n">{{avatars.length}}</div><div class="l">形象数量</div></div>
      </div>
      <!-- 快速上手：这份清单只讲**管理员自己**能做的事。
           为什么不写「怎么加设备」：设备登记与激活码绑定都在用户级 /user 页
           （家属用自己的账号操作，见 user.html:155-187）。这里曾写着
           「在设备页登记设备、点生成激活码」，而那两个入口已经不存在 ——
           管理员照着做只会白跑一趟，而且与设备页空态那段
           「这不是故障，设备由家属在 APP 绑定」自相矛盾。 -->
      <div class="card">
        <h2>快速上手</h2>
        <p class="muted" style="font-size:12px;margin:0 0 8px">
          这个后台是<b>平台管理员</b>用的，只负责「配置平台」和「查看运行情况」。
          <b>设备登记、绑定、添加提醒都由家属在 <code>/user</code> 页自己完成</b>，
          管理员在这里看不到也代不了操作。
        </p>
        <ol class="muted" style="margin:0;padding-left:20px;line-height:1.9">
          <li><b>先看设备接进来了没有。</b>「设备」页是只读的：谁接了、什么时候接的、
              系统版本、token 花了多少，一行就够。家属绑定完成后设备会自动出现在这里，
              不用管理员登记。</li>
          <li><b>提醒规则不用你建。</b>「提醒」页能看所有用户设的规则和它们的回执
              （响没响、确认没确认），也能在提醒误报时临时暂停某一条。
              新增和修改请让家属在 <code>/user</code> 操作，他们能在手机上看到自己刚改了什么。</li>
          <li><b>平台级配置在这里做：</b>「AI 接入」页配 ASR / LLM / TTS，
              「形象」页配屏幕动画与灯效资源包，「人格预设」页调全平台说话风格。
              这三项都是<b>所有用户共用</b>的，改动会影响全部设备。</li>
          <li><b>角色绑定也在 <code>/user</code>：</b>哪台设备用哪个人格，
              由家属在自己的页面选，管理员端不提供这个操作。</li>
        </ol>
      </div>
    </section>

    <!-- ---------------------- 设备（只读） ---------------------- -->
    <!-- 管理员端只做「看」：谁接了、什么时候接的、系统版本、花了多少 token。
         新增设备在用户级 /user 页面（那边能拿到设备的 eFuse MAC 与激活码），
         管理员在这里既拿不到 MAC 也代不了用户绑定，给一个入口只会让人空跑一趟。 -->
    <section v-if="tab==='devices'">
      <div class="card">
        <div class="row" style="justify-content:space-between">
          <h2>已接入设备</h2>
          <div class="row">
            <input v-model="devFilter" placeholder="按名称 / 设备标识搜索" />
            <button @click="loadDevices" :disabled="devBusy">{{devBusy?'刷新中…':'刷新'}}</button>
          </div>
        </div>
        <table v-if="shownDevices.length">
          <thead><tr>
            <th>名称</th><th>设备标识</th><th>类型</th><th>拥有者</th>
            <th>接入时间</th><th>系统版本</th><th>状态</th>
            <th class="num">token 用量</th><th>操作</th>
          </tr></thead>
          <tbody>
            <tr v-for="d in shownDevices" :key="d.id">
              <td>{{d.name}}</td>
              <td><code>{{d.device_id}}</code></td>
              <td class="muted">{{devType(d)}}</td>
              <td>{{ownerName(d)}}</td>
              <td class="muted">{{fmt(d.created_at)}}</td>
              <td class="muted">{{d.fw_version||'未上报'}}</td>
              <td><span class="tag" :class="d.online?'ok':''">{{d.online?'在线':'离线'}}</span></td>
              <td class="num">
                <span v-if="devTokens(d.id)">{{devTokens(d.id).toLocaleString()}}</span>
                <span v-else-if="devUsageBusy" class="muted">…</span>
                <span v-else class="muted" title="这台设备还没有产生过任何模型调用">0</span>
              </td>
              <td class="row">
                <button @click="openReminders(d)">看提醒</button>
                <button @click="openStats(d)">看统计</button>
              </td>
            </tr>
          </tbody>
        </table>
        <div v-else-if="devBusy" class="empty">正在读取设备列表…</div>
        <div v-else-if="devFilter" class="empty">
          没有一台设备的名字或标识里有「{{devFilter}}」。<a href="javascript:void(0)" @click="devFilter=''">清空搜索</a>重新看全部。
        </div>
        <div v-else class="empty">
          <p style="margin:0 0 8px"><b>现在还没有任何设备接入平台。</b></p>
          <p style="margin:0">
            这不是故障——设备要由家属在自己手机上安装 APP、输入激活码完成绑定后才会出现在这里。
            平台管理员不负责登记设备。<br>
            如果你确认家属已经装好 APP 却在这里看不到，请让家属打开 APP 的「我的设备」页，
            确认设备已联网并完成绑定；仍看不到再提交工单，我们排查服务端日志。
          </p>
        </div>
      </div>
    </section>

    <!-- ---------------------- 提醒（只读为主） ---------------------- -->
    <!-- 管理员在这里是「排障视角」：某台设备该响没响、家属到底确认了没有。
         新增/编辑提醒是家属在 /user 自己做的事，管理员代设反而会让家属
         在自己手机上看到一个自己没建过的提醒。 -->
    <section v-if="tab==='reminders'">
      <div class="card">
        <div class="row" style="justify-content:space-between">
          <h2>提醒规则</h2>
          <div class="row">
            <select v-model="remDeviceFilter" @change="onRemDeviceFilter">
              <option value="">全部设备</option>
              <option v-for="d in devices" :key="d.id" :value="d.id">{{d.name}}</option>
            </select>
            <select v-model="remUserFilter" @change="applyRemFilter">
              <option value="">全部用户</option>
              <option v-for="u in ownerOptions" :key="u.id" :value="u.id">{{u.name}}</option>
            </select>
            <button @click="loadReminders">刷新</button>
          </div>
        </div>
        <p class="muted" style="font-size:12px;margin:0 0 10px">
          这里只能查看和临时开关某条规则；<b>新增与修改请让家属在 APP 的「我的提醒」里操作</b>，
          这样他们能看到自己刚改了什么。
        </p>
        <table v-if="shownReminders.length">
          <thead><tr><th>标题</th><th>类型</th><th>时间</th><th>重复</th><th>确认</th><th>状态</th><th>操作</th></tr></thead>
          <tbody>
            <tr v-for="r in shownReminders" :key="r.id">
              <td>
                {{r.title}}
                <div class="muted" style="font-size:12px" v-if="r.dose">剂量：{{r.dose}}</div>
                <div class="muted" style="font-size:12px">下次：{{fmt(r.next_fire_at)}}</div>
                <div class="muted" style="font-size:12px">设备：{{deviceName(r.device_id)}}</div>
              </td>
              <td>{{typeName(r.rtype)}}</td>
              <td>{{(r.times_of_day||[]).join(' ')}}</td>
              <td>{{kindName(r)}}</td>
              <td>{{(r.confirm_methods||[]).join('/')||'—'}}</td>
              <td>
                <span class="tag" :class="r.enabled?'ok':''">{{r.enabled?'启用':'暂停'}}</span>
              </td>
              <td class="row">
                <button @click="toggleReminder(r)">{{r.enabled?'暂停':'启用'}}</button>
                <button @click="openRemindersOf(r)">看回执</button>
              </td>
            </tr>
          </tbody>
        </table>
        <div v-else-if="remBusy" class="empty">正在读取提醒规则…</div>
        <div v-else-if="remDeviceFilter || remUserFilter" class="empty">
          当前筛选下没有提醒规则。切换设备或用户再看看。
        </div>
        <div v-else class="empty">
          平台上一条提醒规则都没有。这说明还没有家属设置过服药 / 日程提醒——
          设备本身不自带提醒，需要家属在 APP 里添加。
        </div>
      </div>

      <div class="card" v-if="curDeviceId">
        <h2>最近回执<span v-if="curDeviceLabel"> · {{curDeviceLabel}}</span></h2>
        <table v-if="events.length">
          <thead><tr><th>应触发</th><th>状态</th><th>确认方式</th><th>确认时间</th><th>备注</th></tr></thead>
          <tbody>
            <tr v-for="e in events" :key="e.id">
              <td>{{fmt(e.due_at)}}</td>
              <td><span class="tag" :class="stateClass(e.state)">{{stateName(e.state)}}</span></td>
              <td>{{methodName(e.confirm_method)}}</td>
              <td>{{fmt(e.confirmed_at)}}</td>
              <td class="muted">{{e.note}}</td>
            </tr>
          </tbody>
        </table>
        <div v-else class="empty">该设备还没有回执记录（说明它近期没有触发过提醒，或一直没人确认）</div>
      </div>
    </section>

    <!-- ---------------------- 形象 ---------------------- -->
    <section v-if="tab==='avatars'">
      <div class="card">
        <div class="row" style="justify-content:space-between">
          <h2>形象 / 角色</h2>
          <button class="primary" @click="editAvatar(null)">新增形象</button>
        </div>
        <table v-if="avatars.length">
          <thead><tr><th>名称</th><th>EAF 资源包</th><th>屏幕</th><th>音色</th><th>操作</th></tr></thead>
          <tbody>
            <tr v-for="a in avatars" :key="a.id">
              <td>{{a.name}}<div class="muted" style="font-size:12px">{{a.description}}</div></td>
              <td><code>{{a.eaf_pack_name||'—'}}</code></td>
              <td>{{a.screen_width}}×{{a.screen_height}}</td>
              <td>{{a.tts_voice||'—'}}</td>
              <td class="row">
                <button @click="editAvatar(a)">编辑</button>
                <button class="danger" @click="removeAvatar(a)">删除</button>
              </td>
            </tr>
          </tbody>
        </table>
        <div v-else class="empty">还没有形象</div>
      </div>

      <div v-if="aBox" class="mask" @click.self="aBox=null">
        <div class="modal">
          <button class="close" @click="aBox=null">&times;</button>
          <h2>{{aForm.id?'编辑形象':'新增形象'}}</h2>
          <div class="grid g2">
            <div><label>名称</label><input v-model="aForm.name" style="width:100%" /></div>
            <div><label>简介</label><input v-model="aForm.description" style="width:100%" /></div>
            <div><label>EAF 资源包名</label><input v-model="aForm.eaf_pack_name" style="width:100%" placeholder="xiaonuan" /></div>

    <!-- ===== 人格预设（插在「形象」之后、「AI 接入」之前）===== -->
    <section v-if="tab==='personas'">
      <div class="card">
        <div class="row" style="justify-content:space-between">

          <span class="row" style="gap:12px;align-items:center">
            <span class="muted" style="font-size:12px">红线版本 {{presetMeta.guardrail_version||'—'}}</span>
            <!-- 2026-10-19 用户报「只有一个人格，无法新增多个人格预设」：
                 此前这里只有「红线版本」一个只读角标，整页没有任何创建入口，
                 运营想加第二种说话风格时只能改数据库。 -->
            <button class="primary" @click="openNewPreset">＋ 新增预设</button>
          </span>
        </div>
        <p class="muted" style="font-size:12px;margin:0 0 10px">
          调整的是<b>全平台共享</b>的这一行。设备不缓存人格，保存即对所有
          <b>直接绑定本预设</b>的设备生效；已经派生出去的角色是独立副本，不会跟着变。
        </p>
        <table v-if="presets.length">
          <thead><tr><th>名称</th><th>状态</th><th>话多程度</th><th>绑定设备</th>
            <th>派生角色</th><th>偏离默认</th><th>操作</th></tr></thead>
          <tbody>
            <tr v-for="p in presets" :key="p.id">

              <td><span class="tag" :class="p.archived?'warn':'ok'">{{p.archived?'已下架':'正常'}}</span></td>
              <td>{{traitLabel('verbosity', p.traits.verbosity)}}</td>
              <td>{{p.bound_device_count}} 台</td>
              <td>{{p.derived_role_count}} 个</td>
              <td>
                <span class="tag" :class="p.dirty_fields.length?'warn':'ok'">
                  {{p.dirty_fields.length?'是':'否'}}</span>
                <div v-if="p.dirty_fields.length" class="muted" style="font-size:11px">
                  {{p.dirty_fields.map(f=>dirtyName(f)).join('、')}}</div>

              <td class="row">
                <button @click="openPreset(p)">编辑</button>
                <button @click="resetPreset(p)">恢复默认</button>
                <button class="danger" @click="archivePreset(p)">下架</button>

          <div v-if="pEdit.isNew" class="hint" style="margin:6px 0 0">
            新预设默认与出厂「小暖」完全一致（提示词 / 音色 / 性格 10 维），

            已派生出去的 {{pEdit.derived_role_count}} 个角色是独立副本，<b>不会</b>跟着变。
          </div>

          <!-- ① 基本信息 -->
          <div class="grid g3" style="margin-top:10px">
            <div><label>名称</label><input v-model="pEdit.name" style="width:100%" /></div>
            <div><label>音色</label>
              <select v-model="pEdit.tts_voice" style="width:100%">
                <option value="">（不指定 · 用 TTS 配置的音色，或厂商默认）</option>
                <optgroup label="── 预置音色（Edge TTS 在线可用）──">

          <!-- ② 人格提示词 -->

            <div class="muted" style="font-size:12px">
              提示词<b>不含</b>安全底线 —— 红线由平台代码常量在编译时注入，改这里动不了它。
            </div>
          </div>

          <!-- ③ 性格 10 维：一律档位单选按钮组，绝不填 0-1 浮点 -->
          <div style="margin-top:12px">
            <label>性格 10 维（点档位即可，每格下面是这一档的实际行为）</label>
            <div v-for="spec in presetMeta.trait_specs||[]" :key="spec.name" class="traitrow">
              <div class="dim">{{spec.label}}</div>
              <div>
                <div class="bands">
                  <button v-for="o in spec.options" :key="String(o.value)"
                          :class="{on: isBandOn(spec, o.value)}"
                          @click="setBand(spec, o.value)">{{o.label}}</button>
                </div>
                <div class="eff">{{bandEffect(spec, pEdit.traits[spec.name])}}</div>
              </div>

          <!-- ④ 家属额外要求（软约束） -->
          <div style="margin-top:12px">
            <label>家属额外要求（平台固定 7 项，勾选制）</label>
            <div v-for="g in presetMeta.soft_guardrails||[]" :key="g.id"
                 style="display:flex;gap:6px;align-items:center;font-size:13px;padding:3px 0">

                     @change="toggleSoft(g.id, $event.target.checked)" />
              <span>{{g.text}}</span>
            </div>
            <div class="muted" style="font-size:12px">
              只能从平台固定 7 项里勾选，不能自定义文字 —— 自由文本无法校验，
              且可能与硬红线直接冲突。
            </div>
          </div>

          <!-- ⑤ 安全底线：只读、默认折叠（不隐藏的三条理由见 JS 侧注释） -->
          <details class="fold">
            <summary>🔒 安全底线（{{(presetMeta.hard_guardrails||[]).length}} 条 · 平台强制 · 不可修改）</summary>
            <div class="inner">
              <div v-for="h in pEdit.guardrails_hard||[]" :key="h.id" style="padding:4px 0;font-size:13px">
                <b>{{h.label}}</b>：{{h.text}}
              </div>
              <div class="muted" style="font-size:12px;margin-top:6px">
                这 5 条是平台的绝对底线，<b>不随运营调整变化</b>，也不在保存范围内。
                想确认机器人现在到底带没带红线，用下面的「预览」。
              </div>
            </div>
          </details>

          <div class="row" style="margin-top:16px;justify-content:flex-end">
            <button @click="closePreset">取消</button>
            <!-- 新建态禁用预览：编译要拿一行**已存在**的库内数据做基底
                 （/preview 是按 id 取行的），没有 id 就无从编起。
                 与其给一个必然 404 的按钮，不如直接禁掉并说清原因。 -->
            <button @click="previewPreset" :disabled="!!pEdit.isNew"
                    :title="pEdit.isNew
                      ? '新建态还没有可编译的库内数据，请先保存，之后就能预览'
                      : '查看保存后机器人真正收到的那一整段文字'">预览编译产物</button>
            <button class="primary" :disabled="presetBusy" @click="savePreset">
              {{ pEdit.isNew ? '创建预设' : '保存并立即生效' }}
            </button>
          </div>
        </div>
      </div>

      <!-- 预览层：不落库，只展示编译结果 -->
      <div v-if="pPreview" class="mask" @click.self="pPreview=null">
        <div class="modal">
          <button class="close" @click="pPreview=null">&times;</button>
          <h2>预览：编译后的完整 system prompt（未保存）</h2>
          <p class="muted" style="font-size:12px">
            这就是保存后机器人真正收到的设定，含安全底线首尾两段。
            预览<b>不会</b>落库 —— 关掉即丢弃。
          </p>
          <textarea :value="pPreview.prompt" readonly
                    style="min-height:300px;font-family:ui-monospace,Consolas,monospace;font-size:12px"></textarea>
        </div>
      </div>

      <!-- 审计抽屉 -->
      <div v-if="auditBox" class="drawer">
        <div class="row" style="justify-content:space-between">
          <h2>操作审计：{{auditBox.name}}</h2>
          <button @click="auditBox=null">关闭</button>
        </div>
        <p class="muted" style="font-size:12px">
          谁在什么时候改了哪些字段，逐字段 from→to。<b>恢复默认也算变更</b>，所以也在这里。
        </p>
        <div v-if="!audits.length" class="empty">还没有审计记录</div>
        <div v-for="a in audits" :key="a.id" class="audit">
          <div style="font-size:12px">
            <b>{{a.admin_username||a.admin_id}}</b> · {{actionName(a.action)}} · {{fmt(a.created_at)}}
          </div>
          <div class="muted" style="font-size:12px">
            变更 {{a.changed_fields.length}} 项 · 红线版本 {{a.guardrail_version}}
          </div>
          <div style="font-size:12px;margin-top:2px">
            <span v-for="f in a.changed_fields" :key="f" class="tag">{{diffName(f)}}</span>
          </div>
          <button style="margin-top:4px;font-size:12px" @click="showDiff[a.id]=!showDiff[a.id]">
            {{showDiff[a.id]?'收起明细':'查看明细'}}</button>
          <pre v-if="showDiff[a.id]">{{prettyDiff(a)}}</pre>
        </div>
      </div>

      <!-- ===== 填写说明（页面下部 · 默认收起）===== -->
      <!-- 为什么放这里而不是弹窗：填错 JSON 的后果是「保存成功但设备表现变了」，
           报错还发生在设备端而不是这个页面上。用弹窗的话管理员点「确定」之后
           手上就没东西可以对照了 —— 放在页面下部，他可以一边填一边往下翻。 -->
      <details class="fold">
        <summary>❓ 不知道怎么填？点这里看每个字段的说明和例子</summary>
        <div class="inner">

          <div class="guideblk">
            <h2 style="margin-top:4px">系统提示词 / 人格提示词</h2>
            <p><b>这是干什么的：</b>一句话说清「这个角色该怎么说话」。设备每次回答老人之前，
              都会先读这段文字。写得越具体，说话风格越稳定。</p>
            <p><b>可以直接抄的例子：</b></p>
            <pre class="ex">你叫小暖，是给独居老人用的陪伴助手。
说话像晚辈，语气温和但不幼稚。
每次回答不超过两句话，老人容易听清。
不要主动提医学建议；老人问吃药的事就提醒他按 APP 里设好的提醒来。
老人说「不想活了」这类话时，立刻放慢语念一句「我在这儿，您先歇会儿」，
然后提示他按桌上的呼叫按钮。</pre>
            <p><b>建议多长：</b>5～10 句、200 字以内。超过一屏通常没人认真读完，
              而且每轮对话都要把这段文字发给模型，写太长既费钱又容易被后面的闲聊冲淡。</p>
            <p><b>留空会怎样：</b>机器人退回平台默认语气（中性、偏短）。
              不会出错，但「每个角色听起来都一样」。</p>
            <p class="warn"><b>注意：</b>这里<b>不需要</b>自己写安全底线（不能聊政治、
              不能给医疗建议之类）。那些是平台强制注入的，你写了也会被忽略。
              页面上的「安全底线」折叠区可以随时点开看平台到底强制了什么。</p>
          </div>

          <div class="guideblk">
            <h2>片段映射 JSON<span class="where">（在「形象」页新增/编辑形象时填）</span></h2>
            <p><b>这是干什么的：</b>告诉设备「屏幕上的表情动作叫什么名字」。
              设备待机时要播 <code>idle</code>，张嘴说话时播 <code>mouth_open</code>，
              就是靠这张对照表找到对应的动画片段的。</p>
            <p><b>格式：</b>左边是「什么时候」（<b>这 9 个词是系统认定的，不能自己编</b>），
              右边是「播哪个动画」。右边填你 EAF 资源包里真实存在的片段名，
              最省事的做法是<b>左右两边填一样的词</b>。</p>
            <p><b>可以直接抄的例子：</b></p>
            <pre class="ex">{
  "idle": "idle",
  "listening": "listening",
  "thinking": "thinking",
  "mouth_open": "mouth_open",
  "mouth_half": "mouth_half",
  "smile": "smile",
  "blink": "blink",
  "sleepy": "sleepy",
  "alert": "alert"
}</pre>
            <p><b>这 9 个词分别是什么意思：</b>
              <code>idle</code> 待机 · <code>listening</code> 在听老人说话 ·
              <code>thinking</code> 正在想 · <code>mouth_open</code> 说话时嘴张大 ·
              <code>mouth_half</code> 说话时嘴半张（音量小的时候用）·
              <code>smile</code> 微笑 · <code>blink</code> 眨眼 ·
              <code>sleepy</code> 打哈欠/困 · <code>alert</code> 警示（提醒吃药没确认时用）。</p>
            <p><b>留空会怎样：</b>新建形象时留空，系统会自动填上面这套默认值，
              一般不用管。<b>只有当你的资源包里的片段换了名字</b>（比如资源包里叫
              <code>wait</code> 而不是 <code>idle</code>），才需要回来改。</p>
            <p class="warn"><b>填错的后果：</b>格式写错（少了大括号、末尾多逗号）保存会直接报错；
              名字对不上则屏幕表情不动，但不会影响说话。</p>
          </div>

          <div class="guideblk">
            <h2>情绪灯效 JSON<span class="where">（同样在「形象」页填）</span></h2>
            <p><b>这是干什么的：</b>设备底部那圈灯的颜色。老人说话时亮蓝色、
              提醒吃药没确认时闪红色，就是靠这张表。</p>
            <p><b>格式：</b>左边是「什么情绪」，右边写两个东西：
              <code>rgb</code> 颜色值（<code>#</code> 开头、6 位十六进制），
              <code>effect</code> 灯的闪法。</p>
            <p><b>可以直接抄的例子：</b></p>
            <pre class="ex">{
  "neutral":  {"rgb": "#4A90D9", "effect": "breath"},
  "happy":    {"rgb": "#3AD07A", "effect": "breath"},
  "sad":      {"rgb": "#5B6B8C", "effect": "solid"},
  "angry":    {"rgb": "#E4573D", "effect": "blink"},
  "alert":    {"rgb": "#FF2020", "effect": "solid"},
  "speaking": {"rgb": "#7FD3FF", "effect": "breath"},
  "listening":{"rgb": "#FFD24A", "effect": "breath"}
}</pre>
            <p><b>effect 只有 4 种可选：</b>
              <code>breath</code> 缓慢呼吸（最柔和，适合日常）·
              <code>solid</code> 常亮 ·
              <code>blink</code> 闪烁（<b>只用在需要立刻注意到的情况</b>，长时间闪会让人烦躁）·
              <code>rainbow</code> 彩虹流动（很少用）。</p>
            <p><b>颜色怎么选：</b>红黄蓝这类饱和色在小屏幕上最醒目；
              想柔和就用带一点灰的颜色（如 <code>#5B6B8C</code>）。
              <b>不要只靠颜色区分状态</b>，屏幕上的表情同时也会变。</p>
            <p><b>留空会怎样：</b>新建形象时留空会自动填上面这套默认值，灯会正常亮。</p>
          </div>

          <div class="guideblk">
            <h2>TTS 音色</h2>
            <p><b>这是干什么的：</b>决定机器人念话时是男声还是女声、什么口音。
              这是最直观的一项——<b>改完当场就能听出来</b>。</p>
            <p><b>怎么填：</b><b>从下拉框里选，不要手打。</b>
              下拉框里每一项后面都写了「适合什么场景」，照着挑即可：陪伴聊天优先挑
              温和中年女声；提醒播报挑清晰、语速稳的。</p>
            <p><b>只有一个例外：</b>如果你用的是<b>自己搭建的语音服务</b>
              （不是本平台预置的厂商），才需要选最后一项
              「✎ 其他（自建服务，手填音色名）」，然后填那个服务认识的音色名。
              选了那一项但没填名字，系统会拦下来不让保存。</p>
            <p><b>留空会怎样：</b>用平台默认音色，或者由「AI 接入」页里配置的
              TTS 服务决定。<b>不会没有声音</b>。</p>
            <p class="warn"><b>常见误区：</b>在下拉框里选了自建服务那项、但把音色名
              填在了别的框里。这样保存出来的声音会变掉。音色名只能填在它紧跟着出现的
              那个输入框里。</p>
          </div>

          <div class="guideblk">
            <h2>性格 10 维（人格预设专用）</h2>
            <p><b>这一项不用填 JSON，也不用填数字</b>——每一维都是一组按钮，点一下选中即可。
              点完按钮，下面那行灰字就是这一档的实际表现，看一眼就知道选对没有。</p>
            <p>十维合起来决定「话多不多、幽默不幽默、称呼老人还是叫名字」这类整体风格。
              <b>建议只调和你有明显想法的维度</b>，其余保持默认——
              十维全拧到极端，角色反而会显得别扭。</p>
            <p><b>能不能填 0.6 这种小数？</b>不能，也不该填。这里的选项是产品档位
              不是数学数值，填下去你自己也判断不了它意味着什么。</p>
          </div>

          <div class="guideblk">
            <h2>改完怎么验证</h2>
            <p>人格预设页面里点「<b>预览编译产物</b>」，会显示保存后设备真正收到的那一整段文字。
              <b>这个预览不会保存</b>，关掉就没了 —— 它就是给你在按下保存前做最后确认用的。</p>
            <p>每次改动都会自动记进「审计」，谁在什么时候把哪一项从什么改成什么，
              都可以回查。误操作可以用「恢复默认」退回出厂设置
              （注意：已经派生给用户的角色是独立副本，不会跟着变）。</p>
          </div>

        </div>
      </details>
    </section>

    <!-- ---------------------- AI 接入 -------------------- -->
    <section v-if="tab==='providers'">
      <!-- 服务就绪度：回答「现在能不能说话」，而不是让人自己数配置行 -->

                ? 'border-color:#f3c7c7' : ''">
        <div class="row" style="justify-content:space-between">

          <button @click="loadReadiness" :disabled="readyBusy">{{readyBusy?'检查中…':'重新检查'}}</button>
        </div>

        <div v-if="!readiness" class="empty">正在读取配置状态…</div>

        <template v-else>
          <div v-if="readiness.missing_critical.length" class="hint"
               style="border-color:#f3c7c7;background:#fdf3f3">
            <b>当前还不能提供完整的语音陪聊服务。</b>
            缺少 <b>{{readiness.missing_critical.map(labelOfUsage).join('、')}}</b>
            —— 设备能连上、能心跳，但老人说的话不会被理解，回答也念不出来。
            请先补齐下面标红的几项。
          </div>
          <div v-else class="hint" style="border-color:#bfe3c0;background:#f4fbf4">
            <b>语音链路已就绪。</b>下面绿色几项已配置并会实际生效；
            灰色项未配置不影响说话（详见各自说明）。
          </div>

          <table style="margin-top:10px">
            <thead><tr><th>用途</th><th>是否关键</th><th>状态</th><th>当前生效</th><th>说明</th></tr></thead>
            <tbody>
              <tr v-for="u in readiness.usages" :key="u.usage">
                <td>{{u.label}}<br><small style="color:#888">{{u.usage}}</small></td>
                <td><span class="tag" :class="u.critical?'':'ok'">{{u.critical?'缺了不能说话':'缺了降级'}}</span></td>

                  <span class="tag" :class="u.configured?'ok':(u.critical?'':'ok')">
                    {{u.configured?'已配置':'未配置'}}

                </td>
                <td v-if="u.resolved">
                  {{u.resolved.name}}
                  <span class="tag">{{u.resolved.kind}}</span>
                  <span v-if="u.resolved.fallback" class="tag" title="没命中首选类型，用的是候选链里的兜底项">兜底</span>
                </td>
                <td v-else style="color:#888">—</td>
                <td style="max-width:520px;font-size:13px;line-height:1.7">
                  {{u.hint || '已配置，当前生效。'}}
                </td>
              </tr>
            </tbody>
          </table>

          <div class="hint" style="margin-top:12px">
            <b>关于「默认值」：本项目不内置任何云端模型凭据。</b><br>
            语音识别 / 语音合成 / 大模型三类<b>必须配置</b>，否则设备只是「能连上不能说话」——
            这是刻意设计的：密钥不写进代码或镜像，就不会被别人连同镜像一起拿走。
            选型与免费档对照见 <code>docs/免费语音服务商选型.md</code>。<br>
            <b>端点检测（VAD）不用配</b>：设备端 esp-sr 已承担断句，断网也生效，
            服务端这一项仅在你自建服务端 VAD 时才需要填。
          </div>
        </template>
      </div>

      <div class="card">
        <div class="row" style="justify-content:space-between">
          <h2>AI 平台接入</h2>
          <div class="row">
            <button @click="exportXiaozhi">导出小智配置</button>
            <button class="primary" @click="editProvider(null)">新增</button>
          </div>
        </div>
        <table v-if="providers.length">
          <thead><tr><th>名称</th><th>能力</th><th>平台</th><th>模型</th><th>优先级</th><th>状态</th><th>操作</th></tr></thead>

            <tr v-for="p in providers" :key="p.id">

              <td><span class="tag">{{p.kind}}</span></td>
              <td>{{p.provider}}</td>
              <td>{{p.model||'—'}}</td>
              <td>{{p.priority}}</td>
              <td><span class="tag" :class="p.enabled?'ok':''">{{p.enabled?'启用':'停用'}}</span></td>
              <td class="row">
                <button @click="editProvider(p)">编辑</button>
                <button class="danger" @click="removeProvider(p)">删除</button>
              </td>
            </tr>
          </tbody>
        </table>
        <div v-else class="empty">还没有配置任何 AI 平台</div>
      </div>

      <div v-if="pBox" class="mask" @click.self="pBox=null">
        <div class="modal">
          <button class="close" @click="pBox=null">&times;</button>
          <h2>{{pForm.id?'编辑 AI 配置':'新增 AI 配置'}}</h2>
          <div class="grid g2">
            <div><label>名称</label><input v-model="pForm.name" style="width:100%" placeholder="主力大模型" /></div>
            <div><label>能力</label>
              <select v-model="pForm.kind" style="width:100%">
                <option value="asr">语音识别 ASR</option>
                <option value="tts">语音合成 TTS</option>
                <option value="vad">端点检测 VAD</option>
                <option value="llm">大模型 LLM（默认/兜底）</option>
                <option value="llm_main">大模型·主对话（大参数）</option>
                <option value="llm_light">小模型·识别与执行（小参数）</option>
                <option value="embedding">向量模型 Embedding</option>
                <option value="rerank">重排模型 Rerank</option>
                <option value="vision">视觉理解 Vision（预留）</option>
              </select></div>
            <div><label>平台</label>
              <select v-model="pForm.provider" style="width:100%"
                      @change="onProviderChange">
                <!-- TTS 时厂商下拉来自服务端预置（三家协议不同，字段差异大） -->
                <template v-if="pForm.kind==='tts'">
                  <option v-for="v in ttsVendors" :key="v.value" :value="v.value">{{v.label}}</option>
                  <option value="__other__">其他 / 自建服务（OpenAI 兼容）</option>
                </template>
                <!-- 非 TTS：下拉与预填全部来自服务端预置表（provider_presets）。
                     ⚠️ 不能在这里硬编码厂商名 —— 预置表是「厂商→endpoint/模型/免费口径」
                     的唯一真源，前端再抄一份就会漂移（改了一处忘了另一处）。
                     下面三行自部署服务不在预置表里（没有统一 endpoint 口径），故显式保留。 -->
                <template v-else>
                  <option v-for="p in providerPresets" :key="p.value" :value="p.value">{{p.label}}</option>
                  <option value="volcengine">火山方舟（OpenAI 兼容）</option>
                  <option value="ollama">Ollama（自部署）</option>
                  <option value="dify">Dify</option>
                  <option value="xinference">Xinference（自部署）</option>
                </template>
              </select></div>
            <div v-if="pForm.kind==='tts' && vendorInfo" class="hint"
                 style="grid-column:1/-1;border-color:#cfe0f7;background:#f4f8fd">
              <div style="margin-bottom:4px"><b>{{vendorInfo.label}}</b></div>
              <div style="font-size:13px;line-height:1.7">
                <div><b>费用口径：</b>{{vendorInfo.free_tier}}</div>
                <div v-if="vendorInfo.needs_key"><b>密钥怎么填：</b>{{vendorInfo.key_hint}}</div>
                <div v-else><b>密钥：</b>不需要填，直接保存即可。</div>
                <div v-if="vendorInfo.notes" style="color:#8a5a00;margin-top:4px">{{vendorInfo.notes}}</div>
              </div>
            </div>
            <div v-if="pForm.kind!=='tts' && providerPreset" class="hint"
                 style="grid-column:1/-1;border-color:#cfe0f7;background:#f4f8fd">
              <div style="margin-bottom:4px"><b>{{providerPreset.label}}</b></div>
              <div style="font-size:13px;line-height:1.7">
                <div><b>免费口径：</b>{{providerPreset.free_tier}}</div>
                <div v-if="providerPreset.needs_key"><b>密钥怎么填：</b>{{providerPreset.key_hint}}</div>
                <div v-else><b>密钥：</b>不需要填，直接保存即可。</div>
                <div v-if="providerPreset.notes" style="color:#8a5a00;margin-top:4px">{{providerPreset.notes}}</div>
              </div>
            </div>
            <div v-if="pForm.kind==='tts' && !edgeAvailable" class="hint"
                 style="grid-column:1/-1;border-color:#f3c7c7;background:#fdf3f3">
              <b>本机缺少 Edge TTS 运行依赖。</b>
              服务端需要 <code>edge-tts</code>（合成）与 <code>av</code>（mp3 解码）两个包。
              执行 <code>pip install edge-tts av</code> 后重启服务即可；
              或改选阿里云百炼 / 火山引擎（只需网络，无需这两个依赖）。
            </div>
            <div v-if="pForm.kind==='tts'">
              <label>音色</label>
              <select v-model="pForm.params_text_voice" style="width:100%">
                <option value="">（不指定 · 走角色的音色回落链）</option>
                <optgroup label="── 预置音色 ──">
                  <option v-for="v in vendorVoices" :key="v.id" :value="v.id">
                    {{v.name}} — {{v.scene}}
                  </option>
                </optgroup>
                <option value="__custom__">✎ 其他（自建服务，手填音色名）</option>
              </select>
              <template v-if="pForm.params_text_voice==='__custom__'">
                <input v-model="pForm.tts_voice_custom" style="width:100%;margin-top:6px"
                       placeholder="填该服务认识的音色名" />
              </template>
            </div>
            <div><label>模型</label><input v-model="pForm.model" style="width:100%" /></div>
            <div v-if="showEndpoint"><label>接口地址</label>
              <input v-model="pForm.endpoint" style="width:100%" />
              <!-- 这条提示对所有 kind 都给：endpoint 填错是本项目反复踩的坑，且
                   LLM 侧更隐蔽 —— 少写 /v1 有时拿到的是 HTML 首页而不是报错 -->
              <div style="font-size:12px;color:#888;margin-top:4px">
                填到 <code>/v1</code> 这一级（如 <code>https://…/compatible-mode/v1</code>），
                不要填官网首页，也不要把整条接口地址（如 <code>…/chat/completions</code>）粘进来。
              </div>
            </div>
            <!-- ⚠️ 标签必须是**静态字面量**，不许写成 {{apiKeyLabel}} 这类插值。
                 原因（2026-10-18 线上事故，用户截图里的 function () { [native code] }）：
                 Vue 3 会把 methods 里每个方法 bind(publicThis)，而 bound 函数的
                 toString() 在所有引擎上都恰好是 "function () { [native code] }"。
                 一旦谁把标签用的标识符从 computed 挪进 methods，这个标签就会显示成
                 那串乱码 —— 它长得像「代码泄露」，管理员不知道该不该继续填。
                 真正的守门测试是 tools/smoke_frontend_hygiene.py（静态扫描：
                 任何被插值的裸标识符都不许是 methods 里的方法）。 -->
            <div v-if="showApiKey"><label for="pApiKey">API Key</label>
              <input id="pApiKey" v-model="pForm.api_key" type="password" style="width:100%" />
              <div style="font-size:12px;color:#888;margin-top:4px">{{apiKeyHint}}</div>
            </div>
            <div><label>优先级（越小越优先）</label><input v-model.number="pForm.priority" type="number" /></div>
            <div><label>启用</label>
              <select v-model="pForm.enabled" style="width:100%">
                <option :value="true">启用</option><option :value="false">停用</option>
              </select></div>
            <div><label>厂商 API 风格</label>
              <select v-model="pForm.api_style" style="width:100%">
                <option value="">OpenAI 兼容（默认）</option>
                <option value="openai_compatible">OpenAI 兼容</option>
                <option value="openai">OpenAI 官方</option>
                <option value="anthropic">Anthropic Claude</option>
                <option value="gemini">Google Gemini</option>
                <option value="aliyun">阿里云百炼</option>
                <option value="volcengine">火山方舟</option>
                <option value="ollama">Ollama（本地）</option>
                <option value="xinference">Xinference（本地）</option>
                <option value="custom">自定义</option>

            <div><label>超时（秒）</label><input v-model.number="pForm.timeout_sec" type="number" min="1" max="600" /></div>
            <div><label>失败重试次数</label><input v-model.number="pForm.max_retries" type="number" min="0" max="5" /></div>
            <div><label>上下文上限 token（0=不限）</label><input v-model.number="pForm.context_window" type="number" min="0" /></div>
            <div><label>支持流式</label>
              <select v-model="pForm.supports_stream" style="width:100%">
                <option :value="false">否</option><option :value="true">是</option>
              </select></div>
          </div>
          <div style="margin-top:10px">
            <label>附加参数 JSON（温度 temperature、max_tokens 等）</label>
            <textarea v-model="paramsText" style="min-height:70px"></textarea>
          </div>
          <div style="margin-top:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap">
            <label style="margin:0">试一下（按用途真发一次请求）</label>
            <select v-model="testUsage" style="width:auto">
              <option value="chat">chat 正式对话</option>
              <option value="light">light 轻量任务</option>
              <option value="embed">embed 向量化</option>
              <option value="rerank">rerank 重排</option>
            </select>
            <button style="width:auto;padding:6px 14px" @click="testModel()"
                    :disabled="pForm.kind==='tts' || pForm.kind==='asr'"
                    :title="(pForm.kind==='tts'||pForm.kind==='asr') ? '语音请用下面的「真实测试」' : ''">测试连接（文本类）</button>
            <!-- 语音必须**真打一次**：/api/providers/test 不覆盖 asr/tts，
                 走它只会得到「请先创建角色」这种完全误导的文案 -->
            <button v-if="pForm.kind==='tts' || pForm.kind==='asr'"
                    style="width:auto;padding:6px 14px" class="primary"
                    @click="testVoice()">
              真实测试（{{pForm.kind==='tts'?'会真合成一句中文':'只校验配置链路'}}）
            </button>
            <button style="width:auto;padding:6px 14px" @click="resolveUsage()">解析这条用途落到谁</button>
          </div>
          <div v-if="testResult" style="margin-top:8px;font-size:12px;line-height:1.6">
            <div :style="{color:testResult.ok?'#1a7f37':'#b42318'}">
              {{ testResult.ok ? '调用成功' : '调用失败' }}
              <span v-if="testResult.error_code">（{{testResult.error_code}}）</span>
              <span v-if="testResult.model">· {{testResult.model}} · {{testResult.elapsed_ms}}ms</span>
              <span v-if="testResult.audio_bytes">· 合成 {{testResult.audio_bytes}} 字节
                ≈ {{(testResult.duration_ms/1000).toFixed(2)}} 秒语音</span>
            </div>
            <pre style="white-space:pre-wrap;word-break:break-all;margin:4px 0 0">{{ testResult.ok ? (testResult.text || testResult.detail || JSON.stringify(testResult.vectors || testResult.scores)) : testResult.message }}</pre>
            <div v-if="(testResult.attempts||[]).length" style="color:#666">
              尝试记录：{{ testResult.attempts.map(a=>a.name+'('+a.kind+'/'+(a.ok?'成功':a.error_code)+')').join(' → ') }}
            </div>
          </div>
          <div class="row" style="margin-top:16px;justify-content:flex-end">
            <button @click="pBox=null">取消</button>
            <button class="primary" @click="saveProvider">保存</button>
          </div>
        </div>
      </div>
    </section>

    <!-- ---------------------- 统计 ---------------------- -->
    <section v-if="tab==='stats'">
      <div class="card">
        <div class="row" style="justify-content:space-between">
          <h2>交互统计</h2>
          <select v-model="curDeviceId">
            <option v-for="d in devices" :key="d.id" :value="d.id">{{d.name}}</option>
          </select>
        </div>
        <div v-if="stat" class="grid g4">
          <div class="kpi"><div class="n">{{stat.today_total}}</div><div class="l">今日交互次数</div></div>
          <div class="kpi"><div class="n">{{stat.today_dialog}}</div><div class="l">今日对话轮次</div></div>
          <div class="kpi"><div class="n">{{stat.today_confirm}}</div><div class="l">今日按时确认</div></div>
          <div class="kpi"><div class="n" :style="{color:stat.missed_today?'var(--bad)':'var(--ok)'}">{{stat.missed_today}}</div><div class="l">今日超时未确认</div></div>

    <!-- ---------------------- token 用量（全平台，仅管理员） ---------------------- -->
    <section v-if="tab==='usage'">
      <div class="card">
        <div class="row" style="justify-content:space-between">
          <h2>token 用量</h2>
          <div class="row">
            <select v-model="usageFilter" @change="loadUsage">
              <option value="">全部用途</option>
              <option value="chat">chat 对话</option>
              <option value="light">light 轻任务</option>
              <option value="embed">embed 向量化</option>
              <option value="rerank">rerank 重排</option>
            </select>
            <button @click="loadUsage">刷新</button>
          </div>
        </div>
        <div v-if="usageSummary" class="grid g4">
          <div class="kpi"><div class="n">{{usageSummary.calls}}</div><div class="l">总调用次数</div></div>
          <div class="kpi"><div class="n">{{usageSummary.total_tokens}}</div><div class="l">总 tokens</div></div>
          <div class="kpi">
            <div class="n" :style="{color:usageSummary.failed_calls?'var(--bad)':'var(--ok)'}">
              {{usageSummary.failed_calls}}</div>
            <div class="l">失败次数</div>
          </div>
          <div class="kpi">

    <section v-if="tab==='mail'">

              留空则依次回落到「发件邮箱」→「账号」。测试邮件默认发到这个地址。

          <div>

              两者都开时后端以 SSL 优先（已经是SSL 连接，再套一层没意义），

        <div class="row" style="margin-top:8px">

          <button @click="loadSmtp">放弃修改</button>

        <p class="muted" style="font-size:12px;margin:0 0 10px;line-height:1.8">
          直接用当前<strong>已保存</strong>的配置发一封真实邮件，不会使用上面未保存的输入。
          失败时会把原因原样带回（连不上 / 鉴权失败 / 发件人被拒）。
        </p>
        <div class="row">
          <input v-model="testTo" style="width:260px" placeholder="留空则发给上面的通知收件人" />
          <button :disabled="testBusy" @click="sendTestMail">发送测试邮件</button>
          <button :disabled="testBusy" @click="testTo='';mailTestResult=null">清空</button>
        </div>
        <div v-if="mailTestResult" class="card" style="margin:12px 0 0;background:#f8fafc">
          <div>
            <span class="tag" :class="mailTestResult.ok?'ok':'bad'">{{mailTestResult.ok?'发送成功':'发送失败'}}</span>
            <span v-if="mailTestResult.fake" class="tag warn" style="margin-left:6px">伪装发信（未真正投递）</span>
          </div>
          <div style="margin-top:6px;font-size:13px">{{mailTestResult.message}}</div>
          <div v-if="mailTestResult.to" class="muted" style="font-size:12px;margin-top:4px">收件人：{{mailTestResult.to}}</div>
          <div v-if="mailTestResult.error" class="muted" style="font-size:12px;margin-top:4px;word-break:break-all">
            失败原因：{{mailTestResult.error}}
          </div>
        </div>
      </div>
    </section>

    <!-- ---------------------- 修改密码弹窗 ---------------------- -->
    <!-- POST /api/auth/password：原密码错->400「原密码不正确」（刻意不用 401，
         否则会被统一请求层当成登录态失效踢回登录页），新密码不足 6 位->422。
         校验规则与 /user 端完全一致，避免两个入口给出不同的报错。 -->
    <div v-if="pwBox" class="mask" @click.self="pwBox=false">
      <div class="modal" style="max-width:520px">
        <button class="close" @click="pwBox=false">&times;</button>
        <h2>修改密码</h2>
        <p class="muted" style="font-size:12px;margin:0 0 10px">
          当前账号：<code>{{user.username}}</code>
        </p>
        <div v-if="pwErr" class="err">{{pwErr}}</div>
        <div v-if="pwMsg" class="muted" style="color:var(--ok);font-size:13px;margin-bottom:10px">{{pwMsg}}</div>
        <div><label>当前密码</label>
          <input id="mpwOld" v-model="pwForm.old_password" type="password" style="width:100%" /></div>
        <div style="margin-top:10px"><label>新密码（至少 6 位）</label>
          <input id="mpwNew" v-model="pwForm.new_password" type="password" style="width:100%" /></div>
        <div style="margin-top:10px"><label>确认新密码</label>
          <input id="mpwNew2" v-model="pwForm.new_password2" type="password" style="width:100%" /></div>
        <div class="row" style="margin-top:16px;justify-content:flex-end">
          <button @click="pwBox=false">关闭</button>
          <button class="primary" :disabled="pwBusy" @click="changePassword">修改密码</button>
        </div>
        <p class="muted" style="font-size:12px;margin:12px 0 0;line-height:1.7">
          下次登录请使用新密码。本平台密码为加盐哈希存储，服务端无法找回，
          忘记了只能走「邮箱找回密码」或用 <code>ELDER_RESET_ADMIN_PASSWORD</code> 重置。
        </p>
      </div>
    </div>
  </template>

  <!-- ============================ 非管理员提示 ============================ -->
  <!-- 已登录但不是管理员：醒目横幅 + 跳转 /user，不渲染任何管理 tab。
       旧行为是把 tab 外壳渲染出来、点哪个都弹 403 错误条——既吓到人，
       也等于告诉每个用户「管理功能有哪些」。 -->
  <template v-else>
    <header class="bar">
      <div>
        <h1>老人陪伴提醒助手 · 管理后台</h1>
        <div class="muted" style="font-size:12px">业务面由本服务提供 · 语音链路走 xiaozhi-esp32-server</div>
      </div>
      <div class="row">
        <span class="muted" style="font-size:12px">{{user.username}}</span>
        <button @click="logout">退出</button>
      </div>
    </header>
    <div class="card" style="max-width:680px;margin:40px auto;border-color:#f3c7c7">
      <h2 style="color:var(--bad)">这是管理后台，仅平台管理员可用</h2>
      <p style="font-size:14px;line-height:1.9;margin:0 0 6px">
        您当前登录的账号（<b>{{user.username}}</b>）没有管理员权限。
        设备登记授权、人格预设运营、AI 接入等管理功能仅对平台管理员开放。
      </p>
      <p style="font-size:14px;line-height:1.9;margin:0 0 16px">
        您的个人界面在 <code>/user</code>：可以在那里添加设备、设置提醒、
        管理记忆与人格、查看用量统计。
      </p>
      <div class="row">
        <a href="/user" class="primary" style="background:var(--brand);border-color:var(--brand);color:#fff;
           border-radius:6px;padding:6px 14px;font-size:13px;text-decoration:none">前往我的界面 /user</a>
      </div>
    </div>
  </template>
</div>

<script src="/static/vendor/vue.global.prod.js"></script>
<script>
const { createApp } = Vue;

createApp({
  data(){
    return {
      token: localStorage.getItem('elder_token') || '',
      user: JSON.parse(localStorage.getItem('elder_user') || '{}'),
      tab: 'home',
      tabs: [
        {k:'home',n:'概览'},{k:'devices',n:'设备'},{k:'reminders',n:'提醒'},
        {k:'avatars',n:'形象'},{k:'personas',n:'人格预设'},
        {k:'providers',n:'AI 接入'},{k:'stats',n:'统计'},
        {k:'usage',n:'token 用量'},{k:'mail',n:'邮件配置'}
      ],
      err: '', busy: false,
      loginForm: { username:'', password:'' },
      devices: [], avatars: [], providers: [], reminders: [], events: [],
      curDeviceId: null, stat: null,
      // ---- token 用量（全平台，仅管理员）----
      usageSummary: null, usageRows: [], usageFilter: '',
      // 设备页的只读态：搜索框 + 每台设备的 token 用量。
      // 用量按设备逐台取（见 loadDeviceTokens 的注释），故与 devices 分开存。
      devFilter: '', devBusy: false, devUsageBusy: false, devTokensById: {},
      ownerNames: {},
      // 提醒页筛选（管理员跨用户排查用）。remDeviceFilter 传后端过滤，
      // remUserFilter 是前端过滤 —— 后端 reminders 列表不返回 creator 的用户名，
      // 只能在已知 owner 里筛，见 ownerName 的注释。
      remDeviceFilter: '', remUserFilter: '', remBusy: false,
      aBox: null, aForm: null, clipsText:'', lightsText:'',
      pBox: null, pForm: null, paramsText:'',
      // 打开 AI 配置弹窗那一刻的表单快照（editProvider 赋值）。
      // 用途：testVoice 要能识别「表单有未保存改动」，因为测试读的是数据库里
      // 已保存的配置，表单里没保存的内容服务端一概看不见。
      pFormSnapshot: null,
      testUsage: 'chat', testResult: null,
      // ---- 人格预设运营后台 ----
      presets: [], presetMeta: {trait_specs:[], soft_guardrails:[],
        hard_guardrails:[], guardrail_version:'', defaults:{}},
      // 音色目录由服务端给出（GET /api/providers/catalog）。为什么不在前端硬编码：
      // 出厂默认音色以服务端 app/voice/catalog.py 为单一真源，前端再抄一份必然
      // 出现「下拉框里有的音色，恢复默认后却是另一个」。
      voiceCatalog: {voices:[], allow_custom:true, custom_hint:'', custom_mismatch_hint:''},
      // TTS 厂商预置（也来自 /api/providers/catalog）。
      // ⚠️ 必须服务端下发：三家要填的字段差别太大（火山是 AK:SK 两段、
      // Edge 完全不用填），硬编码在前端等于把「每家要什么」抄成第二份真源。
      ttsVendors: [], voicesByVendor: {}, edgeAvailable: true,
      // 非 TTS 厂商预置（同一接口的 provider_presets 字段）。
      // 与 ttsVendors 同理走服务端下发，理由同上：厂商→endpoint/模型/免费口径
      // 只有 provider_presets.py 一份真源。字段缺失时回落成空数组（见装载处）。
      providerPresets: [],
      // 就绪度面板数据（GET /api/providers/readiness）
      readiness: null, readyBusy:false,
      pEditBox: false, pEdit: null, presetBusy:false,
      pPreview: null, auditBox:null, audits: [], showDiff:{},
      // ---- 账号安全（修改密码）----
      pwBox: false, pwBusy: false, pwErr: '', pwMsg: '',
      pwForm: {old_password:'', new_password:'', new_password2:''},
      // ---- 邮件配置（SMTP）----
      // smtp 是服务端返回的只读快照（password 是掩码），smtpForm 是可编辑副本。
      // 两者分开的原因：GET 回来的 password 是掩码，直接双向绑定会把掩码当密码存回去。
      smtp: {has_password:false, updated_at:null},
      smtpForm: null, smtpLoaded: false,
      smtpBusy: false, smtpErr: '', smtpMsg: '',
      testTo: '', testBusy: false, mailTestResult: null,  // ⚠️ 不许改名回 testResult：AI 配置弹窗已占用同名键，data() 里同名会静默覆盖（smoke_frontend_hygiene L3 守着）
    };
  },
  computed:{
    ttsVoices(){ return this.voiceCatalog.voices || []; },
    customVoicePlaceholder(){
      return '例：cosyvoice-zh-female、GPT_SoVITS 角色名…';
    },
    // 是否管理员。user 来自 localStorage 的 elder_user（登录时由 doLogin 写入）。
    // 两个入口（/ 与 /user）共用这套登录态：普通用户在 /user 登录后打开 /，
    // 这里就是 false —— 看到横幅、看不到任何管理 tab，而不是又弹一次登录框。
    isAdmin(){ return !!(this.user && this.user.is_admin); },
    // 设备页列表：按搜索框过滤。**纯前端**过滤，不重新打接口 ——
    // 搜索是管理员「在这几十台里找那一台」的操作，回一次网络会让打字卡顿。
    shownDevices(){
      const q = (this.devFilter||'').trim().toLowerCase();
      if (!q) return this.devices;
      return this.devices.filter(d =>
        String(d.name||'').toLowerCase().indexOf(q) >= 0 ||
        String(d.device_id||'').toLowerCase().indexOf(q) >= 0);
    },
    // 提醒页的「按用户筛」。**只能筛出 owner 已知的那些**：
    // /api/reminders 不返回 creator 的用户名，而平台也没有「列出所有用户」的
    // 接口，所以未绑定设备的规则在这份用户名表里查不到 —— 这类规则归到
    //「未绑定用户」选项下，而不是让管理员以为筛漏了。
    ownerOptions(){
      const seen = {};
      (this.reminders||[]).forEach(r => {
        const d = this.devices.filter(x => x.id === r.device_id)[0];
        if (!d || !d.owner_id) return;
        seen[d.owner_id] = this.ownerName(d);
      });
      return Object.keys(seen).map(id => ({id: Number(id), name: seen[id]}));
    },
    shownReminders(){
      const byUser = this.remUserFilter;
      if (!byUser) return this.reminders;
      const uid = Number(byUser);
      return (this.reminders||[]).filter(r => {
        const d = this.devices.filter(x => x.id === r.device_id)[0];
        return !!d && d.owner_id === uid;
      });
    },
    curDeviceLabel(){
      const d = this.devices.filter(x => x.id === this.curDeviceId)[0];
      return d ? d.name : '';
    },
    // 表单是否有改动。**故意不把 password 算进去**：输入框留空本来就代表
    // 「不修改」，若把它算进来，管理员每次进来都会看到一个可点的「保存配置」，
    // 点下去才发现其实什么都没改。真正的变更判定交给 saveSmtp 里的比对。
    smtpChanged(){
      if (!this.smtpLoaded || !this.smtpForm) return false;
      const a = this.smtpForm, b = this.smtp || {};
      const norm = v => (v === null || v === undefined) ? '' : String(v);
      return ['host','port','username','use_tls','use_ssl','from_addr',
              'from_name','notify_to','enabled']
        .some(k => norm(a[k]) !== norm(b[k]));
    },
    // API Key 输入框下方的帮助文字。**标签本身是模板里的静态字面量**（见模板注释），
    // 这里只负责「这家要填的 key 长什么样」—— 分成三族是因为填错的代价不同：
    // 火山系要 AK:SK 两段（填成单段会鉴权失败且报错指向不明确），OpenAI 兼容都是
    // 单段（填两段反而连不上），本地服务压根不需要（留空即可）。
    apiKeyHint(){
      const f = this.pForm || {};
      if (f.kind === 'tts'){
        return (this.vendorInfo && this.vendorInfo.key_hint) || '（OpenAI 兼容服务只填一段 key）';
      }
      // 火山系（方舟 / 语音）要的是 AK:SK 两段；provider 与 api_style 两条路都判，
      // 因为方舟既可以配在非 TTS 行（api_style=volcengine）也可能是 TTS 行。
      if (f.provider === 'volcengine' || f.api_style === 'volcengine'){
        return '火山方舟要填 API 密钥：AK:SK 两段（Access Key 与 Secret Key 用英文冒号相连），从火山方舟控制台「API 密钥」页面复制。';
      }
      return '填该平台颁发的一段 API Key（OpenAI 兼容服务均为单段）。本地服务（如 Ollama）不需要密钥，可留空。';
    },
  },
  methods:{
    async api(path, opt){
      const res = await fetch(path, Object.assign({
        headers: Object.assign(
          {'Content-Type':'application/json'},
          this.token ? {Authorization:'Bearer '+this.token} : {}
        )
      }, opt || {}));
      if (res.status === 401){ this.token=''; localStorage.removeItem('elder_token'); return null; }
      const text = await res.text();
      let data = null;
      try { data = text ? JSON.parse(text) : null; } catch(e){ data = text; }
      if (!res.ok){ throw new Error(this.errText(data, res.status)); }
      return data;
    },
    // 把后端的 detail 变成**人能读的一句话**。
    //
    // ⚠️ 为什么必须处理"detail 不是字符串"的三种形态（这三种在本仓都真实存在）：
    //   ① detail 是字符串 —— 我们自己抛的 403/400/404（绝大多数）；
    //   ② detail 是**数组** —— FastAPI 的 422 请求体校验失败，固定结构
    //      `[{loc:[...], msg, type}, ...]`。直接 new Error(array) 会得到
    //      一串毫无意义的字符串拼接，运营完全看不懂自己提交错了什么；
    //   ③ detail 是对象 —— 历史上存在过的形态（如 archive 的引用清单）。
    // 直接 `data.detail || ...` 只处理了第 ① 种，另两种都会渲染成
    // [object Object] —— 那等于"报错信息等于没有"。
    errText(data, status){
      const d = data && data.detail;
      if (typeof d === 'string' && d) return d;
      if (Array.isArray(d)){
        return d.map(it => {
          const loc = Array.isArray(it && it.loc) ? it.loc.join('.') : '';
          return (loc ? loc + '：' : '') + ((it && it.msg) || JSON.stringify(it));
        }).join('；');
      }
      if (d && typeof d === 'object'){
        try { return JSON.stringify(d); } catch(e){ /* 落到下面 */ }
      }
      return 'HTTP ' + status;
    },
    async doLogin(){
      this.busy = true; this.err = '';
      try{
        const r = await fetch('/api/auth/login', {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify(this.loginForm)
        });
        const d = await r.json();
        if (!r.ok) throw new Error(d.detail || '登录失败');
        this.token = d.access_token;
        this.user = {username:d.username, id:d.user_id, is_admin:d.is_admin};
        localStorage.setItem('elder_token', this.token);
        localStorage.setItem('elder_user', JSON.stringify(this.user));
        await this.loadAll();
      }catch(e){ this.err = e.message; }
      finally{ this.busy = false; }
    },
    logout(){ this.token=''; localStorage.removeItem('elder_token'); },
    async loadAll(){
      await Promise.all([this.loadDevices(), this.loadAvatars(), this.loadProviders(),
                       this.loadVoiceCatalog()]);
      // 提醒页默认展示**全部设备**的规则（管理员排障的视角），不是 curDeviceId 那台。
      // remDeviceFilter 留空即全量，与 loadReminders 里的「不传 device_pk」对齐。
      this.remDeviceFilter = '';
      await this.loadReminders();
    },
    // 人格预设页的数据**按需加载**（不进loadAll）：
    // 全平台只有管理员能进这一页，而 loadAll 是登录后必跑的，
    // 非管理员每次登录都白拉一次 403 只会污染全局 err 条。
    async loadPersonas(){
      this.err = '';
      await this.loadPresetMeta();
      await this.loadPresets();
    },
    async loadDevices(){
      this.devBusy = true;
      try{
        const r = await this.api('/api/devices'); if(!r) return;
        this.devices = r;
        if (this.curDeviceId && !r.some(d => d.id === this.curDeviceId)) this.curDeviceId = null;
        if (!this.curDeviceId && r.length) this.curDeviceId = r[0].id;
        await this.loadDeviceTokens();
      }finally{ this.devBusy = false; }
    },
    // 每台设备的 token 用量：逐台调 /api/admin/usage/summary?device_id=<pk>。
    //
    // 为什么不是一次拿全量再在前端分桶：/api/admin/usage/summary 的聚合口径是
    // **整段筛选**（calls/total_tokens/by_usage/by_day），没有 by_device 分组；
    // /api/admin/usage/rows 虽带 device_id，但 limit 上限 200 条，前端分桶
    // 只能得到「最近 200 次调用的分摊」，那不是用量，是流水抽样 —— 拿它当
    // 「token 用量」列展示会得出错误的对账结论。
    // 遗留项：后端在 usage_summary 里加 by_device，一次查询即可（现在是 N 次）。
    async loadDeviceTokens(){
      const ids = this.devices.map(d => d.id);
      if (!ids.length){ this.devTokensById = {}; return; }
      this.devUsageBusy = true;
      try{
        const rs = await Promise.all(ids.map(pk =>
          this.api('/api/admin/usage/summary?device_id=' + pk)
              .then(s => [pk, s && s.total_tokens ? s.total_tokens : 0])
              .catch(() => [pk, 0])));
        const map = {};
        rs.forEach(it => { map[it[0]] = it[1]; });
        this.devTokensById = map;
      }finally{ this.devUsageBusy = false; }
    },
    devTokens(pk){ return this.devTokensById[pk]; },
    // 设备的「类型」。⚠️ **后端目前没有 device_type 字段**（已核 Device 模型与
    // DeviceOut，均无），所以这里给的是管理员唯一分得清的口径：绑定的屏幕规格。
    // 留空文案必须明确指向原因，否则会被读成「查坏了」。
    devType(d){
      const a = this.avatars.filter(x => x.id === d.avatar_id)[0];
      if (!a) return '未绑定形象（型号未上报）';
      return a.screen_width + '×' + a.screen_height + ' 屏';
    },
    // 设备拥有者的用户名。⚠️ /api/devices 只返回 owner_id，**不返回用户名**，
    // 而平台也没有「列出全部用户」的接口 —— 已知用户名只有两个来源：
    // 自己登录的 this.user，以及审计记录里的 admin_username。
    // 取不到时显示 owner_id 而不是「未知」，管理员至少还能拿它去工单里定位。
    ownerName(d){
      if (!d.owner_id) return '未绑定用户';
      if (this.user && this.user.id === d.owner_id) return this.user.username;
      const known = this.ownerNames[d.owner_id];
      return known || ('用户 #' + d.owner_id);
    },
    deviceName(pk){
      const d = this.devices.filter(x => x.id === pk)[0];
      return d ? d.name : ('设备 #' + pk);
    },
    async loadAvatars(){ const r = await this.api('/api/avatars'); if(r) this.avatars = r; },
    async loadProviders(){ const r = await this.api('/api/providers'); if(r) this.providers = r; },
    // 音色目录 + 就绪度面板。两者都**不能阻塞**页面其他部分：
    // 音色目录拉不到时音色框退化成「只有自定义输入」仍可用（宁可少功能不可报错），
    // 就绪度拉不到只显示「读取中」而不是把整页卡住。
    async loadVoiceCatalog(){
      try{
        const r = await this.api('/api/providers/catalog');
        if (r && r.voices) {
          this.voiceCatalog = Object.assign(this.voiceCatalog, r);
          this.ttsVendors = r.vendors || [];
          this.voicesByVendor = r.voices_by_vendor || {};
          this.edgeAvailable = r.edge_available !== false;
          // ⚠️ 用 Array.isArray 兜住，而不是 `|| []`：预置字段缺失/类型不对时
          // 退回「只有自部署三项」的下拉，而不是让模板里 v-for 拿到非数组直接抛错。
          this.providerPresets = Array.isArray(r.provider_presets) ? r.provider_presets : [];
          // 目录到达后要重新拆分：openPreset/editAvatar/openProvider 可能在
          // 目录还空时就把存量音色判成了「不在清单里」，落进自定义框。
          if (this.pEdit) Object.assign(this.pEdit, this.splitVoice(this.pEdit.tts_voice));
          if (this.aForm) Object.assign(this.aForm, this.splitVoice(this.aForm.tts_voice));
        }
      }catch(e){ /* 目录缺失不致命：自定义输入仍然可用 */ }
    },
    // 语音侧的「测试连接」走独立端点：**真打一次**合成。
    // 不能复用 /api/providers/test —— 那个只覆盖 chat/embed/rerank，
    // 语音点过去会得到「请先创建角色」，管理员会以为是自己建错了角色。
    async testVoice(){
      // ---- 前置提醒：测试读的是**数据库里已保存**的配置 ----
      // 这个端点一律 resolve_row(db, usage)从库里取配置，表单里没保存的内容
      // 它一概看不见。管理员的典型误判是「新增一条配置 -> 填音色 -> 点真实测试
      // -> 看到 no_config -> 认定 Edge TTS 不能用」，而真相只是「你没点保存」。
      // 所以在白跑一趟之前先说破。注意是**提示后照旧调用**，不是静默中止 ——
      // 管理员可能只是想验证「库里那条已保存的配置还通不通」。
      if (this.pForm){
        const snap = this.pFormSnapshot;
        const isNew = !this.pForm.id;
        // 深比较：JSON.stringify 逐字比（不引 lodash；本仓已有同款写法）。
        // 快照缺失（理论上不会，editProvider 一定会赋值）时保守当成「有改动」。
        const dirty = !snap
          || JSON.stringify(this.pForm) !== JSON.stringify(snap.form)
          || this.paramsText !== snap.paramsText;
        if (isNew || dirty){
          alert('本次测试会使用**已保存**的配置。\n\n'
            + (isNew
                ? '当前是一条尚未保存的新增配置，数据库里还没有它 —— 服务端读不到。'
                : '当前表单有未保存改动，服务端读的仍是上次保存时的内容。')
            + '\n\n建议先点「保存」再点「真实测试」。'
            + '\n（现在仍会继续发起测试，用的是已保存的那份配置。）');
        }
      }
      this.testResult = null;
      const usage = (this.pForm && this.pForm.kind==='asr') ? 'asr' : 'tts';
      const d = await this.api('/api/providers/test-voice',
        {method:'POST', body:JSON.stringify({usage, text:'老人，今天该吃药了'})});
      if (d) this.testResult = d;
    },
    async loadReadiness(){
      this.readyBusy = true;
      try{
        const r = await this.api('/api/providers/readiness');
        if (r) this.readiness = r;
      }catch(e){ this.readiness = null; }
      finally{ this.readyBusy = false; }
    },
    labelOfUsage(u){
      const hit = (this.readiness&&this.readiness.usages||[]).find(x=>x.usage===u);
      return hit ? hit.label : u;
    },
    // 提醒列表。remDeviceFilter 为空 = 跨全部设备（管理员排障的默认视角，
    // GET /api/reminders 不带 device_pk 时管理员拿到全量，非管理员仍按 owner 收窄，
    // 鉴权在服务端 filters.py/reminders.py:list_reminders）。
    // 回执与统计仍按 curDeviceId 单设备取 —— 那两个端点本来就是单设备口径。
    async loadReminders(){
      this.remBusy = true;
      try{
        const q = this.remDeviceFilter ? '?device_pk=' + this.remDeviceFilter : '';
        const r = await this.api('/api/reminders' + q);
        this.reminders = r || [];
        // ⚠️ 这里**不**回写 curDeviceId：curDeviceId 有 watcher（见 watch 段），
        // 回写会触发第二次 loadReminders —— 一次筛选白打两遍接口。
        // 需要同步的地方由 onRemDeviceFilter 显式做。
        if (!this.curDeviceId){ this.events = []; this.stat = null; return; }
        const e = await this.api('/api/devices/'+this.curDeviceId+'/events?limit=50');
        if (e) this.events = e;
        const s = await this.api('/api/stats/overview?device_pk='+this.curDeviceId);
        this.stat = s;
      }catch(e){ this.err = e.message; }
      finally{ this.remBusy = false; }
    },
    // 切设备筛选：同步 curDeviceId（决定回执卡看哪台）后再取数。
    // 写成显式两步而不是在 loadReminders 里回写，就是为了避开上面那条 watcher 回路。
    onRemDeviceFilter(){
      this.curDeviceId = this.remDeviceFilter ? Number(this.remDeviceFilter) : null;
      this.loadReminders();
    },
    // 「按用户筛」是纯前端过滤，不重打接口：ownerOptions 由当前 reminders
    // 派生，换一次筛选条件就要重算选项，重打接口会让下拉选项自己跳。
    applyRemFilter(){ /* 响应式联动 shownReminders，此处仅留显式入口以便读懂模板 */ },

    // -------- 设备（管理员端只读：这里只保留「跳去看」的方法）--------
    openReminders(d){
      // 顺序有意义：先定筛选范围再改 curDeviceId —— 后者有 watcher 负责取数，
      // 两者同一 tick 内改完，watcher 触发时读到的已经是新范围。
      this.remDeviceFilter = String(d.id);
      this.remUserFilter = '';
      this.curDeviceId = d.id;
      this.tab = 'reminders';
    },
    openStats(d){
      // 统计页只需要 stat 一个数，**不复用 loadReminders** —— 那个方法的
      // reminders 查询走 remDeviceFilter（可能停在另一台设备上），拿它刷新统计
      // 会顺带把提醒列表刷成别的设备的，看着像 bug。
      this.curDeviceId = d.id; this.tab = 'stats';
      this.api('/api/stats/overview?device_pk='+d.id)
        .then(s => { this.stat = s; })
        .catch(e => { this.err = e.message; });
    },

    // -------- 提醒（管理员端只读 + 一个排障用的开关）--------
    // 从提醒列表点「看回执」：切到该条所属设备并把回执卡显示出来。
    // 不跳 tab —— 回执卡就在同一页下方，管理员是在同一个上下文里比对
    // 「规则这么设 ↔ 回执长这样」，跳走等于让他来回切两次。
    openRemindersOf(r){ this.curDeviceId = r.device_id; this.loadReminders(); },
    async toggleReminder(r){
      // 暂停/启用是排障动作（提醒误报时先止血），刻意保留写操作：
      // 它不改变规则内容，只决定「现在还响不响」，事后家属一看就懂。
      const act = r.enabled ? '暂停' : '启用';
      if (!confirm(act + '提醒「'+r.title+'」？\n\n不会删除规则，家属在 APP 上仍能看到它，'
                   + '重新启用后立刻恢复。')) return;
      try{
        await this.api('/api/reminders/'+r.id+'/toggle', {method:'POST'});
        await this.loadReminders();
      }catch(e){ this.err = e.message; }
    },

    // -------- 形象 --------
    blankAvatar(){
      return { name:'', description:'', eaf_pack_name:'', eaf_pack_url:'', eaf_pack_sha256:'',
        screen_width:320, screen_height:240, clips:{}, system_prompt:'', tts_voice:'',
        emotion_lights:{}, enabled:true };
    },
    editAvatar(a){
      this.aForm = a ? JSON.parse(JSON.stringify(a)) : this.blankAvatar();
      Object.assign(this.aForm, this.splitVoice(this.aForm.tts_voice));
      this.clipsText = JSON.stringify(this.aForm.clips||{}, null, 2);
      this.lightsText = JSON.stringify(this.aForm.emotion_lights||{}, null, 2);
      this.aBox = true;
    },
    // 把库里存的音色值拆成「下拉框选中的项」+「自定义文本」两半。
    // 存量数据里可能有不在预置清单里的音色（自建服务），这类必须落到
    // 自定义输入框里展示，而不是让下拉框「什么都不选」——那会让人以为音色丢了，
    // 一存就真的清空了。
    //
    // 返回值要用 Object.assign 写回 pEdit.tts_voice（而不是新开一个字段），
    // 因为模板里的 <select v-model="pEdit.tts_voice"> 绑定的是这一个字段；
    // 若拆到别的字段上，下拉框会显示空选中项，与「什么都不选」无法区分。
    splitVoice(v){
      v = (v||'').trim();
      if (!v) return { tts_voice:'', tts_voice_custom:'' };
      if (this.ttsVoices.some(x=>x.id===v)) return { tts_voice:v, tts_voice_custom:'' };
      return { tts_voice:'__custom__', tts_voice_custom:v };
    },
    // 保存前把选择结果收敛成一个真实字符串。
    // ⚠️ 漏了这一步会把字面量 '__custom__' 存进库：那是个不存在的音色，
    // 表现为「保存成功但声音变了」，属于最难自查的一类静默故障。
    resolveVoice(sel, custom){
      sel = sel || '';
      if (sel === '__custom__') return (custom||'').trim();
      return sel;
    },
    voiceOf(v){ return this.ttsVoices.find(x=>x.id===v) || null; },
    async saveAvatar(){
      try{
        this.aForm.clips = this.clipsText.trim() ? JSON.parse(this.clipsText) : {};
        this.aForm.emotion_lights = this.lightsText.trim() ? JSON.parse(this.lightsText) : {};
      }catch(e){ this.err = 'JSON 格式错误：'+e.message; return; }
      if (this.aForm.tts_voice === '__custom__' && !(this.aForm.tts_voice_custom||'').trim()){
        this.err = '选了「其他」但没填音色名。请填写，或改选一个预置音色。';
        return;
      }
      this.aForm.tts_voice = this.resolveVoice(this.aForm.tts_voice, this.aForm.tts_voice_custom);
      delete this.aForm.tts_voice_custom;
      const body = JSON.parse(JSON.stringify(this.aForm));
      delete body.id; delete body.created_at;
      try{
        if (this.aForm.id) await this.api('/api/avatars/'+this.aForm.id, {method:'PATCH', body:JSON.stringify(body)});
        else await this.api('/api/avatars', {method:'POST', body:JSON.stringify(body)});
        this.aBox = false; await this.loadAvatars();
      }catch(e){ this.err = e.message; }
    },
    async removeAvatar(a){
      if (!confirm('删除形象「'+a.name+'」？')) return;
      await this.api('/api/avatars/'+a.id, {method:'DELETE'});
      await this.loadAvatars();
    },

    // -------- AI --------
    blankProvider(){
      return { name:'', kind:'llm_main', provider:'deepseek', endpoint:'', api_key:'',
        model:'', api_style:'', supports_stream:false, timeout_sec:30, max_retries:1,
        context_window:0, params:{}, priority:10, enabled:true,
        params_text_voice:'', tts_voice_custom:'' };
    },
    // ---- TTS 厂商联动 ----
    // 三个派生量都来自 pForm，所以用 computed 而不是 data —— data 里的副本
    // 会在「改了厂商没同步」时静默出错，而这类错误表现为「音色是上一家的」。
    vendorInfo(){
      if (!this.pForm || this.pForm.kind!=='tts') return null;
      return this.ttsVendors.find(v=>v.value===this.pForm.provider) || null;
    },
    // 非 TTS 的对应物。与 vendorInfo 严格互斥（一个认 tts，一个认 !tts），
    // 这样 onProviderChange 可以靠「先看哪个非空」来分派，不用再判 kind。
    providerPreset(){
      if (!this.pForm || this.pForm.kind==='tts') return null;
      return this.providerPresets.find(p=>p.value===this.pForm.provider) || null;
    },
    vendorVoices(){
      if (!this.pForm) return [];
      const map = this.voicesByVendor || {};
      return map[this.pForm.provider] || [];
    },
    // Edge 没有 endpoint、没有 key —— 显示这两个输入框只会让人瞎填
    showEndpoint(){
      if (!this.pForm || this.pForm.kind!=='tts') return true;
      if (this.pForm.provider==='edge') return false;
      if (this.pForm.provider==='__other__') return true;
      return !!(this.vendorInfo && this.vendorInfo.endpoint);
    },
    showApiKey(){
      if (!this.pForm || this.pForm.kind!=='tts') return true;
      if (this.pForm.provider==='edge') return false;
      if (this.pForm.provider==='__other__') return true;
      return !!(this.vendorInfo && this.vendorInfo.needs_key);
    },
    // 选厂商 → 自动填好该家要的字段。
    // ⚠️ 只在「值还是空的时候」才填，不覆盖管理员已改过的内容 ——
    //    否则每次切回上一个厂商，endpoint 就被冲掉，配置根本没法微调。
    onProviderChange(){
      const info = this.vendorInfo;
      if (!info) {
        // 非 TTS：走 provider_presets 预置。__other__ / 自部署 / Dify /
        // 火山方舟 都不在预置表里 —— 这时**不干预**，让管理员自己填。
        const preset = this.providerPreset;
        if (!preset) return;
        if (!this.pForm.endpoint)  this.pForm.endpoint  = preset.endpoint;
        if (!this.pForm.api_style) this.pForm.api_style = preset.api_style;
        // 模型按当前 kind 取；该 kind 预置里没有（如 deepseek 没有 rerank）
        // 就**什么都不做** —— 既不清空也不瞎填，清空会毁掉管理员手填的模型名。
        if (!this.pForm.model) {
          const m = (preset.models || {})[this.pForm.kind];
          if (m) this.pForm.model = m;
        }
        return;
      }
      if (!this.pForm.endpoint) this.pForm.endpoint = info.endpoint;
      if (!this.pForm.model)    this.pForm.model    = info.model;
      if (info.api_style)       this.pForm.api_style = info.api_style;
      // 换厂商后音色必然失效（火山只认 BV00x、百炼只认 Cherry）
      this.pForm.params_text_voice = '';
      this.pForm.tts_voice_custom = '';
    },
    // 「测试连接」与「解析用途」：调到新增的两个网关端点上
    async testModel(){
      this.testResult = null;
      const usageMap = {llm:'chat', llm_light:'light', embedding:'embed', rerank:'rerank'};
      const usage = this.testUsage || usageMap[this.pForm.kind] || 'chat';
      const d = await this.api('/api/providers/test',
        {method:'POST', body:JSON.stringify({usage, messages:[{role:'user',content:'你好，请用一句话介绍自己'}]})});
      if (d) this.testResult = d;
    },
    async resolveUsage(){
      this.testResult = null;
      const d = await this.api('/api/providers/resolve?usage='+(this.testUsage||'chat'));
      if (d) this.testResult = {ok:true, model:d.name+' → '+d.kind+'/'+d.model+'（'+(d.fallback?'兜底命中':'首选')+'）',
        attempts:[{name:d.name, kind:d.kind, ok:true}], elapsed_ms:d.timeout_sec*1000};
    },
    editProvider(p){
      this.pForm = p ? JSON.parse(JSON.stringify(p)) : this.blankProvider();
      if (!('params_text_voice' in this.pForm)) this.pForm.params_text_voice='';
      if (!('tts_voice_custom' in this.pForm)) this.pForm.tts_voice_custom='';
      // 音色存在 params.voice（服务端 pick_voice 的第三级回落），不是独立字段
      const savedVoice = (this.pForm.params && this.pForm.params.voice) || '';
      if (savedVoice){
        const known = (this.voicesByVendor||{})[this.pForm.provider] || [];
        if (known.some(x=>x.id===savedVoice)) this.pForm.params_text_voice = savedVoice;
        else { this.pForm.params_text_voice = '__custom__'; this.pForm.tts_voice_custom = savedVoice; }
      }
      this.paramsText = JSON.stringify(this.pForm.params||{}, null, 2);
      // 打开弹窗那一刻的深拷贝快照，供 testVoice 判断「表单有没有未保存改动」。
      // 必须放在 params_text_voice / tts_voice_custom 归一化**之后**取，否则
      // 快照里存的是归一化前的形态，点测试时立刻被误判成「有改动」。
      // 连 paramsText 一起存：它才是 params 的编辑真相 —— 只比 pForm.params
      // 的话，管理员在 JSON 框里改了音色而没点任何地方，是检测不出来的改动。
      this.pFormSnapshot = {
        form: JSON.parse(JSON.stringify(this.pForm)),
        paramsText: this.paramsText,
      };
      this.testResult = null;
      this.pBox = true;
    },
    async saveProvider(){
      try{ this.pForm.params = this.paramsText.trim() ? JSON.parse(this.paramsText) : {}; }
      catch(e){ this.err = 'JSON 格式错误：'+e.message; return; }
      // 音色：把下拉/自定义收敛成 params.voice 这一个字段。
      // ⚠️ 漏了会把字面量 '__custom__' 存进库 —— 那是个不存在的音色，
      // 表现为「保存成功但声音变了」，属于最难自查的静默故障。
      if (this.pForm.kind==='tts'){
        let voice = '';
        if (this.pForm.params_text_voice==='__custom__'){
          voice = (this.pForm.tts_voice_custom||'').trim();
          if (!voice){ this.err='音色选了「其他」但没填音色名。'; return; }
        } else if (this.pForm.params_text_voice){
          voice = this.pForm.params_text_voice;
        }
        if (voice) this.pForm.params.voice = voice;
        else delete this.pForm.params.voice;
      }
      const body = JSON.parse(JSON.stringify(this.pForm));
      delete body.id; delete body.created_at;
      // 这两个是纯前端的临时字段，不入库
      delete body.params_text_voice; delete body.tts_voice_custom;
      try{
        if (this.pForm.id) await this.api('/api/providers/'+this.pForm.id, {method:'PATCH', body:JSON.stringify(body)});
        else await this.api('/api/providers', {method:'POST', body:JSON.stringify(body)});
        this.pBox = false; await this.loadProviders(); await this.loadReadiness();
      }catch(e){ this.err = e.message; }
    },
    async removeProvider(p){
      if (!confirm('删除配置「'+p.name+'」？')) return;
      await this.api('/api/providers/'+p.id, {method:'DELETE'});
      await this.loadProviders(); await this.loadReadiness();
    },
