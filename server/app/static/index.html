<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>老人陪伴提醒助手 · 管理后台</title>
<style>
  :root{
    --bg:#f5f7fa; --panel:#ffffff; --line:#e3e8ef; --text:#1f2937; --muted:#6b7280;
    --brand:#2563eb; --brand-soft:#eff6ff; --ok:#16a34a; --warn:#d97706; --bad:#dc2626;
    --radius:10px;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
       font:14px/1.6 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
  #app{max-width:1180px;margin:0 auto;padding:20px 16px 60px}
  h1{font-size:19px;margin:0}
  h2{font-size:16px;margin:0 0 12px}
  .muted{color:var(--muted)}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
        padding:16px;margin-bottom:14px}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .row>*{margin:0}
  header.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
  nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
  nav button{border:1px solid var(--line);background:var(--panel);border-radius:20px;
        padding:6px 16px;cursor:pointer;color:var(--text)}
  nav button.on{background:var(--brand);border-color:var(--brand);color:#fff}
  button{border:1px solid var(--line);background:var(--panel);border-radius:6px;
        padding:6px 12px;cursor:pointer;color:var(--text);font-size:13px}
  button.primary{background:var(--brand);border-color:var(--brand);color:#fff}
  button.danger{color:var(--bad);border-color:#f3c7c7}
  button:disabled{opacity:.5;cursor:not-allowed}
  input,select,textarea{border:1px solid var(--line);border-radius:6px;padding:6px 9px;
        font-size:13px;background:#fff;color:var(--text);font-family:inherit}
  textarea{width:100%;min-height:82px;resize:vertical}
  label{display:block;font-size:12px;color:var(--muted);margin-bottom:3px}
  .grid{display:grid;gap:10px}
  .g2{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g3{grid-template-columns:repeat(3,minmax(0,1fr))}
  .g4{grid-template-columns:repeat(4,minmax(0,1fr))}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
  th{color:var(--muted);font-weight:600;font-size:12px}
  /* 数字列右对齐（token 用量对账场景，位数对齐才可比） */
  th.num,td.num{text-align:right;font-variant-numeric:tabular-nums}
  code{background:#f1f5f9;padding:1px 5px;border-radius:4px;font-size:12px}
  .tag{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;
       background:var(--brand-soft);color:var(--brand)}
  .tag.ok{background:#e8f7ee;color:var(--ok)}
  .tag.bad{background:#fdeaea;color:var(--bad)}
  .tag.warn{background:#fdf3e3;color:var(--warn)}
  .kpi{background:var(--brand-soft);border-radius:var(--radius);padding:12px}
  .kpi .n{font-size:24px;font-weight:700;color:var(--brand);line-height:1.2}
  .kpi .l{font-size:12px;color:var(--muted)}
  .big-code{font:22px/1.4 ui-monospace,Consolas,monospace;letter-spacing:1px;
       background:#0f172a;color:#7dd3fc;padding:12px 16px;border-radius:8px;
       display:inline-block;margin:8px 0}
  .bars{display:flex;align-items:flex-end;gap:6px;height:120px;padding-top:8px}
  .bars .b{flex:1;background:var(--brand);border-radius:4px 4px 0 0;min-height:2px;position:relative}
  .bars .x{text-align:center;font-size:11px;color:var(--muted);margin-top:4px}
  .err{background:#fdeaea;color:var(--bad);padding:8px 12px;border-radius:6px;margin-bottom:10px}
  .mask{position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;
        align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto}
  .modal{background:#fff;border-radius:12px;padding:18px;width:100%;max-width:720px}
  .close{float:right;border:none;background:none;font-size:20px;cursor:pointer;color:var(--muted)}
  .empty{padding:20px;text-align:center;color:var(--muted)}
  /* ---- 人格预设页专用 ---- */
  /* 档位按钮组：10 维 traits 绝不让运营填 0-1 浮点，一律渲染成单选按钮组。
     选中态用「实心主色」而不是「勾」，因为按钮组是单选语义，
     勾容易被读成多选（多选会让人以为能同时设"很简短"和"详细"）。 */
  .bands{display:flex;gap:6px;flex-wrap:wrap}
  .bands button{font-size:12px;padding:5px 11px}
  .bands button.on{background:var(--brand);border-color:var(--brand);color:#fff}
  .bands button.on.bad{background:var(--bad);border-color:var(--bad)}
  .traitrow{display:grid;grid-template-columns:78px1fr;gap:8px;align-items:start;
        padding:7px 0;border-bottom:1px dashed var(--line)}
  .traitrow .dim{font-size:13px;padding-top:5px}
  .traitrow .eff{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.5}
  .fold{margin-top:12px;border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .fold>summary{cursor:pointer;padding:8px 12px;background:#f8fafc;font-size:13px;
        list-style:none;user-select:none}
  .fold>summary::-webkit-details-marker{display:none}
  .fold>summary:before{content:"▸ ";color:var(--muted)}
  .fold[open]>summary:before{content:"▾ "}
  .fold .inner{padding:8px 12px}
  .audit{border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:8px}
  .audit pre{white-space:pre-wrap;word-break:break-all;background:#f8fafc;padding:6px 8px;
        border-radius:6px;font-size:12px;margin:4px 0 0}
  .drawer{position:fixed;top:0;right:0;bottom:0;width:420px;max-width:92vw;background:#fff;
        border-left:1px solid var(--line);box-shadow:-6px 0 24px rgba(15,23,42,.12);
        overflow:auto;padding:16px;z-index:20}
  @media(max-width:820px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
<body>
<div id="app">

  <!-- ============================ 登录 ============================ -->
  <div v-if="!token" class="card" style="max-width:380px;margin:80px auto">
    <h2>登录管理后台</h2>
    <div v-if="err" class="err">{{err}}</div>
    <label>用户名</label>
    <input id="lu" v-model="loginForm.username" style="width:100%;margin-bottom:10px" @keyup.enter="doLogin" />
    <label>密码</label>
    <input id="lp" v-model="loginForm.password" type="password" style="width:100%;margin-bottom:14px" @keyup.enter="doLogin" />
    <button id="lb" class="primary" style="width:100%" :disabled="busy" @click="doLogin">登 录</button>
    <p class="muted" style="margin-top:12px;font-size:12px">
      首次部署默认账号 <code>admin</code> / <code>admin123</code>，登录后请立即修改。
    </p>
  </div>

  <!-- ============================ 主体（仅管理员） ============================ -->
  <!-- 非管理员不走这条分支：见文件末尾的横幅模板。tab 也按 isAdmin 过滤，
       双保险避免「外壳渲染出来再被 403 弹错误条」的旧体验。 -->
  <template v-else-if="isAdmin">
    <header class="bar">
      <div>
        <h1>老人陪伴提醒助手 · 管理后台</h1>
        <div class="muted" style="font-size:12px">
          业务面由本服务提供 · 语音链路走 xiaozhi-esp32-server
        </div>
      </div>
      <div class="row">
        <span class="muted" style="font-size:12px">{{user.username}}</span>
        <button @click="logout">退出</button>
      </div>
    </header>

    <nav>
      <button v-for="t in tabs" :key="t.k" :class="{on:tab===t.k}" @click="tab=t.k">{{t.n}}</button>
    </nav>

    <div v-if="err" class="err">{{err}}</div>

    <!-- ---------------------- 概览 ---------------------- -->
    <section v-if="tab==='home'">
      <div class="grid g4" style="margin-bottom:14px">
        <div class="kpi"><div class="n">{{devices.length}}</div><div class="l">设备总数</div></div>
        <div class="kpi"><div class="n">{{devices.filter(d=>d.online).length}}</div><div class="l">在线设备</div></div>
        <div class="kpi"><div class="n">{{reminders.length}}</div><div class="l">提醒规则</div></div>
        <div class="kpi"><div class="n">{{avatars.length}}</div><div class="l">形象数量</div></div>
      </div>
      <div class="card">
        <h2>快速上手</h2>
        <ol class="muted" style="margin:0;padding-left:20px">
          <li>在「设备」页登记设备，点「生成激活码」，屏幕上会显示形如 <code>A-3829-4471-0056</code> 的 13 位码</li>
          <li>手机端输入该码完成绑定；激活码 10 分钟内有效，末位是 Luhn 校验位，输错当场提示</li>
          <li>在「提醒」页添加服药 / 日程规则，支持按周、按月、隔天与一天多次</li>
          <li>在「形象」页配置 EAF 序列帧资源包与提示词，在设备页应用到具体设备</li>
          <li>在「AI 接入」页配置 ASR / LLM / TTS 平台，可导出为小智配置</li>
        </ol>
      </div>
    </section>

    <!-- ---------------------- 设备 ---------------------- -->
    <section v-if="tab==='devices'">
      <div class="card">
        <h2>登记设备</h2>
        <div class="row">
          <div><label>设备标识（eFuse MAC）</label><input v-model="devForm.device_id" placeholder="aabbccddeeff" /></div>
          <div><label>名称</label><input v-model="devForm.name" placeholder="客厅陪伴助手" /></div>
          <button class="primary" @click="createDevice">添加</button>
        </div>
      </div>
      <div class="card">
        <h2>设备列表</h2>
        <table v-if="devices.length">
          <thead><tr><th>名称</th><th>标识</th><th>状态</th><th>形象</th><th>最近在线</th><th>操作</th></tr></thead>
          <tbody>
            <tr v-for="d in devices" :key="d.id">
              <td>{{d.name}}</td>
              <td><code>{{d.device_id}}</code></td>
              <td><span class="tag" :class="d.online?'ok':''">{{d.online?'在线':'离线'}}</span></td>
              <td>
                <select :value="d.avatar_id||''" @change="applyAvatar(d,$event)">
                  <option value="">未设置</option>
                  <option v-for="a in avatars" :key="a.id" :value="a.id">{{a.name}}</option>
                </select>
              </td>
              <td class="muted">{{fmt(d.last_seen_at)}}</td>
              <td class="row">
                <button @click="genCode(d)">激活码</button>
                <button @click="openReminders(d)">提醒</button>
                <button @click="openStats(d)">统计</button>
                <button class="danger" @click="removeDevice(d)">删除</button>
              </td>
            </tr>
          </tbody>
        </table>
        <div v-else class="empty">还没有设备，先在上方登记一台</div>
      </div>

      <div v-if="codeBox" class="mask" @click.self="codeBox=null">
        <div class="modal">
          <button class="close" @click="codeBox=null">&times;</button>
          <h2>设备激活码</h2>
          <p class="muted">让设备屏幕显示该码，或用手机端输入。<b>10 分钟内有效</b>，过期请在设备上重新获取。</p>
          <div class="big-code">{{codeBox.display}}</div>
          <p class="muted" style="font-size:12px">
            原始码：<code>{{codeBox.code}}</code> · 结构：1 位字母 + 12 位数字（末位 Luhn 校验位）
          </p>
          <div class="row"><button class="primary" @click="copy(codeBox.code)">复制</button></div>
        </div>
      </div>
    </section>

    <!-- ---------------------- 提醒 ---------------------- -->
    <section v-if="tab==='reminders'">
      <div class="card">
        <div class="row" style="justify-content:space-between">
          <h2>提醒规则</h2>
          <div class="row">
            <select v-model="curDeviceId">
              <option v-for="d in devices" :key="d.id" :value="d.id">{{d.name}}</option>
            </select>
            <button class="primary" :disabled="!curDeviceId" @click="editReminder(null)">新增提醒</button>
          </div>
        </div>
        <table v-if="reminders.length">
          <thead><tr><th>标题</th><th>类型</th><th>时间</th><th>重复</th><th>确认</th><th>状态</th><th>操作</th></tr></thead>
          <tbody>
            <tr v-for="r in reminders" :key="r.id">
              <td>
                {{r.title}}
                <div class="muted" style="font-size:12px" v-if="r.dose">剂量：{{r.dose}}</div>
                <div class="muted" style="font-size:12px">下次：{{fmt(r.next_fire_at)}}</div>
              </td>
              <td>{{typeName(r.rtype)}}</td>
              <td>{{(r.times_of_day||[]).join(' ')}}</td>
              <td>{{kindName(r)}}</td>
              <td>{{(r.confirm_methods||[]).join('/')||'—'}}</td>
              <td>
                <span class="tag" :class="r.enabled?'ok':''">{{r.enabled?'启用':'暂停'}}</span>
              </td>
              <td class="row">
                <button @click="editReminder(r)">编辑</button>
                <button @click="toggleReminder(r)">{{r.enabled?'暂停':'启用'}}</button>
                <button class="danger" @click="removeReminder(r)">删除</button>
              </td>
            </tr>
          </tbody>
        </table>
        <div v-else class="empty">该设备还没有提醒规则</div>
      </div>

      <div class="card" v-if="curDeviceId">
        <h2>最近回执</h2>
        <table v-if="events.length">
          <thead><tr><th>应触发</th><th>状态</th><th>确认方式</th><th>确认时间</th><th>备注</th></tr></thead>
          <tbody>
            <tr v-for="e in events" :key="e.id">
              <td>{{fmt(e.due_at)}}</td>
              <td><span class="tag" :class="stateClass(e.state)">{{stateName(e.state)}}</span></td>
              <td>{{methodName(e.confirm_method)}}</td>
              <td>{{fmt(e.confirmed_at)}}</td>
              <td class="muted">{{e.note}}</td>
            </tr>
          </tbody>
        </table>
        <div v-else class="empty">暂无回执</div>
      </div>

      <div v-if="rBox" class="mask" @click.self="rBox=null">
        <div class="modal">
          <button class="close" @click="rBox=null">&times;</button>
          <h2>{{rBox.id?'编辑提醒':'新增提醒'}}</h2>
          <div class="grid g2">
            <div><label>标题</label><input v-model="rForm.title" style="width:100%" /></div>
            <div><label>类型</label>
              <select v-model.number="rForm.rtype" style="width:100%">
                <option :value="0">服药</option><option :value="1">日程</option>
                <option :value="2">喝水</option><option :value="3">运动</option><option :value="4">自定义</option>
              </select></div>
            <div><label>播报文案（留空则读标题）</label><input v-model="rForm.speak_text" style="width:100%" /></div>
            <div><label>剂量 / 备注</label><input v-model="rForm.dose" style="width:100%" placeholder="1 片，饭后" /></div>
          </div>

          <div class="grid g2" style="margin-top:10px">
            <div><label>重复方式</label>
              <select v-model.number="rForm.schedule_kind" style="width:100%">
                <option :value="1">每天</option><option :value="2">每周指定几天</option>
                <option :value="3">每月指定几号</option><option :value="4">每隔 N 天</option>
                <option :value="0">指定日期一次</option>
              </select></div>
            <div><label>触发时刻（24h，逗号分隔，如 08:00, 20:00）</label>
              <input v-model="timesText" style="width:100%" placeholder="08:00, 12:00, 18:00" /></div>
          </div>

          <div class="grid g3" style="margin-top:10px" v-if="rForm.schedule_kind===2">
            <div><label>星期（1=周一）</label><input v-model="weekText" style="width:100%" placeholder="1,3,5" /></div>
            <div><label>生效开始</label><input v-model="rForm.start_date" placeholder="2026-10-01" /></div>
            <div><label>生效结束</label><input v-model="rForm.end_date" placeholder="2027-10-01" /></div>
          </div>
          <div class="grid g3" style="margin-top:10px" v-if="rForm.schedule_kind===3">
            <div><label>每月几号</label><input v-model="monthText" placeholder="1,15" /></div>
            <div><label>生效开始</label><input v-model="rForm.start_date" placeholder="2026-10-01" /></div>
            <div><label>生效结束</label><input v-model="rForm.end_date" placeholder="2027-10-01" /></div>
          </div>
          <div class="grid g3" style="margin-top:10px" v-if="rForm.schedule_kind===4">
            <div><label>每隔天数</label><input v-model.number="rForm.interval_days" type="number" min="1" /></div>
            <div><label>起始日期</label><input v-model="rForm.start_date" placeholder="2026-10-01" /></div>
            <div><label>结束日期</label><input v-model="rForm.end_date" placeholder="2026-12-31" /></div>
          </div>
          <div class="grid g3" style="margin-top:10px" v-if="rForm.schedule_kind===0">
            <div><label>日期</label><input v-model="rForm.once_date" placeholder="2026-10-15" /></div>
          </div>

          <div class="grid g3" style="margin-top:10px">
            <div><label>需要确认</label>
              <select v-model="rForm.require_confirm" style="width:100%">
                <option :value="true">需要</option><option :value="false">不需要</option>
              </select></div>
            <div><label>未确认重复间隔（分钟）</label><input v-model.number="rForm.repeat_interval_min" type="number" /></div>
            <div><label>超时升级（分钟）</label><input v-model.number="rForm.escalate_after_min" type="number" /></div>
          </div>

          <div style="margin-top:10px">
            <label>允许的确认方式</label>
            <div class="row">
              <label style="display:flex;gap:4px;align-items:center">
                <input type="checkbox" value="voice" v-model="rForm.confirm_methods" /> 语音</label>
              <label style="display:flex;gap:4px;align-items:center">
                <input type="checkbox" value="button" v-model="rForm.confirm_methods" /> 按键（长按3秒+30秒内短按）</label>
              <label style="display:flex;gap:4px;align-items:center">
                <input type="checkbox" value="app" v-model="rForm.confirm_methods" /> 手机端</label>
            </div>
          </div>

          <div class="row" style="margin-top:16px;justify-content:flex-end">
            <button @click="rBox=null">取消</button>
            <button class="primary" @click="saveReminder">保存</button>
          </div>
        </div>
      </div>
    </section>

    <!-- ---------------------- 形象 ---------------------- -->
    <section v-if="tab==='avatars'">
      <div class="card">
        <div class="row" style="justify-content:space-between">
          <h2>形象 / 角色</h2>
          <button class="primary" @click="editAvatar(null)">新增形象</button>
        </div>
        <table v-if="avatars.length">
          <thead><tr><th>名称</th><th>EAF 资源包</th><th>屏幕</th><th>音色</th><th>操作</th></tr></thead>
          <tbody>
            <tr v-for="a in avatars" :key="a.id">
              <td>{{a.name}}<div class="muted" style="font-size:12px">{{a.description}}</div></td>
              <td><code>{{a.eaf_pack_name||'—'}}</code></td>
              <td>{{a.screen_width}}×{{a.screen_height}}</td>
              <td>{{a.tts_voice||'—'}}</td>
              <td class="row">
                <button @click="editAvatar(a)">编辑</button>
                <button class="danger" @click="removeAvatar(a)">删除</button>
              </td>
            </tr>
          </tbody>
        </table>
        <div v-else class="empty">还没有形象</div>
      </div>

      <div v-if="aBox" class="mask" @click.self="aBox=null">
        <div class="modal">
          <button class="close" @click="aBox=null">&times;</button>
          <h2>{{aForm.id?'编辑形象':'新增形象'}}</h2>
          <div class="grid g2">
            <div><label>名称</label><input v-model="aForm.name" style="width:100%" /></div>
            <div><label>简介</label><input v-model="aForm.description" style="width:100%" /></div>
            <div><label>EAF 资源包名</label><input v-model="aForm.eaf_pack_name" style="width:100%" placeholder="xiaonuan" /></div>
            <div><label>资源包下载地址</label><input v-model="aForm.eaf_pack_url" style="width:100%" /></div>
            <div><label>屏幕宽</label><input v-model.number="aForm.screen_width" type="number" /></div>
            <div><label>屏幕高</label><input v-model.number="aForm.screen_height" type="number" /></div>
          </div>
          <div style="margin-top:10px">
            <label>系统提示词</label><textarea v-model="aForm.system_prompt"></textarea>
          </div>
          <div class="grid g2" style="margin-top:10px">
            <div><label>TTS 音色</label><input v-model="aForm.tts_voice" style="width:100%" /></div>
            <div><label>SHA256（资源包校验）</label><input v-model="aForm.eaf_pack_sha256" style="width:100%" /></div>
          </div>
          <div style="margin-top:10px">
            <label>片段映射 JSON（idle / listening / mouth_open / smile / blink ...）</label>
            <textarea v-model="clipsText" style="min-height:76px"></textarea>
          </div>
          <div style="margin-top:10px">
            <label>情绪灯效 JSON（{"happy":{"rgb":"#3AD07A","effect":"breath"}}）</label>
            <textarea v-model="lightsText" style="min-height:76px"></textarea>
          </div>
          <div class="row" style="margin-top:16px;justify-content:flex-end">
            <button @click="aBox=null">取消</button>
            <button class="primary" @click="saveAvatar">保存</button>
          </div>
        </div>
      </div>
    </section>

    <!-- ===== 人格预设（插在「形象」之后、「AI 接入」之前）===== -->
    <section v-if="tab==='personas'">
      <div class="card">
        <div class="row" style="justify-content:space-between">
          <h2>平台人格预设</h2>
          <span class="muted" style="font-size:12px">红线版本 {{presetMeta.guardrail_version||'—'}}</span>
        </div>
        <p class="muted" style="font-size:12px;margin:0 0 10px">
          调整的是<b>全平台共享</b>的这一行。设备不缓存人格，保存即对所有
          <b>直接绑定本预设</b>的设备生效；已经派生出去的角色是独立副本，不会跟着变。
        </p>
        <table v-if="presets.length">
          <thead><tr><th>名称</th><th>状态</th><th>话多程度</th><th>绑定设备</th>
            <th>派生角色</th><th>偏离默认</th><th>操作</th></tr></thead>
          <tbody>
            <tr v-for="p in presets" :key="p.id">
              <td>{{p.name}}<div class="muted" style="font-size:12px">{{p.description}}</div></td>
              <td><span class="tag" :class="p.archived?'warn':'ok'">{{p.archived?'已下架':'正常'}}</span></td>
              <td>{{traitLabel('verbosity', p.traits.verbosity)}}</td>
              <td>{{p.bound_device_count}} 台</td>
              <td>{{p.derived_role_count}} 个</td>
              <td>
                <span class="tag" :class="p.dirty_fields.length?'warn':'ok'">
                  {{p.dirty_fields.length?'是':'否'}}</span>
                <div v-if="p.dirty_fields.length" class="muted" style="font-size:11px">
                  {{p.dirty_fields.map(f=>dirtyName(f)).join('、')}}</div>
              </td>
              <td class="row">
                <button @click="openPreset(p)">编辑</button>
                <button @click="resetPreset(p)">恢复默认</button>
                <button class="danger" @click="archivePreset(p)">下架</button>
                <button @click="openAudits(p)">审计</button>
              </td>
            </tr>
          </tbody>
        </table>
        <div v-else class="empty">还没有平台预设</div>
      </div>

      <!-- 编辑弹窗：5 区（基本信息 / 提示词 / 性格 10 维 / 家属额外要求 / 安全底线） -->
      <div v-if="pEditBox" class="mask" @click.self="closePreset">
        <div class="modal" style="max-width:860px">
          <button class="close" @click="closePreset">&times;</button>
          <h2>编辑平台预设：{{pEdit.name}}</h2>

          <div v-if="pEdit.bound_device_count>0" class="err"
               style="background:#fdf3e3;color:var(--warn)">
            ⚠️ 保存后立即对 <b>{{pEdit.bound_device_count}}</b> 台设备生效（系统不缓存人格）。
            已派生出去的 {{pEdit.derived_role_count}} 个角色是独立副本，<b>不会</b>跟着变。
          </div>

          <!-- ① 基本信息 -->
          <div class="grid g3" style="margin-top:10px">
            <div><label>名称</label><input v-model="pEdit.name" style="width:100%" /></div>
            <div><label>音色</label>
              <input v-model="pEdit.tts_voice" style="width:100%" list="ttsVoiceList" />
              <datalist id="ttsVoiceList"><option v-for="v in ttsVoices" :key="v" :value="v"></option></datalist>
            </div>
            <div><label>简介（给用户看）</label><input v-model="pEdit.description" style="width:100%" /></div>
          </div>

          <!-- ② 人格提示词 -->
          <div style="margin-top:10px">
            <label>人格提示词（运营/家属特别交代的语气要求）</label>
            <textarea v-model="pEdit.system_prompt" style="min-height:110px"></textarea>
            <div class="muted" style="font-size:12px">
              提示词<b>不含</b>安全底线 —— 红线由平台代码常量在编译时注入，改这里动不了它。
            </div>
          </div>

          <!-- ③ 性格 10 维：一律档位单选按钮组，绝不填 0-1 浮点 -->
          <div style="margin-top:12px">
            <label>性格 10 维（点档位即可，每格下面是这一档的实际行为）</label>
            <div v-for="spec in presetMeta.trait_specs||[]" :key="spec.name" class="traitrow">
              <div class="dim">{{spec.label}}</div>
              <div>
                <div class="bands">
                  <button v-for="o in spec.options" :key="String(o.value)"
                          :class="{on: isBandOn(spec, o.value)}"
                          @click="setBand(spec, o.value)">{{o.label}}</button>
                </div>
                <div class="eff">{{bandEffect(spec, pEdit.traits[spec.name])}}</div>
              </div>
            </div>
          </div>

          <!-- ④ 家属额外要求（软约束） -->
          <div style="margin-top:12px">
            <label>家属额外要求（平台固定 7 项，勾选制）</label>
            <div v-for="g in presetMeta.soft_guardrails||[]" :key="g.id"
                 style="display:flex;gap:6px;align-items:center;font-size:13px;padding:3px 0">
              <input type="checkbox" :checked="pEdit.guardrails_soft.indexOf(g.id)>=0"
                     @change="toggleSoft(g.id, $event.target.checked)" />
              <span>{{g.text}}</span>
            </div>
            <div class="muted" style="font-size:12px">
              只能从平台固定 7 项里勾选，不能自定义文字 —— 自由文本无法校验，
              且可能与硬红线直接冲突。
            </div>
          </div>

          <!-- ⑤ 安全底线：只读、默认折叠（不隐藏的三条理由见 JS 侧注释） -->
          <details class="fold">
            <summary>🔒 安全底线（{{(presetMeta.hard_guardrails||[]).length}} 条 · 平台强制 · 不可修改）</summary>
            <div class="inner">
              <div v-for="h in pEdit.guardrails_hard||[]" :key="h.id" style="padding:4px 0;font-size:13px">
                <b>{{h.label}}</b>：{{h.text}}
              </div>
              <div class="muted" style="font-size:12px;margin-top:6px">
                这 5 条是平台的绝对底线，<b>不随运营调整变化</b>，也不在保存范围内。
                想确认机器人现在到底带没带红线，用下面的「预览」。
              </div>
            </div>
          </details>

          <div class="row" style="margin-top:16px;justify-content:flex-end">
            <button @click="closePreset">取消</button>
            <button @click="previewPreset">预览编译产物</button>
            <button class="primary" :disabled="presetBusy" @click="savePreset">保存并立即生效</button>
          </div>
        </div>
      </div>

      <!-- 预览层：不落库，只展示编译结果 -->
      <div v-if="pPreview" class="mask" @click.self="pPreview=null">
        <div class="modal">
          <button class="close" @click="pPreview=null">&times;</button>
          <h2>预览：编译后的完整 system prompt（未保存）</h2>
          <p class="muted" style="font-size:12px">
            这就是保存后机器人真正收到的设定，含安全底线首尾两段。
            预览<b>不会</b>落库 —— 关掉即丢弃。
          </p>
          <textarea :value="pPreview.prompt" readonly
                    style="min-height:300px;font-family:ui-monospace,Consolas,monospace;font-size:12px"></textarea>
        </div>
      </div>

      <!-- 审计抽屉 -->
      <div v-if="auditBox" class="drawer">
        <div class="row" style="justify-content:space-between">
          <h2>操作审计：{{auditBox.name}}</h2>
          <button @click="auditBox=null">关闭</button>
        </div>
        <p class="muted" style="font-size:12px">
          谁在什么时候改了哪些字段，逐字段 from→to。<b>恢复默认也算变更</b>，所以也在这里。
        </p>
        <div v-if="!audits.length" class="empty">还没有审计记录</div>
        <div v-for="a in audits" :key="a.id" class="audit">
          <div style="font-size:12px">
            <b>{{a.admin_username||a.admin_id}}</b> · {{actionName(a.action)}} · {{fmt(a.created_at)}}
          </div>
          <div class="muted" style="font-size:12px">
            变更 {{a.changed_fields.length}} 项 · 红线版本 {{a.guardrail_version}}
          </div>
          <div style="font-size:12px;margin-top:2px">
            <span v-for="f in a.changed_fields" :key="f" class="tag">{{diffName(f)}}</span>
          </div>
          <button style="margin-top:4px;font-size:12px" @click="showDiff[a.id]=!showDiff[a.id]">
            {{showDiff[a.id]?'收起明细':'查看明细'}}</button>
          <pre v-if="showDiff[a.id]">{{prettyDiff(a)}}</pre>
        </div>
      </div>
    </section>

    <!-- ---------------------- AI 接入 -------------------- -->
    <section v-if="tab==='providers'">
      <div class="card">
        <div class="row" style="justify-content:space-between">
          <h2>AI 平台接入</h2>
          <div class="row">
            <button @click="exportXiaozhi">导出小智配置</button>
            <button class="primary" @click="editProvider(null)">新增</button>
          </div>
        </div>
        <table v-if="providers.length">
          <thead><tr><th>名称</th><th>能力</th><th>平台</th><th>模型</th><th>优先级</th><th>状态</th><th>操作</th></tr></thead>
          <tbody>
            <tr v-for="p in providers" :key="p.id">
              <td>{{p.name}}</td>
              <td><span class="tag">{{p.kind}}</span></td>
              <td>{{p.provider}}</td>
              <td>{{p.model||'—'}}</td>
              <td>{{p.priority}}</td>
              <td><span class="tag" :class="p.enabled?'ok':''">{{p.enabled?'启用':'停用'}}</span></td>
              <td class="row">
                <button @click="editProvider(p)">编辑</button>
                <button class="danger" @click="removeProvider(p)">删除</button>
              </td>
            </tr>
          </tbody>
        </table>
        <div v-else class="empty">还没有配置任何 AI 平台</div>
      </div>

      <div v-if="pBox" class="mask" @click.self="pBox=null">
        <div class="modal">
          <button class="close" @click="pBox=null">&times;</button>
          <h2>{{pForm.id?'编辑 AI 配置':'新增 AI 配置'}}</h2>
          <div class="grid g2">
            <div><label>名称</label><input v-model="pForm.name" style="width:100%" placeholder="主力大模型" /></div>
            <div><label>能力</label>
              <select v-model="pForm.kind" style="width:100%">
                <option value="asr">语音识别 ASR</option>
                <option value="tts">语音合成 TTS</option>
                <option value="vad">端点检测 VAD</option>
                <option value="llm">大模型 LLM（默认/兜底）</option>
                <option value="llm_main">大模型·主对话（大参数）</option>
                <option value="llm_light">小模型·识别与执行（小参数）</option>
                <option value="embedding">向量模型 Embedding</option>
                <option value="rerank">重排模型 Rerank</option>
                <option value="vision">视觉理解 Vision（预留）</option>
              </select></div>
            <div><label>平台</label>
              <select v-model="pForm.provider" style="width:100%">
                <option value="aliyun">阿里云百炼</option><option value="volcengine">火山引擎</option>
                <option value="deepseek">DeepSeek</option><option value="zhipu">智谱</option>
                <option value="openai">OpenAI 兼容</option><option value="ollama">Ollama（自部署）</option>
                <option value="dify">Dify</option><option value="xinference">Xinference（自部署）</option>
              </select></div>
            <div><label>模型</label><input v-model="pForm.model" style="width:100%" /></div>
            <div><label>接口地址</label><input v-model="pForm.endpoint" style="width:100%" /></div>
            <div><label>API Key</label><input v-model="pForm.api_key" type="password" style="width:100%" /></div>
            <div><label>优先级（越小越优先）</label><input v-model.number="pForm.priority" type="number" /></div>
            <div><label>启用</label>
              <select v-model="pForm.enabled" style="width:100%">
                <option :value="true">启用</option><option :value="false">停用</option>
              </select></div>
            <div><label>厂商 API 风格</label>
              <select v-model="pForm.api_style" style="width:100%">
                <option value="">OpenAI 兼容（默认）</option>
                <option value="openai_compatible">OpenAI 兼容</option>
                <option value="openai">OpenAI 官方</option>
                <option value="anthropic">Anthropic Claude</option>
                <option value="gemini">Google Gemini</option>
                <option value="aliyun">阿里云百炼</option>
                <option value="volcengine">火山方舟</option>
                <option value="ollama">Ollama（本地）</option>
                <option value="xinference">Xinference（本地）</option>
                <option value="custom">自定义</option>
              </select></div>
            <div><label>超时（秒）</label><input v-model.number="pForm.timeout_sec" type="number" min="1" max="600" /></div>
            <div><label>失败重试次数</label><input v-model.number="pForm.max_retries" type="number" min="0" max="5" /></div>
            <div><label>上下文上限 token（0=不限）</label><input v-model.number="pForm.context_window" type="number" min="0" /></div>
            <div><label>支持流式</label>
              <select v-model="pForm.supports_stream" style="width:100%">
                <option :value="false">否</option><option :value="true">是</option>
              </select></div>
          </div>
          <div style="margin-top:10px">
            <label>附加参数 JSON（温度 temperature、max_tokens 等）</label>
            <textarea v-model="paramsText" style="min-height:70px"></textarea>
          </div>
          <div style="margin-top:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap">
            <label style="margin:0">试一下（按用途真发一次请求）</label>
            <select v-model="testUsage" style="width:auto">
              <option value="chat">chat 正式对话</option>
              <option value="light">light 轻量任务</option>
              <option value="embed">embed 向量化</option>
              <option value="rerank">rerank 重排</option>
            </select>
            <button style="width:auto;padding:6px 14px" @click="testModel()">测试连接</button>
            <button style="width:auto;padding:6px 14px" @click="resolveUsage()">解析这条用途落到谁</button>
          </div>
          <div v-if="testResult" style="margin-top:8px;font-size:12px;line-height:1.6">
            <div :style="{color:testResult.ok?'#1a7f37':'#b42318'}">
              {{ testResult.ok ? '调用成功' : '调用失败' }}
              <span v-if="testResult.error_code">（{{testResult.error_code}}）</span>
              <span v-if="testResult.model">· {{testResult.model}} · {{testResult.elapsed_ms}}ms</span>
            </div>
            <pre style="white-space:pre-wrap;word-break:break-all;margin:4px 0 0">{{ testResult.ok ? (testResult.text || JSON.stringify(testResult.vectors || testResult.scores)) : testResult.message }}</pre>
            <div v-if="(testResult.attempts||[]).length" style="color:#666">
              尝试记录：{{ testResult.attempts.map(a=>a.name+'('+a.kind+'/'+(a.ok?'成功':a.error_code)+')').join(' → ') }}
            </div>
          </div>
          <div class="row" style="margin-top:16px;justify-content:flex-end">
            <button @click="pBox=null">取消</button>
            <button class="primary" @click="saveProvider">保存</button>
          </div>
        </div>
      </div>
    </section>

    <!-- ---------------------- 统计 ---------------------- -->
    <section v-if="tab==='stats'">
      <div class="card">
        <div class="row" style="justify-content:space-between">
          <h2>交互统计</h2>
          <select v-model="curDeviceId">
            <option v-for="d in devices" :key="d.id" :value="d.id">{{d.name}}</option>
          </select>
        </div>
        <div v-if="stat" class="grid g4">
          <div class="kpi"><div class="n">{{stat.today_total}}</div><div class="l">今日交互次数</div></div>
          <div class="kpi"><div class="n">{{stat.today_dialog}}</div><div class="l">今日对话轮次</div></div>
          <div class="kpi"><div class="n">{{stat.today_confirm}}</div><div class="l">今日按时确认</div></div>
          <div class="kpi"><div class="n" :style="{color:stat.missed_today?'var(--bad)':'var(--ok)'}">{{stat.missed_today}}</div><div class="l">今日超时未确认</div></div>
        </div>
        <div v-if="stat" style="margin-top:14px">
          <div class="muted" style="font-size:12px;margin-bottom:4px">近 {{stat.series.length}} 天交互次数</div>
          <div class="bars">
            <div v-for="p in stat.series" :key="p.date">
              <div class="b" :style="{height:barHeight(p.total)+'px'}" :title="p.date+' 共 '+p.total+' 次'"></div>
              <div class="x">{{p.date.slice(5)}}</div>
            </div>
          </div>
        </div>
        <div v-else class="empty">选择设备后查看统计</div>
      </div>
    </section>

    <!-- ---------------------- token 用量（全平台，仅管理员） ---------------------- -->
    <section v-if="tab==='usage'">
      <div class="card">
        <div class="row" style="justify-content:space-between">
          <h2>token 用量</h2>
          <div class="row">
            <select v-model="usageFilter" @change="loadUsage">
              <option value="">全部用途</option>
              <option value="chat">chat 对话</option>
              <option value="light">light 轻任务</option>
              <option value="embed">embed 向量化</option>
              <option value="rerank">rerank 重排</option>
            </select>
            <button @click="loadUsage">刷新</button>
          </div>
        </div>
        <div v-if="usageSummary" class="grid g4">
          <div class="kpi"><div class="n">{{usageSummary.calls}}</div><div class="l">总调用次数</div></div>
          <div class="kpi"><div class="n">{{usageSummary.total_tokens}}</div><div class="l">总 tokens</div></div>
          <div class="kpi">
            <div class="n" :style="{color:usageSummary.failed_calls?'var(--bad)':'var(--ok)'}">
              {{usageSummary.failed_calls}}</div>
            <div class="l">失败次数</div>
          </div>
          <div class="kpi">
            <div class="n" style="font-size:18px">
              {{usageSummary.prompt_tokens}} / {{usageSummary.completion_tokens}}</div>
            <div class="l">输入 / 输出 tokens</div>
          </div>
        </div>
        <div v-else class="empty">暂无用量数据</div>
      </div>

      <div class="card" v-if="usageSummary && Object.keys(usageSummary.by_usage||{}).length">
        <h2>按用途分布（tokens）</h2>
        <table>
          <thead><tr><th>用途</th><th class="num">tokens</th></tr></thead>
          <tbody>
            <tr v-for="(v,k) in usageSummary.by_usage" :key="k">
              <td>{{usageName(k)}}</td>
              <td class="num">{{v}}</td>
            </tr>
          </tbody>
        </table>
      </div>

      <div class="card" v-if="usageSummary && (usageSummary.by_day||[]).length">
        <h2>近 {{usageSummary.by_day.length}} 天 tokens</h2>
        <div class="bars">
          <div v-for="p in usageSummary.by_day" :key="p.date" style="flex:1">
            <div class="b" :style="{height:barHeight(p.total_tokens)+'px'}"
                 :title="p.date+' 共 '+p.total_tokens+' tokens'"></div>
            <div class="x">{{p.date.slice(5)}}</div>
          </div>
        </div>
      </div>

      <div class="card">
        <h2>最近调用流水</h2>
        <table v-if="usageRows.length">
          <thead><tr><th>时间</th><th>来源</th><th>用途</th><th>设备</th><th>模型</th>
            <th class="num">tokens</th><th>结果</th></tr></thead>
          <tbody>
            <tr v-for="r in usageRows" :key="r.id">
              <td class="muted">{{fmt(r.created_at)}}</td>
              <td>{{r.source||'—'}}</td>
              <td><span class="tag">{{usageName(r.usage)}}</span></td>
              <td class="num">{{r.device_id||'—'}}</td>
              <td>{{r.provider_name||'—'}}<div class="muted" style="font-size:12px">{{r.model}}</div></td>
              <td class="num">{{r.total_tokens}}</td>
              <td><span class="tag" :class="r.ok?'ok':'bad'">{{r.ok?'成功':'失败'}}</span></td>
            </tr>
          </tbody>
        </table>
        <div v-else class="empty">暂无调用记录</div>
      </div>
    </section>
  </template>

  <!-- ============================ 非管理员提示 ============================ -->
  <!-- 已登录但不是管理员：醒目横幅 + 跳转 /user，不渲染任何管理 tab。
       旧行为是把 tab 外壳渲染出来、点哪个都弹 403 错误条——既吓到人，
       也等于告诉每个用户「管理功能有哪些」。 -->
  <template v-else>
    <header class="bar">
      <div>
        <h1>老人陪伴提醒助手 · 管理后台</h1>
        <div class="muted" style="font-size:12px">业务面由本服务提供 · 语音链路走 xiaozhi-esp32-server</div>
      </div>
      <div class="row">
        <span class="muted" style="font-size:12px">{{user.username}}</span>
        <button @click="logout">退出</button>
      </div>
    </header>
    <div class="card" style="max-width:680px;margin:40px auto;border-color:#f3c7c7">
      <h2 style="color:var(--bad)">这是管理后台，仅平台管理员可用</h2>
      <p style="font-size:14px;line-height:1.9;margin:0 0 6px">
        您当前登录的账号（<b>{{user.username}}</b>）没有管理员权限。
        设备登记核销、人格预设运营、AI 接入等管理功能仅对平台管理员开放。
      </p>
      <p style="font-size:14px;line-height:1.9;margin:0 0 16px">
        您的个人界面在 <code>/user</code>：可以在那里添加设备、查看会员、设置提醒、
        管理记忆与人格、查看用量统计。
      </p>
      <div class="row">
        <a href="/user" class="primary" style="background:var(--brand);border-color:var(--brand);color:#fff;
           border-radius:6px;padding:6px 14px;font-size:13px;text-decoration:none">前往我的界面 /user</a>
      </div>
    </div>
  </template>
</div>

<script src="/static/vendor/vue.global.prod.js"></script>
<script>
const { createApp } = Vue;

createApp({
  data(){
    return {
      token: localStorage.getItem('elder_token') || '',
      user: JSON.parse(localStorage.getItem('elder_user') || '{}'),
      tab: 'home',
      tabs: [
        {k:'home',n:'概览'},{k:'devices',n:'设备'},{k:'reminders',n:'提醒'},
        {k:'avatars',n:'形象'},{k:'personas',n:'人格预设'},
        {k:'providers',n:'AI 接入'},{k:'stats',n:'统计'},
        {k:'usage',n:'token 用量'}
      ],
      err: '', busy: false,
      loginForm: { username:'', password:'' },
      devices: [], avatars: [], providers: [], reminders: [], events: [],
      curDeviceId: null, stat: null,
      // ---- token 用量（全平台，仅管理员）----
      usageSummary: null, usageRows: [], usageFilter: '',
      devForm: { device_id:'', name:'我的陪伴助手' },
      codeBox: null,
      rBox: null, rForm: null, timesText:'', weekText:'', monthText:'',
      aBox: null, aForm: null, clipsText:'', lightsText:'',
      pBox: null, pForm: null, paramsText:'',
      testUsage: 'chat', testResult: null,
      // ---- 人格预设运营后台 ----
      presets: [], presetMeta: {trait_specs:[], soft_guardrails:[],
        hard_guardrails:[], guardrail_version:'', defaults:{}},
      ttsVoices: ['zh-CN-XiaoxiaoNeural','zh-CN-XiaoyiNeural','zh-CN-YunjianNeural',
                  'zh-CN-YunxiNeural','zh-CN-YunyangNeural'],
      pEditBox: false, pEdit: null, presetBusy:false,
      pPreview: null, auditBox:null, audits: [], showDiff:{}
    };
  },
  computed:{
    // 是否管理员。user 来自 localStorage 的 elder_user（登录时由 doLogin 写入）。
    // 两个入口（/ 与 /user）共用这套登录态：普通用户在 /user 登录后打开 /，
    // 这里就是 false —— 看到横幅、看不到任何管理 tab，而不是又弹一次登录框。
    isAdmin(){ return !!(this.user && this.user.is_admin); }
  },
  methods:{
    async api(path, opt){
      const res = await fetch(path, Object.assign({
        headers: Object.assign(
          {'Content-Type':'application/json'},
          this.token ? {Authorization:'Bearer '+this.token} : {}
        )
      }, opt || {}));
      if (res.status === 401){ this.token=''; localStorage.removeItem('elder_token'); return null; }
      const text = await res.text();
      let data = null;
      try { data = text ? JSON.parse(text) : null; } catch(e){ data = text; }
      if (!res.ok){ throw new Error(this.errText(data, res.status)); }
      return data;
    },
    // 把后端的 detail 变成**人能读的一句话**。
    //
    // ⚠️ 为什么必须处理"detail 不是字符串"的三种形态（这三种在本仓都真实存在）：
    //   ① detail 是字符串 —— 我们自己抛的 403/400/404（绝大多数）；
    //   ② detail 是**数组** —— FastAPI 的 422 请求体校验失败，固定结构
    //      `[{loc:[...], msg, type}, ...]`。直接 new Error(array) 会得到
    //      一串毫无意义的字符串拼接，运营完全看不懂自己提交错了什么；
    //   ③ detail 是对象 —— 历史上存在过的形态（如 archive 的引用清单）。
    // 直接 `data.detail || ...` 只处理了第 ① 种，另两种都会渲染成
    // [object Object] —— 那等于"报错信息等于没有"。
    errText(data, status){
      const d = data && data.detail;
      if (typeof d === 'string' && d) return d;
      if (Array.isArray(d)){
        return d.map(it => {
          const loc = Array.isArray(it && it.loc) ? it.loc.join('.') : '';
          return (loc ? loc + '：' : '') + ((it && it.msg) || JSON.stringify(it));
        }).join('；');
      }
      if (d && typeof d === 'object'){
        try { return JSON.stringify(d); } catch(e){ /* 落到下面 */ }
      }
      return 'HTTP ' + status;
    },
    async doLogin(){
      this.busy = true; this.err = '';
      try{
        const r = await fetch('/api/auth/login', {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify(this.loginForm)
        });
        const d = await r.json();
        if (!r.ok) throw new Error(d.detail || '登录失败');
        this.token = d.access_token;
        this.user = {username:d.username, id:d.user_id, is_admin:d.is_admin};
        localStorage.setItem('elder_token', this.token);
        localStorage.setItem('elder_user', JSON.stringify(this.user));
        await this.loadAll();
      }catch(e){ this.err = e.message; }
      finally{ this.busy = false; }
    },
    logout(){ this.token=''; localStorage.removeItem('elder_token'); },
    async loadAll(){
      await Promise.all([this.loadDevices(), this.loadAvatars(), this.loadProviders()]);
      if (this.curDeviceId) await this.loadReminders();
    },
    // 人格预设页的数据**按需加载**（不进loadAll）：
    // 全平台只有管理员能进这一页，而 loadAll 是登录后必跑的，
    // 非管理员每次登录都白拉一次 403 只会污染全局 err 条。
    async loadPersonas(){
      this.err = '';
      await this.loadPresetMeta();
      await this.loadPresets();
    },
    async loadDevices(){
      const r = await this.api('/api/devices'); if(!r) return;
      this.devices = r;
      if (!this.curDeviceId && r.length) this.curDeviceId = r[0].id;
    },
    async loadAvatars(){ const r = await this.api('/api/avatars'); if(r) this.avatars = r; },
    async loadProviders(){ const r = await this.api('/api/providers'); if(r) this.providers = r; },
    async loadReminders(){
      if (!this.curDeviceId) return;
      const r = await this.api('/api/reminders?device_pk='+this.curDeviceId);
      if (r) this.reminders = r;
      const e = await this.api('/api/devices/'+this.curDeviceId+'/events?limit=50');
      if (e) this.events = e;
      const s = await this.api('/api/stats/overview?device_pk='+this.curDeviceId);
      this.stat = s;
    },

    // -------- 设备 --------
    async createDevice(){
      try{
        await this.api('/api/devices', {method:'POST', body:JSON.stringify(this.devForm)});
        this.devForm = {device_id:'', name:'我的陪伴助手'};
        await this.loadDevices();
      }catch(e){ this.err = e.message; }
    },
    async genCode(d){
      try{
        this.codeBox = await this.api('/api/devices/'+d.id+'/code', {method:'POST'});
      }catch(e){ this.err = e.message; }
    },
    async applyAvatar(d, ev){
      const v = ev.target.value;
      try{
        if (v) await this.api('/api/avatars/'+v+'/apply/'+d.id, {method:'POST'});
        else await this.api('/api/devices/'+d.id, {method:'PATCH', body:JSON.stringify({avatar_id:0})});
        await this.loadDevices();
      }catch(e){ this.err = e.message; }
    },
    async removeDevice(d){
      if (!confirm('删除设备「'+d.name+'」及其全部提醒？')) return;
      await this.api('/api/devices/'+d.id, {method:'DELETE'});
      await this.loadDevices();
    },
    openReminders(d){ this.curDeviceId = d.id; this.tab='reminders'; this.loadReminders(); },
    openStats(d){ this.curDeviceId = d.id; this.tab='stats'; this.loadReminders(); },
    copy(t){ navigator.clipboard && navigator.clipboard.writeText(t); },

    // -------- 提醒 --------
    blankReminder(){
      return { title:'', speak_text:'', rtype:0, schedule_kind:1,
        times_of_day:['08:00'], weekdays:[], month_days:[], interval_days:1,
        once_date:null, start_date:null, end_date:null, dose:'',
        require_confirm:true, repeat_interval_min:10, repeat_times:3,
        escalate_after_min:30, confirm_methods:['voice','button'], enabled:true };
    },
    editReminder(r){
      this.rForm = r ? JSON.parse(JSON.stringify(r)) : this.blankReminder();
      this.timesText = (this.rForm.times_of_day||[]).join(', ');
      this.weekText = (this.rForm.weekdays||[]).join(',');
      this.monthText = (this.rForm.month_days||[]).join(',');
      this.rBox = true;
    },
    async saveReminder(){
      this.rForm.times_of_day = this.timesText.split(/[,，\s]+/).filter(Boolean);
      this.rForm.weekdays = this.weekText.split(/[,，\s]+/).filter(Boolean).map(Number);
      this.rForm.month_days = this.monthText.split(/[,，\s]+/).filter(Boolean).map(Number);
      const body = JSON.parse(JSON.stringify(this.rForm));
      delete body.id; delete body.device_id; delete body.creator_id;
      delete body.created_at; delete body.updated_at; delete body.next_fire_at;
      try{
        if (this.rForm.id){
          await this.api('/api/reminders/'+this.rForm.id, {method:'PATCH', body:JSON.stringify(body)});
        }else{
          await this.api('/api/reminders?device_pk='+this.curDeviceId, {method:'POST', body:JSON.stringify(body)});
        }
        this.rBox = false; await this.loadReminders();
      }catch(e){ this.err = e.message; }
    },
    async toggleReminder(r){
      await this.api('/api/reminders/'+r.id+'/toggle', {method:'POST'});
      await this.loadReminders();
    },
    async removeReminder(r){
      if (!confirm('删除提醒「'+r.title+'」？')) return;
      await this.api('/api/reminders/'+r.id, {method:'DELETE'});
      await this.loadReminders();
    },

    // -------- 形象 --------
    blankAvatar(){
      return { name:'', description:'', eaf_pack_name:'', eaf_pack_url:'', eaf_pack_sha256:'',
        screen_width:320, screen_height:240, clips:{}, system_prompt:'', tts_voice:'',
        emotion_lights:{}, enabled:true };
    },
    editAvatar(a){
      this.aForm = a ? JSON.parse(JSON.stringify(a)) : this.blankAvatar();
      this.clipsText = JSON.stringify(this.aForm.clips||{}, null, 2);
      this.lightsText = JSON.stringify(this.aForm.emotion_lights||{}, null, 2);
      this.aBox = true;
    },
    async saveAvatar(){
      try{
        this.aForm.clips = this.clipsText.trim() ? JSON.parse(this.clipsText) : {};
        this.aForm.emotion_lights = this.lightsText.trim() ? JSON.parse(this.lightsText) : {};
      }catch(e){ this.err = 'JSON 格式错误：'+e.message; return; }
      const body = JSON.parse(JSON.stringify(this.aForm));
      delete body.id; delete body.created_at;
      try{
        if (this.aForm.id) await this.api('/api/avatars/'+this.aForm.id, {method:'PATCH', body:JSON.stringify(body)});
        else await this.api('/api/avatars', {method:'POST', body:JSON.stringify(body)});
        this.aBox = false; await this.loadAvatars();
      }catch(e){ this.err = e.message; }
    },
    async removeAvatar(a){
      if (!confirm('删除形象「'+a.name+'」？')) return;
      await this.api('/api/avatars/'+a.id, {method:'DELETE'});
      await this.loadAvatars();
    },

    // -------- AI --------
    blankProvider(){
      return { name:'', kind:'llm_main', provider:'deepseek', endpoint:'', api_key:'',
        model:'', api_style:'', supports_stream:false, timeout_sec:30, max_retries:1,
        context_window:0, params:{}, priority:10, enabled:true };
    },
    // 「测试连接」与「解析用途」：调到新增的两个网关端点上
    async testModel(){
      this.testResult = null;
      const usageMap = {llm:'chat', llm_light:'light', embedding:'embed', rerank:'rerank'};
      const usage = this.testUsage || usageMap[this.pForm.kind] || 'chat';
      const d = await this.api('/api/providers/test',
        {method:'POST', body:JSON.stringify({usage, messages:[{role:'user',content:'你好，请用一句话介绍自己'}]})});
      if (d) this.testResult = d;
    },
    async resolveUsage(){
      this.testResult = null;
      const d = await this.api('/api/providers/resolve?usage='+(this.testUsage||'chat'));
      if (d) this.testResult = {ok:true, model:d.name+' → '+d.kind+'/'+d.model+'（'+(d.fallback?'兜底命中':'首选')+'）',
        attempts:[{name:d.name, kind:d.kind, ok:true}], elapsed_ms:d.timeout_sec*1000};
    },
    editProvider(p){
      this.pForm = p ? JSON.parse(JSON.stringify(p)) : this.blankProvider();
      this.paramsText = JSON.stringify(this.pForm.params||{}, null, 2);
      this.testResult = null;
      this.pBox = true;
    },
    async saveProvider(){
      try{ this.pForm.params = this.paramsText.trim() ? JSON.parse(this.paramsText) : {}; }
      catch(e){ this.err = 'JSON 格式错误：'+e.message; return; }
      const body = JSON.parse(JSON.stringify(this.pForm));
      delete body.id; delete body.created_at;
      try{
        if (this.pForm.id) await this.api('/api/providers/'+this.pForm.id, {method:'PATCH', body:JSON.stringify(body)});
        else await this.api('/api/providers', {method:'POST', body:JSON.stringify(body)});
        this.pBox = false; await this.loadProviders();
      }catch(e){ this.err = e.message; }
    },
    async removeProvider(p){
      if (!confirm('删除配置「'+p.name+'」？')) return;
      await this.api('/api/providers/'+p.id, {method:'DELETE'});
      await this.loadProviders();
    },
    async exportXiaozhi(){
      const d = await this.api('/api/providers/export/xiaozhi');
      if (d) { console.log(d); alert('已导出到浏览器控制台，可复制到小智 config.yaml 的 selected_module 下'); }
    },

    // -------- token 用量（全平台，仅管理员）--------
    // 与管理端 /api/admin/usage 约定：summary 给聚合（calls/tokens/by_usage/by_day），
    // rows 给最近流水。接口未上线时错误条友好提示，页面不白屏。
    async loadUsage(){
      this.err = '';
      try{
        const q = this.usageFilter ? '?usage=' + encodeURIComponent(this.usageFilter) : '';
        const [s, rows] = await Promise.all([
          this.api('/api/admin/usage/summary' + q),
          this.api('/api/admin/usage/rows?limit=50' + (this.usageFilter ? '&usage=' + encodeURIComponent(this.usageFilter) : ''))
        ]);
        this.usageSummary = s;
        this.usageRows = rows || [];
      }catch(e){ this.err = '用量统计加载失败：' + e.message; }
    },
    usageName(u){
      return {chat:'对话', light:'轻任务', embed:'向量化', rerank:'重排'}[u] || u || '—';
    },

    // -------- 人格预设运营后台 --------
    // ⚠️⚠️ **number 型档位提交的是「档位上界」，原样回传 options[].value**
    // ------------------------------------------------------------------
    // `meta` 下发的 number 型 options[].value 就是 catalog 里 bands 的 **upper**
    // （如 0.3/0.6/1.0），前端**不得**改成交"档位下界"。
    // 两者与 `to_prompt_sentence` 的 `val <= upper` 取第一个档恰好自洽：
    // 选"偶尔"提交 0.6 → 0.6 <= 0.6 命中第二档 → 渲染出"偶尔可以开个小玩笑"。
    // 若换成下界，同一份 traits 会渲染成**另一句话**，而值域校验仍然通过、
    // **没有任何断言会红**（设计边界 W13）——所以这条钉在这里。
    //
    // ⚠️ 为什么**一律不提供 0-1 浮点输入框**：档位值域是产品语义，不是数值语义。
    // 运营看到"0.6"无法判断它意味着什么，而 `options[].label`（"偶尔"）+
    // 下方灰字的行为描述才是他能据此做决定的东西。给输入框 = 把这个决定
    // 推回给"谁也不知道 0.6 是多大"的运营。
    isBandOn(spec, value){
      const cur = this.pEdit ? this.pEdit.traits[spec.name] : undefined;
      return String(cur) === String(value);
    },
    setBand(spec, value){
      if(!this.pEdit) return;
      // 原样回传，绝不四舍五入到别的档（见上方 W13 说明）
      this.pEdit.traits[spec.name] = value;
    },
    // 当前档位的行为描述。**取不到就明说取不到**，不静默显示空白 ——
    // 空白会被读成"这一维没有行为描述"，而真实原因是"当前值不在任何档位里"。
    bandEffect(spec, value){
      const hit = (spec.options||[]).filter(o => String(o.value) === String(value))[0];
      if(!hit) return '⚠️ 当前值 ' + String(value) +
        ' 不在任何档位里（出厂值可能落在档位之间），保存前请选一个档位。';
      return hit.effect || hit.label;
    },
    traitLabel(name, value){
      const spec = (this.presetMeta.trait_specs||[]).filter(s => s.name === name)[0];
      if(!spec) return String(value);
      const hit = (spec.options||[]).filter(o => String(o.value) === String(value))[0];
      return hit ? hit.label : String(value);
    },
    dirtyName(f){
      return {system_prompt:'人格提示词', traits:'性格 10 维', tts_voice:'音色'}[f] || f;
    },
    actionName(a){ return {update:'修改', reset:'恢复默认', archive:'下架'}[a] || a; },
    diffName(f){
      if(f.indexOf('traits.') === 0){
        const spec = (this.presetMeta.trait_specs||[])
          .filter(s => s.name === f.slice(7))[0];
        return (spec ? spec.label : f.slice(7));
      }
      return {system_prompt:'人格提示词', tts_voice:'音色', name:'名称',
              description:'简介', soft_guardrails:'家属额外要求',
              archived_at:'下架时间'}[f] || f;
    },
    prettyDiff(a){
      const d = a.diff || {};
      return Object.keys(d).map(k => {
        const it = d[k] || {};
        return '· ' + this.diffName(k) + '\n    原：' + JSON.stringify(it.from) +
               '\n    新：' + JSON.stringify(it.to);
      }).join('\n') || '（无明细）';
    },
    async loadPresetMeta(){
      const r = await this.api('/api/admin/presets/meta');
      if(r) this.presetMeta = r;
    },
    async loadPresets(){
      const r = await this.api('/api/admin/presets');
      if(r) this.presets = r.presets || [];
    },
    openPreset(p){
      // 深拷贝：直接改列表项会让"取消"也生效（Vue 响应式对象被就地改写）
      this.pEdit = JSON.parse(JSON.stringify(p));
      this.pEdit.traits = this.pEdit.traits || {};
      this.pEdit.guardrails_soft = this.pEdit.guardrails_soft || [];
      this.pEditBox = true;
    },
    closePreset(){ this.pEditBox = false; this.pEdit = null; },
    toggleSoft(id, on){
      const list = this.pEdit.guardrails_soft;
      const i = list.indexOf(id);
      if(on && i < 0) list.push(id);
      if(!on && i >= 0) list.splice(i, 1);
    },
    // 软约束走**独立端点**：整体覆写会让"忘带这个字段 = 全部清空"成为可能，
    // 而且它需要独立的审计条目（见 admin_presets.py 的模块注释）。
    async persistSoft(){
      const remote = this.presets.filter(p => p.id === this.pEdit.id)[0];
      const remoteSoft = (remote && remote.guardrails_soft) || [];
      const mine = this.pEdit.guardrails_soft || [];
      const added = mine.filter(x => remoteSoft.indexOf(x) < 0);
      const removed = remoteSoft.filter(x => mine.indexOf(x) < 0);
      for(const id of added){
        await this.api('/api/admin/presets/'+this.pEdit.id+'/soft-guardrails',
          {method:'POST', body:JSON.stringify({guardrail_id:id, enabled:true})});
      }
      for(const id of removed){
        await this.api('/api/admin/presets/'+this.pEdit.id+'/soft-guardrails',
          {method:'POST', body:JSON.stringify({guardrail_id:id, enabled:false})});
      }
    },
    async previewPreset(){
      try{
        const r = await this.api('/api/admin/presets/'+this.pEdit.id+'/preview', {
          method:'POST',
          body: JSON.stringify({name:this.pEdit.name, description:this.pEdit.description,
                                system_prompt:this.pEdit.system_prompt,
                                tts_voice:this.pEdit.tts_voice, traits:this.pEdit.traits})
        });
        if(r) this.pPreview = r;
      }catch(e){ this.err = e.message; }
    },
    async savePreset(){
      const n = this.pEdit.bound_device_count || 0;
      // 保存是"影响他人但可秒回滚"→ 只在N>0 时确认（N=0 时确认框是纯噪音，
      // 而噪音确认框会训练运营闭眼点确定，那才是真风险）。
      if(n > 0 &&
         !confirm('保存后立即对 ' + n + ' 台设备生效，确定？')) return;
      this.presetBusy = true; this.err = '';
      try{
        await this.api('/api/admin/presets/'+this.pEdit.id, {
          method:'PATCH',
          body: JSON.stringify({name:this.pEdit.name, description:this.pEdit.description,
                                system_prompt:this.pEdit.system_prompt,
                                tts_voice:this.pEdit.tts_voice, traits:this.pEdit.traits})
        });
        await this.persistSoft();
        this.pEditBox = false; this.pEdit = null;
        await this.loadPresets();
      }catch(e){ this.err = e.message; }
      finally{ this.presetBusy = false; }
    },
    async resetPreset(p){
      // 无条件二次确认：恢复出厂是**破坏性写入**，把运营之前的全部调整抹掉。
      if(!confirm('将把「人格提示词 / 性格 10 维 / 音色」恢复为出厂默认。\n' +
                  '已经派生出去的角色是独立副本，不会跟着变。\n确定恢复？')) return;
      try{
        await this.api('/api/admin/presets/'+p.id+'/reset', {method:'POST', body:'{}'});
        await this.loadPresets();
      }catch(e){ this.err = e.message; }
    },
    async archivePreset(p){
      // 无条件二次确认：下架是结构性变化（预设不再出现在用户可选列表里）。
      if(!confirm('下架后该预设不再出现在用户的可选列表里。\n确定下架？')) return;
      try{
        await this.api('/api/roles/'+p.id+'/archive', {method:'POST', body:'{}'});
        await this.loadPresets();
      }catch(e){ this.err = e.message; }
    },
    async openAudits(p){
      this.auditBox = {id:p.id, name:p.name};
      this.showDiff = {};
      const r = await this.api('/api/admin/presets/'+p.id+'/audits?limit=50');
      this.audits = r || [];
    },

    // -------- 展示辅助 --------
    fmt(v){
      if (!v) return '—';
      const d = new Date(v);
      if (isNaN(d.getTime())) return v;
      const p = n => String(n).padStart(2,'0');
      return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes());
    },
    barHeight(n){
      const max = Math.max(1, ...(this.stat ? this.stat.series.map(s=>s.total) : [1]));
      return Math.round(8 + (n / max) * 100);
    },
    typeName(t){ return ['服药','日程','喝水','运动','自定义'][t] || '自定义'; },
    kindName(r){
      const k = r.schedule_kind;
      if (k===0) return '一次 '+ (r.once_date||'');
      if (k===1) return '每天';
      if (k===2) return '每周 ' + (r.weekdays||[]).map(w=>'一二三四五六日'[w-1]).join('');
      if (k===3) return '每月 ' + (r.month_days||[]).join('、') + ' 号';
      if (k===4) return '每 ' + r.interval_days + ' 天';
      return '—';
    },
    stateName(s){ return ['待触发','已响铃','已确认','超时未确认','已跳过'][s] || '—'; },
    stateClass(s){ return s===2?'ok':(s===3?'bad':(s===1?'warn':'')); },
    methodName(m){ return ['—','语音','按键','手机端','自动'][m] || '—'; }
  },
  watch:{
    curDeviceId(){ this.loadReminders(); },
    tab(t){
      // 进入人格预设页时才拉数据（理由见 loadPersonas 的注释）
      if(t === 'personas'){
        this.loadPersonas().catch(e => { this.err = e.message; });
      }
      if(t === 'usage'){
        this.loadUsage();
      }
    }
  },
  async mounted(){
    if (!this.token) return;
    // token 在但 user 对象不在（如只清了一半 localStorage）：先补身份再决定渲染哪套界面
    if (!this.user || !this.user.id){
      try{
        const me = await this.api('/api/auth/me');
        if (me){
          this.user = {username:me.username, id:me.id, is_admin:me.is_admin};
          localStorage.setItem('elder_user', JSON.stringify(this.user));
        }
      }catch(e){ this.err = e.message; }
    }
    // 非管理员不拉任何管理数据（loadProviders 等会 403，红条只会吓到人）；
    // 他们的界面在 /user，这里只显示横幅。
    if (this.isAdmin) this.loadAll().catch(e => { this.err = e.message; });
  }
}).mount('#app');
</script>
</body>
</html>
