    // -------- 账号安全（修改密码）--------
    // 后端端点已存在（routers/auth.py change_password），这里只补管理后台入口：
    // /user 端有一处，但没有入口的管理员根本不会想到去那边找。
    openPassword(){
      this.pwBox = true; this.pwErr = ''; this.pwMsg = '';
      this.pwForm = {old_password:'', new_password:'', new_password2:''};
    },
    async changePassword(){
      const f = this.pwForm;
      this.pwErr = ''; this.pwMsg = '';
      if (!f.old_password){ this.pwErr = '请填写当前密码'; return; }
      if ((f.new_password||'').length < 6){ this.pwErr = '新密码至少 6 位'; return; }
      if (f.new_password !== f.new_password2){ this.pwErr = '两次输入的新密码不一致'; return; }
      if (f.new_password === f.old_password){ this.pwErr = '新密码不能与当前密码相同'; return; }
      this.pwBusy = true;
      try{
        // 原密码错误后端返400（不是 401），避免被 api() 当成登录态失效而清token
        await this.api('/api/auth/password', {
          method:'POST',
          body: JSON.stringify({old_password:f.old_password, new_password:f.new_password})
        });
        this.pwForm = {old_password:'', new_password:'', new_password2:''};
        this.pwMsg = '密码已修改，下次登录请使用新密码。';
      }catch(e){ this.pwErr = e.message; }
      finally{ this.pwBusy = false; }
    },

    // -------- 邮件配置（SMTP）--------
    // 字段与校验规则一律以 schemas.SmtpConfigIn / SmtpConfigOut 为准，不在前端另立一套。
    async loadSmtp(){
      this.smtpErr = ''; this.smtpMsg = '';
      try{
        const r = await this.api('/api/admin/mail/smtp');
        if (!r) return;                // 401：api() 已清登录态
        this.smtp = r;
        // ★ 关键：password 用服务端给的掩码只做展示，**绝不回填进输入框**。
        //   回填的话，管理员不改密码直接点保存，就会把 "ab******gh" 当成密码存回去，
        //   之后所有邮件全部鉴权失败 —— 而界面上看不出任何异常。
        this.smtpForm = {
          host: r.host || '', port: r.port || 465, username: r.username || '',
          password: '', use_tls: !!r.use_tls, use_ssl: !!r.use_ssl,
          from_addr: r.from_addr || '', from_name: r.from_name || '',
          notify_to: r.notify_to || '', enabled: !!r.enabled
        };
        this.smtpLoaded = true;
      }catch(e){ this.smtpErr = 'SMTP 配置加载失败：' + e.message; }
    },
    async saveSmtp(){
      const f = this.smtpForm;
      this.smtpErr = ''; this.smtpMsg = '';
      if (!f) return;
      const host = (f.host||'').trim();
      const fromAddr = (f.from_addr||'').trim();
      const notifyTo = (f.notify_to||'').trim();
      const pw = f.password||'';
      // 端口/邮箱格式后端也会拦（422），这里先拦一遍是为了给出定位更准的提示，
      // 而不是把 Pydantic 的英文 msg 直接甩给运维。
      const port = Number(f.port);
      if (!host){ this.smtpErr = '请填写 SMTP 服务器地址'; return; }
      if (!Number.isInteger(port) || port < 1 || port > 65535){
        this.smtpErr = '端口应是 1~65535 之间的整数'; return;
      }
      const addrRe = /^[^@\s]+@[^@\s]+\.[^@\s]+$/;
      if (fromAddr && !addrRe.test(fromAddr)){
        this.smtpErr = '发件邮箱格式不正确'; return;
      }
      if (notifyTo && !addrRe.test(notifyTo)){
        this.smtpErr = '通知收件人格式不正确'; return;
      }
      // 端口与加密方式不配套是最常见的配错：465 配 STARTTLS、587 配 SSL，
      // 服务端都能连上但握手失败，而报错发生在发信时、离配置动作很久远了。
      // ⚠️ 四种错配都要拦，别只拦「两个都没勾」：465 只勾 STARTTLS（把 STARTTLS
      // 打在已经隐式 SSL 的465 上）与 587 只勾 SSL 同属错配，只是形式不同。
      if (port === 465 && !f.use_ssl){
        this.smtpErr = '端口 465 是直连 SSL，请勾选「使用 SSL」而不是 STARTTLS'; return;
      }
      if (port === 587 && !f.use_tls){
        this.smtpErr = '端口 587 是握手升级，请勾选「使用 STARTTLS」而不是 SSL'; return;
      }
      const body = {
        host, port, username:(f.username||'').trim(),
        use_tls: !!f.use_tls, use_ssl: !!f.use_ssl,
        from_addr: fromAddr, from_name:(f.from_name||'').trim(),
        notify_to: notifyTo, enabled: !!f.enabled
      };
      // ★ password 是**只写**字段：留空就**不传这个键**（而不是传空串）。
      //   传空串是一个有效值，会把已存的密码清掉。
      if (pw) body.password = pw;
      this.smtpBusy = true;
      try{
        await this.api('/api/admin/mail/smtp', {method:'PATCH', body: JSON.stringify(body)});
        // 先用服务端返回刷新（loadSmtp 开头会清空 smtpMsg），再置成功提示 ——
        // 顺序反了的话这句提示会被自己清掉，保存成功却什么都不显示。
        await this.loadSmtp();
        this.smtpMsg = pw ? '配置已保存（密码已更新）' : '配置已保存';
        this.mailTestResult = null;     // 配置变了，之前的测试结论作废
      }catch(e){ this.smtpErr = '保存失败：' + e.message; }
      finally{ this.smtpBusy = false; }
    },
    async sendTestMail(){
      this.mailTestResult = null; this.smtpErr = ''; this.smtpMsg = '';
      const to = (this.testTo||'').trim();
      if (to && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(to)){
        this.smtpErr = '收件邮箱格式不正确'; return;
      }
      this.testBusy = true;
      try{
        // POST /api/admin/mail/test：后端始终返 200，成败看 ok/error，
        // 所以这里不能靠抛异常判断失败，必须把结果整个渲染出来。
        this.mailTestResult = await this.api('/api/admin/mail/test', {
          method:'POST', body: JSON.stringify({to: to})
        });
      }catch(e){ this.mailTestResult = {ok:false, error:e.message, message:'请求失败：' + e.message}; }
      finally{ this.testBusy = false; }
    },


    // -------- 人格预设运营后台 --------
    // ⚠️⚠️ **number 型档位提交的是「档位上界」，原样回传 options[].value**
    // ------------------------------------------------------------------
    // `meta` 下发的 number 型 options[].value 就是 catalog 里 bands 的 **upper**
    // （如 0.3/0.6/1.0），前端**不得**改成交"档位下界"。
    // 两者与 `to_prompt_sentence` 的 `val <= upper` 取第一个档恰好自洽：
    // 选"偶尔"提交 0.6 → 0.6 <= 0.6 命中第二档 → 渲染出"偶尔可以开个小玩笑"。
    // 若换成下界，同一份 traits 会渲染成**另一句话**，而值域校验仍然通过、
    // **没有任何断言会红**（设计边界 W13）——所以这条钉在这里。
    //
    // ⚠️ 为什么**一律不提供 0-1 浮点输入框**：档位值域是产品语义，不是数值语义。
    // 运营看到"0.6"无法判断它意味着什么，而 `options[].label`（"偶尔"）+
    // 下方灰字的行为描述才是他能据此做决定的东西。给输入框 = 把这个决定
    // 推回给"谁也不知道 0.6 是多大"的运营。
    isBandOn(spec, value){
      const cur = this.pEdit ? this.pEdit.traits[spec.name] : undefined;
      return String(cur) === String(value);
    },
    setBand(spec, value){
      if(!this.pEdit) return;
      // 原样回传，绝不四舍五入到别的档（见上方 W13 说明）
      this.pEdit.traits[spec.name] = value;
    },
    // 当前档位的行为描述。**取不到就明说取不到**，不静默显示空白 ——
    // 空白会被读成"这一维没有行为描述"，而真实原因是"当前值不在任何档位里"。
    bandEffect(spec, value){
      const hit = (spec.options||[]).filter(o => String(o.value) === String(value))[0];
      if(!hit) return '⚠️ 当前值 ' + String(value) +
        ' 不在任何档位里（出厂值可能落在档位之间），保存前请选一个档位。';
      return hit.effect || hit.label;
    },
    traitLabel(name, value){
      const spec = (this.presetMeta.trait_specs||[]).filter(s => s.name === name)[0];
      if(!spec) return String(value);
      const hit = (spec.options||[]).filter(o => String(o.value) === String(value))[0];
      return hit ? hit.label : String(value);
    },
    dirtyName(f){
      return {system_prompt:'人格提示词', traits:'性格 10 维', tts_voice:'音色'}[f] || f;
    },
    actionName(a){ return {update:'修改', reset:'恢复默认', archive:'下架'}[a] || a; },
    diffName(f){
      if(f.indexOf('traits.') === 0){
        const spec = (this.presetMeta.trait_specs||[])
          .filter(s => s.name === f.slice(7))[0];
        return (spec ? spec.label : f.slice(7));
      }
      return {system_prompt:'人格提示词', tts_voice:'音色', name:'名称',
              description:'简介', soft_guardrails:'家属额外要求',
              archived_at:'下架时间'}[f] || f;
    },
    prettyDiff(a){
      const d = a.diff || {};
      return Object.keys(d).map(k => {
        const it = d[k] || {};
        return '· ' + this.diffName(k) + '\n    原：' + JSON.stringify(it.from) +
               '\n    新：' + JSON.stringify(it.to);
      }).join('\n') || '（无明细）';
    },
    async loadPresetMeta(){

    openNewPreset(){

    toggleSoft(id, on){
      const list = this.pEdit.guardrails_soft;
      const i = list.indexOf(id);
      if(on && i < 0) list.push(id);
      if(!on && i >= 0) list.splice(i, 1);
    },
    // 软约束走**独立端点**：整体覆写会让"忘带这个字段 = 全部清空"成为可能，
    // 而且它需要独立的审计条目（见 admin_presets.py 的模块注释）。
    async persistSoft(){
      const remote = this.presets.filter(p => p.id === this.pEdit.id)[0];
      const remoteSoft = (remote && remote.guardrails_soft) || [];
      const mine = this.pEdit.guardrails_soft || [];
      const added = mine.filter(x => remoteSoft.indexOf(x) < 0);
      const removed = remoteSoft.filter(x => mine.indexOf(x) < 0);
      for(const id of added){
        await this.api('/api/admin/presets/'+this.pEdit.id+'/soft-guardrails',
          {method:'POST', body:JSON.stringify({guardrail_id:id, enabled:true})});
      }
      for(const id of removed){

          {method:'POST', body:JSON.stringify({guardrail_id:id, enabled:false})});
      }

    async previewPreset(){

      if (!this.pEdit || this.pEdit.isNew || !this.pEdit.id) return;
      try{
        const r = await this.api('/api/admin/presets/'+this.pEdit.id+'/preview', {
          method:'POST',
          body: JSON.stringify({name:this.pEdit.name, description:this.pEdit.description,
                                system_prompt:this.pEdit.system_prompt,
                                tts_voice:this.pEdit.tts_voice, traits:this.pEdit.traits})
        });

    },
    async savePreset(){
      const isNew = !!this.pEdit.isNew;
      const n = this.pEdit.bound_device_count || 0;
      // 保存是"影响他人但可秒回滚"→ 只在N>0 时确认（N=0 时确认框是纯噪音，
      // 而噪音确认框会训练运营闭眼点确定，那才是真风险）。
      if(n > 0 &&
         !confirm('保存后立即对 ' + n + ' 台设备生效，确定？')) return;
      // 与 saveAvatar 同一套收敛：__custom__ 是前端占位符，绝不能进库
      if (this.pEdit.tts_voice === '__custom__' && !(this.pEdit.tts_voice_custom||'').trim()){
        this.err = '音色选了「其他」但没填音色名。请填写，或改选一个预置音色。';
        return;
      }
      if (!(this.pEdit.name||'').trim()){
        this.err = '请填写预设名称 —— 它是家属在 APP 里看到的那一行。';
        return;
      }
      const voice = this.resolveVoice(this.pEdit.tts_voice, this.pEdit.tts_voice_custom);
      this.presetBusy = true; this.err = '';
      try{
        if (isNew){
          // 新建（2026-10-19 用户报「无法新增多个人格预设」）。
          // ⚠️ 只提交这 5 个字段：归属类字段（record_type/owner_id/parent_id/kind）
          // 服务端 schema 用 extra="forbid" 一律拒（422），前端**连传的入口都不给** ——
          // 创建入口不该有能力决定"这行归谁"，那是 P0 安全边界。
          const r = await this.api('/api/admin/presets', {
            method:'POST',
            body: JSON.stringify({
              name: this.pEdit.name.trim(),
              description: this.pEdit.description || '',
              system_prompt: this.pEdit.system_prompt || '',
              tts_voice: voice,
              traits: this.pEdit.traits || {}
            })
          });
          // api() 在 401 时返回 null（已被登出），此时什么都不该继续做
          if(!r) return;
          // 关键：把新 id 写回 pEdit，下面的 persistSoft 才能对着它逐项勾软约束
          this.pEdit.id = r.id;
          this.pEdit.isNew = false;
        }
        else {
          await this.api('/api/admin/presets/'+this.pEdit.id, {
            method:'PATCH',
            body: JSON.stringify({name:this.pEdit.name, description:this.pEdit.description,
                                  system_prompt:this.pEdit.system_prompt,
                                  tts_voice:voice, traits:this.pEdit.traits})
          });
        }
        await this.persistSoft();
        this.pEditBox = false; this.pEdit = null;
        await this.loadPresets();
      }catch(e){ this.err = e.message; }
      finally{ this.presetBusy = false; }
    },
    async resetPreset(p){
      // 无条件二次确认：恢复出厂是**破坏性写入**，把运营之前的全部调整抹掉。
      if(!confirm('将把「人格提示词 / 性格 10 维 / 音色」恢复为出厂默认。\n' +
                  '已经派生出去的角色是独立副本，不会跟着变。\n确定恢复？')) return;
      try{
        await this.api('/api/admin/presets/'+p.id+'/reset', {method:'POST', body:'{}'});
        await this.loadPresets();
      }catch(e){ this.err = e.message; }
    },
    async archivePreset(p){
      // 无条件二次确认：下架是结构性变化（预设不再出现在用户可选列表里）。
      if(!confirm('下架后该预设不再出现在用户的可选列表里。\n确定下架？')) return;
      try{
        await this.api('/api/roles/'+p.id+'/archive', {method:'POST', body:'{}'});
        await this.loadPresets();
      }catch(e){ this.err = e.message; }
    },
    async openAudits(p){
      this.auditBox = {id:p.id, name:p.name};
      this.showDiff = {};
      const r = await this.api('/api/admin/presets/'+p.id+'/audits?limit=50');
      this.audits = r || [];
    },

    // -------- 展示辅助 --------
    fmt(v){
      if (!v) return '—';
      const d = new Date(v);
      if (isNaN(d.getTime())) return v;
      const p = n => String(n).padStart(2,'0');
      return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes());
    },
    barHeight(n){
      const max = Math.max(1, ...(this.stat ? this.stat.series.map(s=>s.total) : [1]));
      return Math.round(8 + (n / max) * 100);
    },
    typeName(t){ return ['服药','日程','喝水','运动','自定义'][t] || '自定义'; },
    kindName(r){
      const k = r.schedule_kind;
      if (k===0) return '一次 '+ (r.once_date||'');
      if (k===1) return '每天';
      if (k===2) return '每周 ' + (r.weekdays||[]).map(w=>'一二三四五六日'[w-1]).join('');
      if (k===3) return '每月 ' + (r.month_days||[]).join('、') + ' 号';
      if (k===4) return '每 ' + r.interval_days + ' 天';
      return '—';
    },
    stateName(s){ return ['待触发','已响铃','已确认','超时未确认','已跳过'][s] || '—'; },
    stateClass(s){ return s===2?'ok':(s===3?'bad':(s===1?'warn':'')); },
    methodName(m){ return ['—','语音','按键','手机端','自动'][m] || '—'; }
  },
  watch:{
    curDeviceId(){ this.loadReminders(); },
    // 表单一改就把上一次的报错清掉：报错停在原地会让人以为「我明明已经改对了，
    // 它还说不对」，于是反复点保存。错误提示应当描述的是**上一次提交**的那个状态。
    smtpForm: {
      deep: true,
      handler(){ if (this.smtpErr) this.smtpErr = ''; }
    },
    tab(t){
      // 进入人格预设页时才拉数据（理由见 loadPersonas 的注释）
      if(t === 'personas'){
        this.loadPersonas().catch(e => { this.err = e.message; });
      }
      if(t === 'usage'){
        this.loadUsage();
      }
      // 提醒页：设备筛选项来自 devices，进页面时数据可能已过期
      //（比如管理员刚从工单里知道了新的设备名）。按需拉，不进 loadAll 的理由
      // 与 personas 一致：loadAll 是登录后必跑的。
      if(t === 'reminders'){
        this.loadReminders();
      }
      // 就绪度按需拉：它是**当前配置的直接函数**，进页面就拉会与
      // loadProviders() 争一次数据库，且管理员在别处改完配置再回来时反而是旧的。
      if(t === 'providers'){
        this.loadReadiness();
        this.loadVoiceCatalog();
      }
      // 邮件配置按需拉：SMTP 密码是只写字段、GET 只给掩码，每次进页面重拉
      // 既没新信息，又会把管理员正在输入的内容冲掉。
      if(t === 'mail'){
        this.loadSmtp();
      }
    }
  },
  async mounted(){
    if (!this.token) return;
    // token 在但 user 对象不在（如只清了一半 localStorage）：先补身份再决定渲染哪套界面
    if (!this.user || !this.user.id){
      try{
        const me = await this.api('/api/auth/me');
        if (me){
          this.user = {username:me.username, id:me.id, is_admin:me.is_admin};
          localStorage.setItem('elder_user', JSON.stringify(this.user));
        }
      }catch(e){ this.err = e.message; }
    }
    // 非管理员不拉任何管理数据（loadProviders 等会 403，红条只会吓到人）；
    // 他们的界面在 /user，这里只显示横幅。
    if (this.isAdmin) this.loadAll().catch(e => { this.err = e.message; });
  }
}).mount('#app');
</script>
</body>
</html>
