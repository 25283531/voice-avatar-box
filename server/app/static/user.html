<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>老人陪伴提醒助手 · 用户端</title>
<style>
  :root{
    --bg:#f5f7fa; --panel:#ffffff; --line:#e3e8ef; --text:#1f2937; --muted:#6b7280;
    --brand:#2563eb; --brand-soft:#eff6ff; --ok:#16a34a; --warn:#d97706; --bad:#dc2626;
    --radius:10px;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
       font:14px/1.6 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
  #app{max-width:1180px;margin:0 auto;padding:20px 16px 60px}
  h1{font-size:19px;margin:0}
  h2{font-size:16px;margin:0 0 12px}
  .muted{color:var(--muted)}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
        padding:16px;margin-bottom:14px}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .row>*{margin:0}
  header.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
  nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
  nav button{border:1px solid var(--line);background:var(--panel);border-radius:20px;
        padding:6px 16px;cursor:pointer;color:var(--text)}
  nav button.on{background:var(--brand);border-color:var(--brand);color:#fff}
  button{border:1px solid var(--line);background:var(--panel);border-radius:6px;
        padding:6px 12px;cursor:pointer;color:var(--text);font-size:13px}
  button.primary{background:var(--brand);border-color:var(--brand);color:#fff}
  button.danger{color:var(--bad);border-color:#f3c7c7}
  button:disabled{opacity:.5;cursor:not-allowed}
  input,select,textarea{border:1px solid var(--line);border-radius:6px;padding:6px 9px;
        font-size:13px;background:#fff;color:var(--text);font-family:inherit}
  textarea{width:100%;min-height:82px;resize:vertical}
  label{display:block;font-size:12px;color:var(--muted);margin-bottom:3px}
  .grid{display:grid;gap:10px}
  .g2{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g3{grid-template-columns:repeat(3,minmax(0,1fr))}
  .g4{grid-template-columns:repeat(4,minmax(0,1fr))}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
  th{color:var(--muted);font-weight:600;font-size:12px}
  /* 数字列右对齐（token 用量对账场景，位数对齐才可比） */
  th.num,td.num{text-align:right;font-variant-numeric:tabular-nums}
  code{background:#f1f5f9;padding:1px 5px;border-radius:4px;font-size:12px}
  .tag{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;
       background:var(--brand-soft);color:var(--brand)}
  .tag.ok{background:#e8f7ee;color:var(--ok)}
  .tag.bad{background:#fdeaea;color:var(--bad)}
  .tag.warn{background:#fdf3e3;color:var(--warn)}
  .kpi{background:var(--brand-soft);border-radius:var(--radius);padding:12px}
  .kpi .n{font-size:24px;font-weight:700;color:var(--brand);line-height:1.2}
  .kpi .l{font-size:12px;color:var(--muted)}
  .bars{display:flex;align-items:flex-end;gap:6px;height:120px;padding-top:8px}
  .bars .b{flex:1;background:var(--brand);border-radius:4px 4px 0 0;min-height:2px;position:relative}
  .bars .x{text-align:center;font-size:11px;color:var(--muted);margin-top:4px}
  .err{background:#fdeaea;color:var(--bad);padding:8px 12px;border-radius:6px;margin-bottom:10px}
  .mask{position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;
        align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto}
  .modal{background:#fff;border-radius:12px;padding:18px;width:100%;max-width:720px}
  .close{float:right;border:none;background:none;font-size:20px;cursor:pointer;color:var(--muted)}
  .empty{padding:20px;text-align:center;color:var(--muted)}
  /* ---- 角色性格档位按钮组（与 /api/roles/traits 下发的 options 一一对应）---- */
  .bands{display:flex;gap:6px;flex-wrap:wrap}
  .bands button{font-size:12px;padding:5px 11px}
  .bands button.on{background:var(--brand);border-color:var(--brand);color:#fff}
  .traitrow{display:grid;grid-template-columns:78px 1fr;gap:8px;align-items:start;
        padding:7px 0;border-bottom:1px dashed var(--line)}
  .traitrow .dim{font-size:13px;padding-top:5px}
  .traitrow .eff{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.5}
  @media(max-width:820px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
<body>
<div id="app">

  <!-- ============================ 登录 / 注册 ============================ -->
  <!-- 注册走 POST /api/auth/register（无鉴权）。页面以登录为主，底部一句
       「还没有账号？注册」切到注册态；注册成功后直接拿用户名密码调登录接口
       换取 token 进入主体，不让用户再输一遍。
       ⚠️ 服务端未来可能加「是否开放公开注册」的开关并返 403/404，
       这里统一翻译成一句人话，不做堆栈、不白屏。 -->
  <div v-if="!token" class="card" style="max-width:380px;margin:80px auto">
    <h2>{{regMode ? '注册新账号' : '登录用户端'}}</h2>
    <div v-if="err" class="err" id="lerr">{{err}}</div>

    <template v-if="!regMode">
      <label>用户名</label>
      <input id="lu" v-model="loginForm.username" style="width:100%;margin-bottom:10px" @keyup.enter="doLogin" />
      <label>密码</label>
      <input id="lp" v-model="loginForm.password" type="password" style="width:100%;margin-bottom:14px" @keyup.enter="doLogin" />
      <button id="lb" class="primary" style="width:100%" :disabled="busy" @click="doLogin">登 录</button>
      <div style="margin-top:12px;text-align:center">
        <a href="#" id="toReg" @click.prevent="switchReg(true)" style="font-size:13px">还没有账号？注册</a>
      </div>

      <!-- 「忘记用户名」求助块 —— 必须放在**登录卡内**，不能只放在登录后的主体里。
           理由：忘记用户名的人一定处于未登录态（登不进原账户 ⇒ token 为空），
           他打开的页面上只有这张登录卡。把求助信息写在登录后的主体里，
           等于对唯一需要它的人完全不可见 —— 而这是「设备被永久锁在原账户上」
           唯一的人工救命通道。
           邮箱沿用 supportEmail（来自 GET /api/support-contact，mounted 时
           无条件先取一次）；取不到（后端返回空串或请求失败）就退化成纯文字，
           **不显示 mailto、不报错、不白屏**。
           文案面向老人子女，不出现接口名/状态码等技术术语。 -->
      <div id="loginHelp" style="margin-top:14px;padding-top:12px;border-top:1px dashed var(--line)">
        <!-- 标题与登录后那张详细求助卡（#loginHelpFull）保持**逐字一致**：
             验收判据是在渲染后的可见 DOM 里断言这句话，若两处措辞不同，
             同一句断言在"未登录"和"已登录"两种状态下会一个通一个不通。 -->
        <div style="font-size:13px;font-weight:600;margin-bottom:4px">忘记用户名、解绑不了设备？</div>
        <p class="muted" style="font-size:12px;margin:0 0 6px">
          忘记用户名就没法登录，也就看不到自己家的设备。这种情况<b>只能请平台管理员帮忙解绑</b>。
          解绑是<b>立即生效</b>的：从这一刻起，<b>这台设备已经不属于任何账户</b>。
          如果您看到它<b>还在说话</b>，也不代表没解绑成功 —— 设备要等到下次重新连线才会被拒绝，
          所以请直接<b>把设备的电源拔掉、等几秒再插上</b>；设备重新启动并联网后稍等片刻，
          屏幕上才会出现新的激活码，再用新账号就能把设备加回来，原来的提醒和记录都还在。
          如果超过一分钟屏幕上还是什么都没有，<b>把电源再拔一次</b>就好。
          <!-- 为什么必须写「拔电源」这个动作：解绑后设备**不会自动重新出码**。
               取码循环拿到「服务端说已绑定」就 break（elder_bind_guide.cc:333-338），
               已绑定设备此后没有任何周期取码；CheckNewVersion() 只在开机调一次；
               WS 被拒也不会自动重启；Display::ShowNotification 是只打日志的空桩。
               所以家属站在设备旁边只会看到"它突然不吱声了、屏幕没变"。
               写「请重启设备」不够——老人家属不一定知道怎么重启，拔插头才是明确动作。 -->
        </p>
        <p class="muted" style="font-size:12px;margin:0 0 6px">
          <template v-if="supportEmail">
            给平台管理员发邮件：<a id="loginHelpMail" :href="'mailto:'+supportEmail">{{supportEmail}}</a>
          </template>
          <template v-else>
            请联系平台管理员（邮箱请向当初帮您装设备的家人或服务人员索取）。
          </template>
        </p>
        <!-- 要用户报什么：**不是**机身标签上那串硬件地址。
             管理员是按「账户 → 该账户下的设备 → 解绑」找的，不是按设备找账户；
             而那串硬件地址设备屏幕不显示（elder_bind_guide.cc:303 只上屏激活码）、
             标签上有没有印在仓库里也查无依据、管理后台的设备搜索框
             （index.html:227 的 devFilter）只认「名称 / 设备标识」、**不认激活码**。
             所以要求用户提供它 = 把求助门槛设在他够不到的地方，家属只能乱填或放弃。
             这一版改成三个他一定答得上的问题：原来的用户名/邮箱、他给设备起的名字、
             大概什么时候绑的。标签那一段必须写成条件句（「如果…也请」），
             不能写成「标签上有」—— 那是我们没做到的事，写成就等于承诺。 -->
        <p class="muted" style="font-size:12px;margin:0 0 4px">
          写信时请尽量写清三件事：① 您原来注册用的<b>用户名或邮箱</b>（记不全也没关系，把想得起来的部分写上就行）；
          ② 这台设备<b>叫什么名字</b>（就是您在家里的叫法，比如「客厅那台」）；③ 大概是什么时候绑定的。
        </p>
        <p class="muted" style="font-size:12px;margin:0">
          如果设备背面或底部贴着标签、上面有一串像 aa:bb:cc:dd:ee:ff 这样的字符，也请一起写上。
          屏幕上如果有一串 7 位数字，那是激活码，管理员凭它找不到设备，可以不写。
        </p>
      </div>
    </template>

    <template v-else>
      <label>用户名（3-64 位，登录时用）</label>
      <input id="ru" v-model="regForm.username" style="width:100%;margin-bottom:10px" />
      <label>昵称（选填，机器人称呼你用的名字）</label>
      <input id="rn" v-model="regForm.nickname" style="width:100%;margin-bottom:10px" placeholder="留空则与用户名相同" />
      <label>密码（至少 6 位）</label>
      <input id="rp" v-model="regForm.password" type="password" style="width:100%;margin-bottom:10px" />
      <label>确认密码</label>
      <input id="rp2" v-model="regForm.password2" type="password" style="width:100%;margin-bottom:10px"
             @keyup.enter="doRegister" />
      <div class="grid g2" style="margin-bottom:14px">
        <div><label>手机（选填）</label><input id="rph" v-model="regForm.phone" style="width:100%" /></div>
        <div><label>邮箱（选填，找回与工单回复用）</label><input id="rem" v-model="regForm.email" style="width:100%" /></div>
      </div>
      <button id="rb" class="primary" style="width:100%" :disabled="busy" @click="doRegister">注册并登录</button>
      <div style="margin-top:12px;text-align:center">
        <a href="#" id="toLogin" @click.prevent="switchReg(false)" style="font-size:13px">已有账号？登录</a>
      </div>
    </template>

    <p class="muted" style="margin-top:12px;font-size:12px">
      不装手机 APP 也能在浏览器里完成全部操作：绑定设备、设置提醒、提交工单。
      平台管理员请访问 <a href="/admin">管理后台</a>。
    </p>
  </div>

  <!-- ============================ 主体 ============================ -->
  <template v-else>
    <header class="bar">
      <div>
        <h1>老人陪伴提醒助手 · 用户端</h1>
        <div class="muted" style="font-size:12px">管理您家的设备、提醒、记忆与人格</div>
      </div>
      <div class="row">
        <a v-if="user.is_admin" href="/admin" style="font-size:12px">管理后台</a>
        <span class="muted" style="font-size:12px">{{user.username}}</span>
        <!-- 账户设置（改密码 / 换邮箱）放弹窗而不是新增 tab：tab 已经 9 个，
             再多一行就看不过来了，而这两项都属于低频的「顺手改一下」操作。 -->
        <button id="acctBtn" @click="openAccount">账户设置</button>
        <button @click="logout">退出</button>
      </div>
    </header>

    <nav>
      <button v-for="t in tabs" :key="t.k" :class="{on:tab===t.k}" @click="tab=t.k">{{t.n}}</button>
    </nav>

    <div v-if="err" class="err">{{err}}</div>

    <!-- ---------------------- 我的设备 ---------------------- -->
    <section v-if="tab==='devices'">
      <div class="card">
        <h2>添加设备</h2>
        <p class="muted" style="font-size:12px;margin:0 0 10px">
          设备连上 Wi-Fi 后，屏幕上会显示 <b>7 位数字激活码</b>（形如 <code>123-4567</code>），
          在下方「输入激活码绑定设备」里填入该码即完成绑定。
          激活码 <b>10 分钟内有效</b>，过期后设备会自动换一枚新码，照着屏幕重输即可。
        </p>
        <p class="muted" style="font-size:12px;margin:0 0 10px">
          下面的「设备标识」是<b>可选</b>的备用登记方式：正常流程不需要手填，
          绑定激活码时会按设备自报的 MAC 自动建档。
        </p>
        <div class="row">
          <div><label>设备标识（eFuse MAC）</label><input v-model="devForm.device_id" placeholder="aabbccddeeff" /></div>
          <div><label>名称</label><input v-model="devForm.name" placeholder="客厅陪伴助手" /></div>
          <button class="primary" :disabled="busy" @click="createDevice">添加</button>
        </div>
      </div>

      <!-- 激活码绑定：设备屏幕显示 7 位码（OTA 下发），用户在本页输入即可完成绑定，
           绑定后设备归到当前账号名下，随即出现在下方「我的设备」列表。
           通用码场景下设备还没登记，用可选的「设备标识」现场建档。
           ⚠️ 本页**不提供**「生成激活码」按钮：码的唯一来源是设备屏幕。
           服务端对已绑定设备不再发码（POST /api/devices/{pk}/code → 409），
           在这里放按钮只会让用户点到一条报错。 -->
      <div class="card">
        <h2>输入激活码绑定设备</h2>
        <p class="muted" style="font-size:12px;margin:0 0 10px">
          让设备屏幕显示 <b>7 位数字激活码</b>，在本页输入即可完成绑定。
          多输的短横线（<code>123-4567</code>）或空格会被自动忽略。
        </p>
        <div class="row">
          <div><label>激活码</label>
            <input id="bdCode" v-model="bindForm.code" placeholder="123-4567" maxlength="9"
                   style="width:220px" @keyup.enter="bindDeviceByCode" /></div>
          <div><label>设备标识（设备未登记时必填）</label>
            <input id="bdDevId" v-model="bindForm.device_id" placeholder="留空表示该设备已登记" style="width:220px" /></div>
          <div><label>备注名称（选填）</label>
            <input id="bdAlias" v-model="bindForm.alias" placeholder="客厅陪伴助手" style="width:180px" /></div>
          <button id="bdBtn" class="primary" :disabled="busy" @click="bindDeviceByCode">绑定到我的账号</button>
        </div>
        <div v-if="bindMsg" class="muted" style="font-size:12px;margin-top:8px;color:var(--ok)">{{bindMsg}}</div>
      </div>

      <!-- 「忘记用户名」求助通道：这是唯一能救回一台被锁在原账户上的设备的路径。
           为什么必须写在页面上而不是只写在后端报错里：走投无路的用户根本到不了
           那条报错（他登不进原账户，连设备列表都看不到）。 -->
      <div class="card" id="loginHelpFull">
        <h2>忘记用户名、解绑不了设备？</h2>
        <p class="muted" style="font-size:12px;margin:0 0 8px">
          忘记注册时的用户名 ⇒ 登不进原账户 ⇒ 网页和 APP 里都看不到那台设备，
          也就无法自行解绑。这时<b>只能由平台管理员代为解绑</b>：
        </p>
        <ol style="margin:0;padding-left:20px;font-size:13px;line-height:1.9">
          <li>用<b>注册时留的邮箱</b>发邮件给平台管理员<span v-if="supportEmail">：<a :href="'mailto:'+supportEmail">{{supportEmail}}</a></span>。</li>
          <!-- 要报什么：**不是**必填的设备硬件地址。
               管理员是按账户找人的（用户名 → 该账户下的设备 → 解绑），不是按设备找账户；
               而那串硬件地址设备屏幕不显示、标签上有没有印查无依据，
               管理后台的设备搜索（index.html:227 的 devFilter）也不认激活码。
               所以这里只问三件他一定答得上来的事；标签上的那串字符写成"顺手一起写上"，
               不是必填 —— 写成必填就是把门槛设在用户够不到的地方。
               与未登录登录卡 #loginHelp 的口径保持一致，否则同一个人在两种登录状态下
               会看到互相矛盾的话术。 -->
          <li>邮件里写明三件事：① 原来注册用的<b>用户名或邮箱</b>（记不全也没关系，能想起多少写多少）；
              ② 你给这台设备起的<b>名字</b>（比如「客厅那台」）；③ 大概是什么时候绑定的。</li>
          <li>如果设备背面或底部贴着标签、上面有一串像 aa:bb:cc:dd:ee:ff 这样的字符，
              <b>顺手一起写上就行</b>（不是必填）。屏幕上那串 7 位数字是激活码，凭它找不到设备，可以不写。</li>
          <li>管理员在后台解绑后，<b>请把设备的电源拔掉、等几秒再插上</b>；
              设备重新启动并联网后稍等片刻，屏幕上才会出现新的激活码
              （<b>不会自己出现</b>，也不用反复操作），然后你可以用<b>新账户</b>把它重新绑定。
              如果超过一分钟还是什么都没有，<b>把电源再拔一次</b>即可。
              <b>如果解绑后这台设备还在说话</b>，那不是没解绑成功：解绑已经立即生效、
              这台设备不再归你管，只是它要等到下次重新连线才会被拒绝。
              屏幕不会显示任何提示，这是<b>预期现象，不是坏了</b>。</li>
        </ol>
        <p class="muted" style="font-size:12px;margin:8px 0 0">
          解绑只清掉「这台设备归谁」，<b>提醒与历史记录都会保留</b>，不会因为换账户而丢失。
        </p>
      </div>
      <!-- 配网引导：固件本身自带浏览器配网（未配网时自建热点 + 强制门户，
           屏幕上直接打出热点名与网址），所以这里只写操作说明、不发任何请求——
           配网页面跑在设备自己的 192.168.4.1 上，与本服务不同源，从这里跳转也访问不到。
           不新增 tab / 弹窗：tab 已经 9 个，且配网是一次性动作，不是日常操作。 -->
      <div class="card">
        <h2>给设备配网（连上家里 Wi-Fi）</h2>
        <p class="muted" style="font-size:12px;margin:0 0 10px">
          设备第一次使用、或者换了家里的 Wi-Fi 时需要配网。<b>不需要安装 APP</b>：
          设备会自己开一个 Wi-Fi 热点，用手机或电脑的浏览器就能配完。
        </p>
        <ol style="margin:0;padding-left:20px;font-size:13px;line-height:1.9">
          <li>给设备通电、进入配网模式，<b>屏幕上会显示一个热点名和一个网址</b>
              （热点名形如 <code>XiaoZhi-A1B2</code>，网址一般是 <code>http://192.168.4.1</code>）。</li>
          <li>打开手机或电脑的 Wi-Fi 设置，连上屏幕显示的那个热点（热点本身没有密码）。</li>
          <li>打开浏览器，访问屏幕上显示的那个网址。</li>
          <li>在打开的页面里选择家里的 Wi-Fi 名称，输入 Wi-Fi 密码并提交。</li>
          <li>配网成功后<b>设备会自动重启</b>，重启后就连上家里的 Wi-Fi 了 ——
              回到本页用激活码把它绑定到你的账号。</li>
        </ol>
        <p class="muted" style="font-size:12px;margin:10px 0 0">
          配网页面打不开的话：多数手机连上这类热点后会<b>自动弹出配网提示</b>（强制门户），
          点开即可；没有弹出就手动在浏览器地址栏输入 <code>192.168.4.1</code>。
          还是不行，就确认一下手机/电脑连的确实是设备热点、而不是家里的 Wi-Fi，然后给设备断电重来一次。
        </p>
      </div>
      <div class="card">
        <h2>我的设备</h2>
        <table v-if="devices.length">
          <thead><tr><th>名称</th><th>标识</th><th>状态</th><th>硬件型号</th><th>固件版本</th><th>绑定时间</th><th>形象</th><th>人格角色</th><th>操作</th></tr></thead>
          <tbody>
            <tr v-for="d in devices" :key="d.id">
              <td>{{d.name}}</td>
              <td><code>{{d.device_id}}</code></td>
              <td><span class="tag" :class="d.online?'ok':''">{{d.online?'在线':'离线'}}</span></td>
              <!-- 硬件型号：固件心跳上报（esp_chip_info 探测）。老固件/存量设备
                   为空串 → 「未知」，下次心跳自动补全，不需要家属做任何事。
                   固件版本：设备自报；未上报过 → 「未上报」。
                   绑定时间：当前归属的起始时刻（重新绑定会更新）；存量 NULL
                   → fmt() 返「—」，**不回落 created_at**（语义不同）。 -->
              <td class="muted">{{d.hardware_model||'未知'}}</td>
              <td class="muted">{{d.fw_version||'未上报'}}</td>
              <td class="muted">{{fmt(d.bound_at)}}</td>
              <td>
                <select :value="d.avatar_id||''" @change="applyAvatar(d,$event)">
                  <option value="">未设置</option>
                  <option v-for="a in avatars" :key="a.id" :value="a.id">{{a.name}}</option>
                </select>
              </td>
              <td>
                <!-- 人格角色绑定态来自列表接口。刷新页面后若这里显示「未设置」，
                     重新在下拉里选一次即可（以设备实际生效的设置为准）。 -->
                <select :value="agentBind[d.id]||''" @change="bindAgent(d,$event)">
                  <option value="">未设置</option>
                  <option v-for="r in allRoles" :key="r.id" :value="r.id">{{r.name}}</option>
                </select>
              </td>
              <td class="row">
                <button class="danger" @click="removeDevice(d)">删除</button>
              </td>
            </tr>
          </tbody>
        </table>
        <div v-else class="empty">还没有设备，先在上方登记一台</div>
      </div>
    </section>


    <!-- ---------------------- 提醒 ---------------------- -->
    <section v-if="tab==='reminders'">
      <div class="card">
        <div class="row" style="justify-content:space-between">
          <h2>提醒规则</h2>
          <div class="row">
            <select v-model="curDeviceId">
              <option v-for="d in devices" :key="d.id" :value="d.id">{{d.name}}</option>
            </select>
            <button class="primary" :disabled="!curDeviceId" @click="editReminder(null)">新增提醒</button>
          </div>
        </div>
        <table v-if="reminders.length">
          <thead><tr><th>标题</th><th>类型</th><th>时间</th><th>重复</th><th>确认</th><th>状态</th><th>操作</th></tr></thead>
          <tbody>
            <tr v-for="r in reminders" :key="r.id">
              <td>
                {{r.title}}
                <div class="muted" style="font-size:12px" v-if="r.dose">剂量：{{r.dose}}</div>
                <div class="muted" style="font-size:12px">下次：{{fmt(r.next_fire_at)}}</div>
              </td>
              <td>{{typeName(r.rtype)}}</td>
              <td>{{(r.times_of_day||[]).join(' ')}}</td>
              <td>{{kindName(r)}}</td>
              <td>{{(r.confirm_methods||[]).join('/')||'—'}}</td>
              <td><span class="tag" :class="r.enabled?'ok':''">{{r.enabled?'启用':'暂停'}}</span></td>
              <td class="row">
                <button @click="editReminder(r)">编辑</button>
                <button @click="toggleReminder(r)">{{r.enabled?'暂停':'启用'}}</button>
                <button class="danger" @click="removeReminder(r)">删除</button>
              </td>
            </tr>
          </tbody>
        </table>
        <div v-else class="empty">该设备还没有提醒规则</div>
      </div>

      <div class="card" v-if="curDeviceId">
        <h2>最近回执</h2>
        <table v-if="events.length">
          <thead><tr><th>应触发</th><th>状态</th><th>确认方式</th><th>确认时间</th><th>备注</th></tr></thead>
          <tbody>
            <tr v-for="e in events" :key="e.id">
              <td>{{fmt(e.due_at)}}</td>
              <td><span class="tag" :class="stateClass(e.state)">{{stateName(e.state)}}</span></td>
              <td>{{methodName(e.confirm_method)}}</td>
              <td>{{fmt(e.confirmed_at)}}</td>
              <td class="muted">{{e.note}}</td>
            </tr>
          </tbody>
        </table>
        <div v-else class="empty">暂无回执</div>
      </div>

      <div v-if="rBox" class="mask" @click.self="rBox=null">
        <div class="modal">
          <button class="close" @click="rBox=null">&times;</button>
          <h2>{{rForm.id?'编辑提醒':'新增提醒'}}</h2>
          <!-- 同步时延告知（2026-10-29 用户要求）。
               为什么是 5 分钟：提醒由**设备本地**响，服务端新加的提醒要等设备
               下次心跳才拿到，心跳周期 sync_interval_sec 默认 300 秒
               （server/app/schemas.py）。写死成静态文案而不是按当前时间动态
               判断 —— times_of_day 是**设备所在时区**的钟点，而浏览器在
               家属所在时区，两边可能不同，动态判断会给出错误的红色警告。 -->
          <div style="margin:10px 0 2px;padding:9px 12px;border-radius:8px;
                      background:#fff7e6;border:1px solid #ffd591;
                      color:#874d00;font-size:12px;line-height:1.7">
            ⏱ <b>保存后最多需要 5 分钟才会同步到设备。</b>
            提醒时间如果距离现在不足 5 分钟，这一次设备会<b>漏报</b>
            —— 请把时间设在 5 分钟以后。
          </div>
          <div class="grid g2">
            <div><label>标题</label><input v-model="rForm.title" style="width:100%" /></div>
            <div><label>类型</label>
              <select v-model.number="rForm.rtype" style="width:100%">
                <option :value="0">服药</option><option :value="1">日程</option>
                <option :value="2">喝水</option><option :value="3">运动</option><option :value="4">自定义</option>
              </select></div>
            <div><label>播报文案（留空则读标题）</label><input v-model="rForm.speak_text" style="width:100%" /></div>
            <div><label>剂量 / 备注</label><input v-model="rForm.dose" style="width:100%" placeholder="1 片，饭后" /></div>
          </div>

          <div class="grid g2" style="margin-top:10px">
            <div><label>重复方式</label>
              <select v-model.number="rForm.schedule_kind" style="width:100%">
                <option :value="1">每天</option><option :value="2">每周指定几天</option>
                <option :value="3">每月指定几号</option><option :value="4">每隔 N 天</option>
                <option :value="0">指定日期一次</option>
              </select></div>
            <div><label>触发时刻（24h，逗号分隔，如 08:00, 20:00）</label>
              <input v-model="timesText" style="width:100%" placeholder="08:00, 12:00, 18:00" /></div>
          </div>

          <div class="grid g3" style="margin-top:10px" v-if="rForm.schedule_kind===2">
            <div><label>星期（1=周一）</label><input v-model="weekText" style="width:100%" placeholder="1,3,5" /></div>
            <div><label>生效开始</label><input v-model="rForm.start_date" placeholder="2026-10-01" /></div>
            <div><label>生效结束</label><input v-model="rForm.end_date" placeholder="2027-10-01" /></div>
          </div>
          <div class="grid g3" style="margin-top:10px" v-if="rForm.schedule_kind===3">
            <div><label>每月几号</label><input v-model="monthText" style="width:100%" placeholder="1,15" /></div>
            <div><label>生效开始</label><input v-model="rForm.start_date" placeholder="2026-10-01" /></div>
            <div><label>生效结束</label><input v-model="rForm.end_date" placeholder="2027-10-01" /></div>
          </div>
          <div class="grid g3" style="margin-top:10px" v-if="rForm.schedule_kind===4">
            <div><label>每隔天数</label><input v-model.number="rForm.interval_days" type="number" min="1" /></div>
            <div><label>起始日期</label><input v-model="rForm.start_date" placeholder="2026-10-01" /></div>
            <div><label>结束日期</label><input v-model="rForm.end_date" placeholder="2026-12-31" /></div>
          </div>
          <div class="grid g3" style="margin-top:10px" v-if="rForm.schedule_kind===0">
            <div><label>日期</label><input v-model="rForm.once_date" placeholder="2026-10-15" /></div>
          </div>

          <div class="grid g3" style="margin-top:10px">
            <div><label>需要确认</label>
              <select v-model="rForm.require_confirm" style="width:100%">
                <option :value="true">需要</option><option :value="false">不需要</option>
              </select></div>
            <div><label>未确认重复间隔（分钟）</label><input v-model.number="rForm.repeat_interval_min" type="number" /></div>
            <div><label>超时升级（分钟）</label><input v-model.number="rForm.escalate_after_min" type="number" /></div>
          </div>

          <div style="margin-top:10px">
            <label>允许的确认方式</label>
            <div class="row">
              <label style="display:flex;gap:4px;align-items:center">
                <input type="checkbox" value="voice" v-model="rForm.confirm_methods" /> 语音</label>
              <label style="display:flex;gap:4px;align-items:center">
                <input type="checkbox" value="button" v-model="rForm.confirm_methods" /> 按键（长按3秒+30秒内短按）</label>
              <label style="display:flex;gap:4px;align-items:center">
                <input type="checkbox" value="app" v-model="rForm.confirm_methods" /> 手机端</label>
            </div>
          </div>

          <div class="row" style="margin-top:16px;justify-content:flex-end">
            <button @click="rBox=null">取消</button>
            <button class="primary" @click="saveReminder">保存</button>
          </div>
        </div>
      </div>
    </section>

    <!-- ---------------------- 记忆管理 ---------------------- -->
    <section v-if="tab==='memory'">
      <div class="card">
        <div class="row" style="justify-content:space-between">
          <h2>机器人记住的事</h2>
          <button @click="loadMemory">刷新</button>
        </div>
        <p class="muted" style="font-size:12px;margin:0 0 10px">
          记忆由机器人在聊天中自动整理。删掉某一条后，它不会再被提起。
        </p>
        <table v-if="memories.length">
          <thead><tr><th>内容</th><th>分类</th><th>记录时间</th><th>操作</th></tr></thead>
          <tbody>
            <tr v-for="m in memories" :key="m.id">

              <td><span class="tag">{{m.category_text||m.category}}</span></td>

          </tbody>

        <div v-else class="empty">还没有记忆，多和机器人聊聊天就有了</div>
      </div>

      <div class="card" v-if="tone">

        <p class="muted" style="font-size:13px;margin:0">{{tone.description||'聊天还不多，画像生成中'}}</p>
        <div class="muted" style="font-size:12px;margin-top:8px">机器人根据聊天自动总结的说话风格，只读。</div>
      </div>

      <div class="card">
        <h2>当前人格提示词</h2>
        <p class="muted" style="font-size:12px;margin:0 0 8px">
          机器人现在实际注入 system prompt 的内容（预览，只读）。
        </p>
        <div style="white-space:pre-wrap;word-break:break-all;background:#f8fafc;padding:10px;
                    border-radius:8px;font-size:12px;max-height:280px;overflow:auto">
          {{personaPrompt||'（暂无）'}}
        </div>
      </div>

    <!-- ---------------------- 形象 ---------------------- -->
    <section v-if="tab==='avatars'">
      <div class="card">
        <div class="row" style="justify-content:space-between">
          <h2>形象</h2>
          <button class="primary" @click="editAvatar(null)">新建形象</button>
        </div>
        <table v-if="avatars.length">
          <thead><tr><th>名称</th><th>简介</th><th>归属</th><th>音色</th><th>应用到设备</th><th>操作</th></tr></thead>
          <tbody>
            <tr v-for="a in avatars" :key="a.id">
              <td>{{a.name}}</td>
              <td class="muted">{{a.description}}</td>
              <td><span class="tag" :class="a.record_type==='preset'?'':'ok'">
                {{a.record_type==='preset'?'平台':'我的'}}</span></td>

              <td>
                <select :value="''" @change="applyAvatarTo(a,$event)">

                  <option v-for="d in devices" :key="d.id" :value="d.id">{{d.name}}</option>
                </select>
              </td>
              <td class="row">
                <template v-if="a.record_type!=='preset'">
                  <button @click="editAvatar(a)">编辑</button>
                  <button class="danger" @click="removeAvatar(a)">删除</button>
                </template>
                <span v-else class="muted" style="font-size:12px">平台预设只读</span>

        <div v-else class="empty">还没有形象</div>
      </div>

      <div v-if="aBox" class="mask" @click.self="aBox=null">
        <div class="modal">
          <button class="close" @click="aBox=null">&times;</button>
          <h2>{{aForm.id?'编辑形象':'新建形象'}}</h2>
          <div class="grid g2">

            <div><label>默认音色</label><input v-model="aForm.tts_voice" style="width:100%" placeholder="zh-CN-XiaoxiaoNeural" /></div>

            <label>简介</label><input v-model="aForm.description" style="width:100%" />

          </div>
        </div>

    <!-- ---------------------- 人格预设 ---------------------- -->
    <section v-if="tab==='roles'">
      <div class="card">
        <h2>平台人格预设</h2>
        <p class="muted" style="font-size:12px;margin:0 0 10px">
          平台预设只读。点「派生」复制一份成为自己的角色，即可随意调整，不影响其他家庭。
        </p>
        <table v-if="rolePresets.length">
          <thead><tr><th>名称</th><th>简介</th><th>音色</th><th>操作</th></tr></thead>
          <tbody>
            <tr v-for="r in rolePresets" :key="r.id">
              <td>{{r.name}}</td>
              <td class="muted">{{r.description}}</td>
              <td>{{r.tts_voice||'—'}}</td>
              <td><button @click="openDerive(r)">派生为我的角色</button></td>
            </tr>
          </tbody>
        </table>
        <div v-else class="empty">暂无平台预设</div>
      </div>

      <div class="card">
        <div class="row" style="justify-content:space-between">
          <h2>我的角色</h2>
          <button class="primary" @click="editRole(null)">原创角色</button>
        </div>
        <table v-if="myRoles.length">
          <thead><tr><th>名称</th><th>简介</th><th>母版</th><th>音色</th><th>绑定到设备</th><th>操作</th></tr></thead>
          <tbody>
            <tr v-for="r in myRoles" :key="r.id">
              <td>{{r.name}}</td>
              <td class="muted">{{r.description}}</td>
              <td class="muted" style="font-size:12px">{{parentName(r)}}</td>
              <td>{{r.tts_voice||'—'}}</td>
              <td>
                <select :value="agentBind_dev(r.id)" @change="bindRoleTo(r,$event)">
                  <option value="">选择设备</option>
                  <option v-for="d in devices" :key="d.id" :value="d.id">{{d.name}}</option>
                </select>
              </td>
              <td class="row">
                <button @click="editRole(r)">编辑</button>
                <button v-if="r.parent_id" @click="restoreRole(r)">还原为预设</button>
                <button class="danger" @click="removeRole(r)">删除</button>
              </td>
            </tr>
          </tbody>
        </table>
        <div v-else class="empty">还没有自己的角色，可从上方预设派生，或点「原创角色」</div>
      </div>

      <!-- 派生弹窗 -->
      <div v-if="deriveBox" class="mask" @click.self="deriveBox=null">
        <div class="modal" style="max-width:480px">
          <button class="close" @click="deriveBox=null">&times;</button>
          <h2>派生自我的角色</h2>
          <p class="muted" style="font-size:12px;margin:0 0 10px">
            复制「{{deriveBox.name}}」的全部设定成为独立副本；之后平台预设怎么改，都不影响你这份。
          </p>
          <div><label>新角色名称</label><input v-model="deriveName" style="width:100%" :placeholder="deriveBox.name" /></div>
          <div class="row" style="margin-top:16px;justify-content:flex-end">
            <button @click="deriveBox=null">取消</button>
            <button class="primary" :disabled="busy" @click="doDerive">派生</button>
          </div>
        </div>
      </div>

      <!-- 角色编辑弹窗：基本信息 + 性格 10 维（档位按钮组，与 /api/roles/traits 对齐） -->
      <div v-if="rEditBox" class="mask" @click.self="closeRole">
        <div class="modal" style="max-width:860px">
          <button class="close" @click="closeRole">&times;</button>
          <h2>{{rEdit.id?'编辑角色':'原创角色'}}</h2>
          <div class="grid g2">
            <div><label>名称</label><input v-model="rEdit.name" style="width:100%" /></div>
            <div><label>音色</label><input v-model="rEdit.tts_voice" style="width:100%" /></div>
          </div>
          <div style="margin-top:10px">
            <label>简介</label><input v-model="rEdit.description" style="width:100%" />
          </div>
          <div style="margin-top:10px">
            <label>特别交代（对这个角色说话方式的额外要求）</label>
            <textarea v-model="rEdit.system_prompt" style="min-height:90px"></textarea>
          </div>
          <div style="margin-top:12px">
            <label>性格（点档位即可，每格下面是这一档的实际行为）</label>
            <div v-for="spec in traitSpecs" :key="spec.name" class="traitrow">
              <div class="dim">{{spec.label}}</div>
              <div>
                <div class="bands">
                  <button v-for="o in spec.options" :key="String(o.value)"
                          :class="{on: isBandOn(spec, o.value)}"

        </p>

          <input id="emNew" v-model="emailForm.email" style="width:260px" placeholder="new@example.com" />
          <button class="primary" id="emBtn" :disabled="busy" @click="changeEmail">保存邮箱</button>

<script src="/static/vendor/vue.global.prod.js"></script>
<script>
const { createApp } = Vue;

createApp({
  data(){
    return {
      // token 与 user 的存储 key 与管理后台（index.html）**刻意保持一致**：
      // 两个入口共用一套登录态。普通用户在 / 登录后打开 /admin，管理后台能直接
      // 识别出「已登录但非管理员」并显示横幅 + 隐藏管理 tab，而不是又弹一次登录框。
      token: localStorage.getItem('elder_token') || '',
      user: JSON.parse(localStorage.getItem('elder_user') || '{}'),
      tab: 'devices',
      tabs: [
        {k:'devices',n:'我的设备'},{k:'reminders',n:'提醒'},
        {k:'memory',n:'记忆管理'},{k:'avatars',n:'形象'},{k:'roles',n:'人格预设'},
        {k:'usage',n:'用量统计'},{k:'stats',n:'交互统计'},{k:'support',n:'帮助与工单'}
      ],
      err: '', busy: false,
      // 登录 / 注册：regMode=false 是登录态（默认），true 切到注册态
      regMode: false,
      loginForm: { username:'', password:'' },
      regForm: { username:'', nickname:'', password:'', password2:'', phone:'', email:'' },
      // 设备
      devices: [], devForm: { device_id:'', name:'我的陪伴助手' },
      bindForm: { code:'', device_id:'', alias:'' }, bindMsg: '',
      // 管理员联系邮箱：来自 GET /api/support-contact（config.SUPPORT_EMAIL）。
      // 刻意不在前端写死 —— 换邮箱只该改服务端配置，不该改这份 HTML。
      supportEmail: '',
      agentBind: {},
      // 提醒
      curDeviceId: null, reminders: [], events: [],
      rBox: null, rForm: null, timesText:'', weekText:'', monthText:'',
      // 记忆
      memories: [], tone: null, personaPrompt: '',
      // 形象
      avatars: [], aBox: null, aForm: null,
      // 角色
      rolePresets: [], myRoles: [], traitSpecs: [],
      deriveBox: null, deriveName: '',
      rEditBox: false, rEdit: null,
      // 用量
      usageSummary: null, usageRows: [], usageFilter: '',
      // 交互统计（GET /api/stats/overview?device_pk=&days=）+ 首页聚合（GET /api/home/summary）
      stats: null, statsDeviceId: null, statsDays: 7, home: null,
      // 工单
      tickets: [], tkMsg: '',
      tkForm: { email:'', title:'', content:'', category:'other', device_id:'' },
      // 账户设置弹窗：改密码 / 换邮箱
      acctBox: false, acctErr: '', acctMsg: '',
      pwForm: { old_password:'', new_password:'', new_password2:'' },
      emailForm: { email:'' }
    };
  },
  computed: {
    // 设备/角色下拉共用的「全部可见角色」（平台预设 + 我的）
    allRoles(){
      return this.rolePresets.concat(this.myRoles);
    }
  },
  methods:{
    // 与管理后台同一套 fetch 包装：Bearer 注入、401 回登录态、detail 人话化
    async api(path, opt){
      const res = await fetch(path, Object.assign({
        headers: Object.assign(
          {'Content-Type':'application/json'},
          this.token ? {Authorization:'Bearer '+this.token} : {}
        )
      }, opt || {}));
      if (res.status === 401){ this.token=''; localStorage.removeItem('elder_token'); return null; }
      const text = await res.text();
      let data = null;
      try { data = text ? JSON.parse(text) : null; } catch(e){ data = text; }
      if (!res.ok){ throw new Error(this.errText(data, res.status)); }
      return data;
    },
    errText(data, status){
      const d = data && data.detail;
      if (typeof d === 'string' && d) return d;
      if (Array.isArray(d)){
        return d.map(it => {
          const loc = Array.isArray(it && it.loc) ? it.loc.join('.') : '';
          return (loc ? loc + '：' : '') + ((it && it.msg) || JSON.stringify(it));
        }).join('；');
      }
      if (d && typeof d === 'object'){
        try { return JSON.stringify(d); } catch(e){ /* 落到下面 */ }
      }
      return 'HTTP ' + status;
    },
    switchReg(v){
      this.regMode = !!v;
      this.err = '';
      if (v){
        // 从登录态切过来时，把已经填的用户名带过去，少打一遍
        if (!this.regForm.username) this.regForm.username = this.loginForm.username || '';
      }else{
        if (!this.loginForm.username) this.loginForm.username = this.regForm.username || '';
      }
    },
    async doLogin(){
      const u = (this.loginForm.username||'').trim();
      if (!u || !this.loginForm.password){ this.err = '请填写用户名和密码'; return; }
      await this.loginWith(u, this.loginForm.password);
    },
    // 登录并进入主体。注册成功后也走这里，实现「注册完直接进，不用再输一遍」。
    async loginWith(username, password){
      this.busy = true; this.err = '';
      try{
        const r = await fetch('/api/auth/login', {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({username: username, password: password})
        });
        const d = await r.json();
        if (!r.ok) throw new Error((d && typeof d.detail === 'string' && d.detail) || '登录失败');
        this.token = d.access_token;
        this.user = {username:d.username, id:d.user_id, is_admin:d.is_admin};
        localStorage.setItem('elder_token', this.token);
        localStorage.setItem('elder_user', JSON.stringify(this.user));
        await this.loadAll();
      }catch(e){ this.err = e.message; }
      finally{ this.busy = false; }
    },
    // 注册：POST /api/auth/register 无鉴权，成功返 201 + UserOut（不含 token），
    // 所以紧接着用同一份用户名密码调登录接口拿 token。
    async doRegister(){
      const f = this.regForm;
      const u = (f.username||'').trim();
      if (u.length < 3 || u.length > 64){ this.err = '用户名需 3-64 个字符'; return; }
      if ((f.password||'').length < 6){
        // 后端 min_length=6 会返 422，这里先拦下，给用户一句人话
        this.err = '密码至少 6 位'; return;
      }
      if (f.password !== f.password2){ this.err = '两次输入的密码不一致'; return; }
      if (f.email && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(f.email.trim())){
        this.err = '邮箱格式不正确'; return;
      }
      this.busy = true; this.err = '';
      try{
        await this.api('/api/auth/register', {
          method:'POST',
          body: JSON.stringify({
            username: u, password: f.password,
            nickname: (f.nickname||'').trim(),
            phone: (f.phone||'').trim(),
            email: (f.email||'').trim()
          })
        });
        await this.loginWith(u, f.password);
        if (this.token){
          this.regForm = {username:'', nickname:'', password:'', password2:'', phone:'', email:''};
          this.loginForm = {username:u, password:''};
        }
      }catch(e){
        // 服务端「是否开放公开注册」开关关闭时返 403 + 中文 detail
        // （config.REGISTER_CLOSED_DETAIL，注释里写明就是给前端直接弹的）：
        // 有中文就原样显示后端原文，只有拿不到人话（裸 HTTP 403/404）时才回落到
        // 固定文案 —— 绝不把状态码或堆栈甩给用户，也不白屏。
        const m = (e && e.message) || '';
        this.err = /[一-龥]/.test(m) ? m
          : (/403|404/.test(m) ? '当前未开放自助注册，请联系管理员' : m);
      }finally{ this.busy = false; }
    },

    // 激活码绑定：客户端只做「去分隔符 + 长度 7」的粗筛，
    // 真正的 Luhn 校验位由服务端判定（security.verify_activation_code），
    // 这里不重复实现，避免两套规则漂移。
    // ⚠️ 长度必须与 config.ACT_CODE_LEN 一致（6 位随机 + 1 位 Luhn = 7）。
    // 曾在这里写死 13（旧的「1 字母 + 12 数字」格式），服务端改成 7 位后
    // 这一行把**所有**合法码都拦在了前端 —— 网页端绑定功能完全不可用。
    async bindDeviceByCode(){
      const code = (this.bindForm.code||'').replace(/\D/g,'');
      if (code.length !== 7){
        this.err = '激活码应为 7 位数字，当前 ' + code.length + ' 位';
        return;
      }
      this.busy = true; this.err = '';
      try{
        const body = {code: code};
        if (this.bindForm.device_id) body.device_id = this.bindForm.device_id.trim();
        if (this.bindForm.alias) body.alias = this.bindForm.alias.trim();
        const r = await this.api('/api/devices/bind', {method:'POST', body:JSON.stringify(body)});
        if (!r) return;
        this.bindForm = {code:'', device_id:'', alias:''};
        await this.loadDevices();
        this.err = '';
        this.bindMsg = '已绑定设备「' + r.name + '」，可在下方列表中看到它';
      }catch(e){ this.err = '绑定失败：' + e.message; }
      finally{ this.busy = false; }
    },

    // 三种"拿不到"都必须静默留空，退化成只显示文字的提示：
    //   ① 请求失败 / 非 200（老镜像上这个接口还是 404）；

    // 绝不能因为这一个字段取不到就把整页打成错误态，也绝不能拼出 "mailto: "。
    // 注意：supportEmail 保持空串时，模板里 v-if="supportEmail" 为假 ⇒ 不渲染 mailto。
    async loadSupportEmail(){

        });

    fmt(v){
      if (!v) return '—';
      const d = new Date(v);
      if (isNaN(d.getTime())) return v;
      const p = n => String(n).padStart(2,'0');
      return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes());
    },
    barHeight(n){
      const max = Math.max(1, ...(this.usageSummary ? this.usageSummary.by_day.map(s=>s.total_tokens) : [1]));
      return Math.round(8 + (n / max) * 100);

    typeName(t){ return ['服药','日程','喝水','运动','自定义'][t] || '自定义'; },
    kindName(r){
      const k = r.schedule_kind;
      if (k===0) return '一次 '+ (r.once_date||'');
      if (k===1) return '每天';
      if (k===2) return '每周 ' + (r.weekdays||[]).map(w=>'一二三四五六日'[w-1]).join('');
      if (k===3) return '每月 ' + (r.month_days||[]).join('、') + ' 号';
      if (k===4) return '每 ' + r.interval_days + ' 天';
      return '—';
    },
    stateName(s){ return ['待触发','已响铃','已确认','超时未确认','已跳过'][s] || '—'; },
    stateClass(s){ return s===2?'ok':(s===3?'bad':(s===1?'warn':'')); },
    /* 2026-10-27 两档置信度：语音确认=半置信（还要按键复核），
       语音+按键=全置信。5 是 ConfirmMethod.VOICE_AND_BUTTON，
       由服务端把同一条的 VOICE 与 BUTTON 两次回执合并得到。 */
    methodName(m){ return ['—','语音确认','按键','手机端','自动','语音+按键确认'][m] || '—'; }
  },
  watch:{
    curDeviceId(){ this.loadReminders(); },
    tab(t){
      // 各页按需加载：登录时只拉设备/形象/角色三个概览页，
      // 重页（提醒/记忆/用量）进 tab 才拉，失败只红当前页的错误条，不白屏。
      if (t === 'reminders') this.loadReminders();
      if (t === 'memory') this.loadMemory();
      if (t === 'usage') this.loadUsage();
      if (t === 'stats'){ if (!this.statsDeviceId && this.devices.length) this.statsDeviceId = this.devices[0].id; this.loadStats(); this.loadHome(); }
      if (t === 'support') this.loadTickets();
    }
  },
  async mounted(){
    // 求助邮箱与登录态无关，**必须在 if (!this.token) return 之前**无条件取一次：
    // 未登录的登录卡里也有「用户名忘了？」求助块（#loginHelp），而忘记用户名的
    // 人恰恰只有未登录这一种状态。挪到 loadAll() 里会让这条唯一救命通道对目标
    // 用户不可见。不 await，不阻塞后续流程，失败静默。
    this.loadSupportEmail();
    if (!this.token) return;
    // token 在但 user 对象不在（如只清了一半 localStorage）：先找 /api/auth/me 补身份
    if (!this.user || !this.user.id){
      try{
        const me = await this.api('/api/auth/me');
        if (me){
          this.user = {username:me.username, id:me.id, is_admin:me.is_admin};
          localStorage.setItem('elder_user', JSON.stringify(this.user));
        }
      }catch(e){ this.err = e.message; }
    }
    if (this.token) await this.loadAll();
  }
}).mount('#app');
</script>
</body>
</html>
