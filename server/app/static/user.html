<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>老人陪伴提醒助手 · 用户端</title>
<style>
  :root{
    --bg:#f5f7fa; --panel:#ffffff; --line:#e3e8ef; --text:#1f2937; --muted:#6b7280;
    --brand:#2563eb; --brand-soft:#eff6ff; --ok:#16a34a; --warn:#d97706; --bad:#dc2626;
    --radius:10px;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
       font:14px/1.6 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
  #app{max-width:1180px;margin:0 auto;padding:20px 16px 60px}
  h1{font-size:19px;margin:0}
  h2{font-size:16px;margin:0 0 12px}
  .muted{color:var(--muted)}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
        padding:16px;margin-bottom:14px}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .row>*{margin:0}
  header.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
  nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
  nav button{border:1px solid var(--line);background:var(--panel);border-radius:20px;
        padding:6px 16px;cursor:pointer;color:var(--text)}
  nav button.on{background:var(--brand);border-color:var(--brand);color:#fff}
  button{border:1px solid var(--line);background:var(--panel);border-radius:6px;
        padding:6px 12px;cursor:pointer;color:var(--text);font-size:13px}
  button.primary{background:var(--brand);border-color:var(--brand);color:#fff}
  button.danger{color:var(--bad);border-color:#f3c7c7}
  button:disabled{opacity:.5;cursor:not-allowed}
  input,select,textarea{border:1px solid var(--line);border-radius:6px;padding:6px 9px;
        font-size:13px;background:#fff;color:var(--text);font-family:inherit}
  textarea{width:100%;min-height:82px;resize:vertical}
  label{display:block;font-size:12px;color:var(--muted);margin-bottom:3px}
  .grid{display:grid;gap:10px}
  .g2{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g3{grid-template-columns:repeat(3,minmax(0,1fr))}
  .g4{grid-template-columns:repeat(4,minmax(0,1fr))}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
  th{color:var(--muted);font-weight:600;font-size:12px}
  /* 数字列右对齐（token 用量对账场景，位数对齐才可比） */
  th.num,td.num{text-align:right;font-variant-numeric:tabular-nums}
  code{background:#f1f5f9;padding:1px 5px;border-radius:4px;font-size:12px}
  .tag{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;
       background:var(--brand-soft);color:var(--brand)}
  .tag.ok{background:#e8f7ee;color:var(--ok)}
  .tag.bad{background:#fdeaea;color:var(--bad)}
  .tag.warn{background:#fdf3e3;color:var(--warn)}
  .kpi{background:var(--brand-soft);border-radius:var(--radius);padding:12px}
  .kpi .n{font-size:24px;font-weight:700;color:var(--brand);line-height:1.2}
  .kpi .l{font-size:12px;color:var(--muted)}
  .big-code{font:22px/1.4 ui-monospace,Consolas,monospace;letter-spacing:1px;
       background:#0f172a;color:#7dd3fc;padding:12px 16px;border-radius:8px;
       display:inline-block;margin:8px 0}
  .bars{display:flex;align-items:flex-end;gap:6px;height:120px;padding-top:8px}
  .bars .b{flex:1;background:var(--brand);border-radius:4px 4px 0 0;min-height:2px;position:relative}
  .bars .x{text-align:center;font-size:11px;color:var(--muted);margin-top:4px}
  .err{background:#fdeaea;color:var(--bad);padding:8px 12px;border-radius:6px;margin-bottom:10px}
  .mask{position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;
        align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto}
  .modal{background:#fff;border-radius:12px;padding:18px;width:100%;max-width:720px}
  .close{float:right;border:none;background:none;font-size:20px;cursor:pointer;color:var(--muted)}
  .empty{padding:20px;text-align:center;color:var(--muted)}
  /* ---- 角色性格档位按钮组（与 /api/roles/traits 下发的 options 一一对应）---- */
  .bands{display:flex;gap:6px;flex-wrap:wrap}
  .bands button{font-size:12px;padding:5px 11px}
  .bands button.on{background:var(--brand);border-color:var(--brand);color:#fff}
  .traitrow{display:grid;grid-template-columns:78px 1fr;gap:8px;align-items:start;
        padding:7px 0;border-bottom:1px dashed var(--line)}
  .traitrow .dim{font-size:13px;padding-top:5px}
  .traitrow .eff{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.5}
  @media(max-width:820px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
<body>
<div id="app">

  <!-- ============================ 登录 ============================ -->
  <div v-if="!token" class="card" style="max-width:380px;margin:80px auto">
    <h2>登录用户端</h2>
    <div v-if="err" class="err">{{err}}</div>
    <label>用户名</label>
    <input id="lu" v-model="loginForm.username" style="width:100%;margin-bottom:10px" @keyup.enter="doLogin" />
    <label>密码</label>
    <input id="lp" v-model="loginForm.password" type="password" style="width:100%;margin-bottom:14px" @keyup.enter="doLogin" />
    <button id="lb" class="primary" style="width:100%" :disabled="busy" @click="doLogin">登 录</button>
    <p class="muted" style="margin-top:12px;font-size:12px">
      账号在手机 APP 注册。这是面向家庭用户的界面；平台管理员请访问 <a href="/">管理后台</a>。
    </p>
  </div>

  <!-- ============================ 主体 ============================ -->
  <template v-else>
    <header class="bar">
      <div>
        <h1>老人陪伴提醒助手 · 用户端</h1>
        <div class="muted" style="font-size:12px">管理您家的设备、提醒、记忆与人格</div>
      </div>
      <div class="row">
        <a v-if="user.is_admin" href="/" style="font-size:12px">管理后台</a>
        <span class="muted" style="font-size:12px">{{user.username}}</span>
        <button @click="logout">退出</button>
      </div>
    </header>

    <nav>
      <button v-for="t in tabs" :key="t.k" :class="{on:tab===t.k}" @click="tab=t.k">{{t.n}}</button>
    </nav>

    <div v-if="err" class="err">{{err}}</div>

    <!-- ---------------------- 我的设备 ---------------------- -->
    <section v-if="tab==='devices'">
      <div class="card">
        <h2>添加设备</h2>
        <p class="muted" style="font-size:12px;margin:0 0 10px">
          先登记设备（填设备标识），再点「激活码」让设备屏幕显示 13 位码，
          在手机 APP 输入该码即完成绑定。激活码 10 分钟内有效。
        </p>
        <div class="row">
          <div><label>设备标识（eFuse MAC）</label><input v-model="devForm.device_id" placeholder="aabbccddeeff" /></div>
          <div><label>名称</label><input v-model="devForm.name" placeholder="客厅陪伴助手" /></div>
          <button class="primary" :disabled="busy" @click="createDevice">添加</button>
        </div>
      </div>
      <div class="card">
        <h2>我的设备</h2>
        <table v-if="devices.length">
          <thead><tr><th>名称</th><th>标识</th><th>状态</th><th>形象</th><th>人格角色</th><th>操作</th></tr></thead>
          <tbody>
            <tr v-for="d in devices" :key="d.id">
              <td>{{d.name}}</td>
              <td><code>{{d.device_id}}</code></td>
              <td><span class="tag" :class="d.online?'ok':''">{{d.online?'在线':'离线'}}</span></td>
              <td>
                <select :value="d.avatar_id||''" @change="applyAvatar(d,$event)">
                  <option value="">未设置</option>
                  <option v-for="a in avatars" :key="a.id" :value="a.id">{{a.name}}</option>
                </select>
              </td>
              <td>
                <!-- 设备详情接口不返回当前 agent_id，绑定态只在本页内存里记，
                     刷新后回到「未设置」显示；以设备实际生效的设置为准。 -->
                <select :value="agentBind[d.id]||''" @change="bindAgent(d,$event)">
                  <option value="">未设置</option>
                  <option v-for="r in allRoles" :key="r.id" :value="r.id">{{r.name}}</option>
                </select>
              </td>
              <td class="row">
                <button @click="genCode(d)">激活码</button>
                <button class="danger" @click="removeDevice(d)">删除</button>
              </td>
            </tr>
          </tbody>
        </table>
        <div v-else class="empty">还没有设备，先在上方登记一台</div>
      </div>

      <div v-if="codeBox" class="mask" @click.self="codeBox=null">
        <div class="modal">
          <button class="close" @click="codeBox=null">&times;</button>
          <h2>设备激活码</h2>
          <p class="muted">让设备屏幕显示该码，或在手机 APP 里输入。<b>10 分钟内有效</b>，过期请重新获取。</p>
          <div class="big-code">{{codeBox.display}}</div>
          <p class="muted" style="font-size:12px">原始码：<code>{{codeBox.code}}</code> · 结构：1 位字母 + 12 位数字（末位 Luhn 校验位）</p>
          <div class="row"><button class="primary" @click="copy(codeBox.code)">复制</button></div>
        </div>
      </div>
    </section>

    <!-- ---------------------- 会员情况 ---------------------- -->
    <section v-if="tab==='membership'">
      <div class="card" v-if="membership">
        <h2>会员状态</h2>
        <div class="row" style="margin-bottom:10px">
          <span class="tag" :class="membership.is_vip?'ok':''">{{membership.is_vip?'会员生效中':'免费用户'}}</span>
          <span class="muted" style="font-size:12px" v-if="membership.plan">套餐：{{membership.plan}}</span>
          <span class="muted" style="font-size:12px" v-if="membership.expires_at">
            到期：{{fmt(membership.expires_at)}}（剩 {{membership.days_left}} 天）</span>
        </div>
        <ul class="muted" style="margin:0;padding-left:20px;font-size:13px">
          <li v-for="b in (membership.benefits||[])" :key="b">{{b}}</li>
        </ul>
        <div class="muted" style="font-size:12px;margin-top:8px" v-if="membership.quota">
          今日陪聊：{{quotaText(membership.quota)}}
        </div>
      </div>

      <div class="card">
        <h2>套餐</h2>
        <div class="grid g3">
          <div class="kpi" v-for="p in plans" :key="p.id">
            <div class="l">{{p.name}}</div>
            <div class="n">¥{{p.price_yuan}}</div>
            <div class="l">{{p.months}} 个月 / {{p.days}} 天</div>
            <div class="muted" style="font-size:12px;margin-top:6px">{{(p.benefits||[]).join(' · ')}}</div>
          </div>
        </div>
        <p class="muted" style="font-size:12px;margin:10px 0 0">
          下单与支付请在手机 APP 内完成：APP 生成订单号 → 按下方收款信息转账 →
          管理员核对到账后自动开通。
        </p>
      </div>

      <div class="card" v-if="payment && (payment.account || payment.payee_name)">
        <h2>收款信息</h2>
        <div class="muted" style="font-size:13px;line-height:2">
          <div v-if="payment.channel">方式：{{payment.channel}}</div>
          <div v-if="payment.payee_name">收款人：{{payment.payee_name}}</div>
          <div v-if="payment.account">账号：<code>{{payment.account}}</code></div>
          <div v-if="payment.note">备注：{{payment.note}}</div>
        </div>
      </div>

      <div class="card">
        <h2>我的订单</h2>
        <table v-if="orders.length">
          <thead><tr><th>订单号</th><th>套餐</th><th class="num">金额</th><th>状态</th><th>创建时间</th></tr></thead>
          <tbody>
            <tr v-for="o in orders" :key="o.id">
              <td><code>{{o.code}}</code></td>
              <td>{{o.plan_name||o.plan_code}}</td>
              <td class="num">¥{{o.amount_yuan}}</td>
              <td><span class="tag" :class="orderClass(o.status)">{{orderStatusName(o.status)}}</span></td>
              <td class="muted">{{fmt(o.created_at)}}</td>
            </tr>
          </tbody>
        </table>
        <div v-else class="empty">还没有订单</div>
      </div>
    </section>

    <!-- ---------------------- 提醒 ---------------------- -->
    <section v-if="tab==='reminders'">
      <div class="card">
        <div class="row" style="justify-content:space-between">
          <h2>提醒规则</h2>
          <div class="row">
            <select v-model="curDeviceId">
              <option v-for="d in devices" :key="d.id" :value="d.id">{{d.name}}</option>
            </select>
            <button class="primary" :disabled="!curDeviceId" @click="editReminder(null)">新增提醒</button>
          </div>
        </div>
        <table v-if="reminders.length">
          <thead><tr><th>标题</th><th>类型</th><th>时间</th><th>重复</th><th>确认</th><th>状态</th><th>操作</th></tr></thead>
          <tbody>
            <tr v-for="r in reminders" :key="r.id">
              <td>
                {{r.title}}
                <div class="muted" style="font-size:12px" v-if="r.dose">剂量：{{r.dose}}</div>
                <div class="muted" style="font-size:12px">下次：{{fmt(r.next_fire_at)}}</div>
              </td>
              <td>{{typeName(r.rtype)}}</td>
              <td>{{(r.times_of_day||[]).join(' ')}}</td>
              <td>{{kindName(r)}}</td>
              <td>{{(r.confirm_methods||[]).join('/')||'—'}}</td>
              <td><span class="tag" :class="r.enabled?'ok':''">{{r.enabled?'启用':'暂停'}}</span></td>
              <td class="row">
                <button @click="editReminder(r)">编辑</button>
                <button @click="toggleReminder(r)">{{r.enabled?'暂停':'启用'}}</button>
                <button class="danger" @click="removeReminder(r)">删除</button>
              </td>
            </tr>
          </tbody>
        </table>
        <div v-else class="empty">该设备还没有提醒规则</div>
      </div>

      <div class="card" v-if="curDeviceId">
        <h2>最近回执</h2>
        <table v-if="events.length">
          <thead><tr><th>应触发</th><th>状态</th><th>确认方式</th><th>确认时间</th><th>备注</th></tr></thead>
          <tbody>
            <tr v-for="e in events" :key="e.id">
              <td>{{fmt(e.due_at)}}</td>
              <td><span class="tag" :class="stateClass(e.state)">{{stateName(e.state)}}</span></td>
              <td>{{methodName(e.confirm_method)}}</td>
              <td>{{fmt(e.confirmed_at)}}</td>
              <td class="muted">{{e.note}}</td>
            </tr>
          </tbody>
        </table>
        <div v-else class="empty">暂无回执</div>
      </div>

      <div v-if="rBox" class="mask" @click.self="rBox=null">
        <div class="modal">
          <button class="close" @click="rBox=null">&times;</button>
          <h2>{{rForm.id?'编辑提醒':'新增提醒'}}</h2>
          <div class="grid g2">
            <div><label>标题</label><input v-model="rForm.title" style="width:100%" /></div>
            <div><label>类型</label>
              <select v-model.number="rForm.rtype" style="width:100%">
                <option :value="0">服药</option><option :value="1">日程</option>
                <option :value="2">喝水</option><option :value="3">运动</option><option :value="4">自定义</option>
              </select></div>
            <div><label>播报文案（留空则读标题）</label><input v-model="rForm.speak_text" style="width:100%" /></div>
            <div><label>剂量 / 备注</label><input v-model="rForm.dose" style="width:100%" placeholder="1 片，饭后" /></div>
          </div>

          <div class="grid g2" style="margin-top:10px">
            <div><label>重复方式</label>
              <select v-model.number="rForm.schedule_kind" style="width:100%">
                <option :value="1">每天</option><option :value="2">每周指定几天</option>
                <option :value="3">每月指定几号</option><option :value="4">每隔 N 天</option>
                <option :value="0">指定日期一次</option>
              </select></div>
            <div><label>触发时刻（24h，逗号分隔，如 08:00, 20:00）</label>
              <input v-model="timesText" style="width:100%" placeholder="08:00, 12:00, 18:00" /></div>
          </div>

          <div class="grid g3" style="margin-top:10px" v-if="rForm.schedule_kind===2">
            <div><label>星期（1=周一）</label><input v-model="weekText" style="width:100%" placeholder="1,3,5" /></div>
            <div><label>生效开始</label><input v-model="rForm.start_date" placeholder="2026-10-01" /></div>
            <div><label>生效结束</label><input v-model="rForm.end_date" placeholder="2027-10-01" /></div>
          </div>
          <div class="grid g3" style="margin-top:10px" v-if="rForm.schedule_kind===3">
            <div><label>每月几号</label><input v-model="monthText" style="width:100%" placeholder="1,15" /></div>
            <div><label>生效开始</label><input v-model="rForm.start_date" placeholder="2026-10-01" /></div>
            <div><label>生效结束</label><input v-model="rForm.end_date" placeholder="2027-10-01" /></div>
          </div>
          <div class="grid g3" style="margin-top:10px" v-if="rForm.schedule_kind===4">
            <div><label>每隔天数</label><input v-model.number="rForm.interval_days" type="number" min="1" /></div>
            <div><label>起始日期</label><input v-model="rForm.start_date" placeholder="2026-10-01" /></div>
            <div><label>结束日期</label><input v-model="rForm.end_date" placeholder="2026-12-31" /></div>
          </div>
          <div class="grid g3" style="margin-top:10px" v-if="rForm.schedule_kind===0">
            <div><label>日期</label><input v-model="rForm.once_date" placeholder="2026-10-15" /></div>
          </div>

          <div class="grid g3" style="margin-top:10px">
            <div><label>需要确认</label>
              <select v-model="rForm.require_confirm" style="width:100%">
                <option :value="true">需要</option><option :value="false">不需要</option>
              </select></div>
            <div><label>未确认重复间隔（分钟）</label><input v-model.number="rForm.repeat_interval_min" type="number" /></div>
            <div><label>超时升级（分钟）</label><input v-model.number="rForm.escalate_after_min" type="number" /></div>
          </div>

          <div style="margin-top:10px">
            <label>允许的确认方式</label>
            <div class="row">
              <label style="display:flex;gap:4px;align-items:center">
                <input type="checkbox" value="voice" v-model="rForm.confirm_methods" /> 语音</label>
              <label style="display:flex;gap:4px;align-items:center">
                <input type="checkbox" value="button" v-model="rForm.confirm_methods" /> 按键（长按3秒+30秒内短按）</label>
              <label style="display:flex;gap:4px;align-items:center">
                <input type="checkbox" value="app" v-model="rForm.confirm_methods" /> 手机端</label>
            </div>
          </div>

          <div class="row" style="margin-top:16px;justify-content:flex-end">
            <button @click="rBox=null">取消</button>
            <button class="primary" @click="saveReminder">保存</button>
          </div>
        </div>
      </div>
    </section>

    <!-- ---------------------- 记忆管理 ---------------------- -->
    <section v-if="tab==='memory'">
      <div class="card">
        <div class="row" style="justify-content:space-between">
          <h2>机器人记住的事</h2>
          <button @click="loadMemory">刷新</button>
        </div>
        <p class="muted" style="font-size:12px;margin:0 0 10px">
          记忆由机器人在聊天中自动整理。删掉某一条后，它不会再被提起。
        </p>
        <table v-if="memories.length">
          <thead><tr><th>内容</th><th>分类</th><th>记录时间</th><th>操作</th></tr></thead>
          <tbody>
            <tr v-for="m in memories" :key="m.id">
              <td>{{m.content}}</td>
              <td><span class="tag">{{m.category_text||m.category}}</span></td>
              <td class="muted">{{fmt(m.created_at)}}</td>
              <td><button class="danger" @click="removeMemory(m)">删除</button></td>
            </tr>
          </tbody>
        </table>
        <div v-else class="empty">还没有记忆，多和机器人聊聊天就有了</div>
      </div>

      <div class="card" v-if="tone">
        <h2>语气画像</h2>
        <p class="muted" style="font-size:13px;margin:0">{{tone.description||'聊天还不多，画像生成中'}}</p>
        <div class="muted" style="font-size:12px;margin-top:8px">机器人根据聊天自动总结的说话风格，只读。</div>
      </div>

      <div class="card">
        <h2>当前人格提示词</h2>
        <p class="muted" style="font-size:12px;margin:0 0 8px">
          机器人现在实际注入 system prompt 的内容（预览，只读）。
        </p>
        <div style="white-space:pre-wrap;word-break:break-all;background:#f8fafc;padding:10px;
                    border-radius:8px;font-size:12px;max-height:280px;overflow:auto">
          {{personaPrompt||'（暂无）'}}
        </div>
      </div>
    </section>

    <!-- ---------------------- 形象 ---------------------- -->
    <section v-if="tab==='avatars'">
      <div class="card">
        <div class="row" style="justify-content:space-between">
          <h2>形象</h2>
          <button class="primary" @click="editAvatar(null)">新建形象</button>
        </div>
        <table v-if="avatars.length">
          <thead><tr><th>名称</th><th>简介</th><th>归属</th><th>音色</th><th>应用到设备</th><th>操作</th></tr></thead>
          <tbody>
            <tr v-for="a in avatars" :key="a.id">
              <td>{{a.name}}</td>
              <td class="muted">{{a.description}}</td>
              <td><span class="tag" :class="a.record_type==='preset'?'':'ok'">
                {{a.record_type==='preset'?'平台':'我的'}}</span></td>
              <td>{{a.tts_voice||'—'}}</td>
              <td>
                <select :value="''" @change="applyAvatarTo(a,$event)">
                  <option value="">选择设备</option>
                  <option v-for="d in devices" :key="d.id" :value="d.id">{{d.name}}</option>
                </select>
              </td>
              <td class="row">
                <template v-if="a.record_type!=='preset'">
                  <button @click="editAvatar(a)">编辑</button>
                  <button class="danger" @click="removeAvatar(a)">删除</button>
                </template>
                <span v-else class="muted" style="font-size:12px">平台预设只读</span>
              </td>
            </tr>
          </tbody>
        </table>
        <div v-else class="empty">还没有形象</div>
      </div>

      <div v-if="aBox" class="mask" @click.self="aBox=null">
        <div class="modal">
          <button class="close" @click="aBox=null">&times;</button>
          <h2>{{aForm.id?'编辑形象':'新建形象'}}</h2>
          <div class="grid g2">
            <div><label>名称</label><input v-model="aForm.name" style="width:100%" /></div>
            <div><label>默认音色</label><input v-model="aForm.tts_voice" style="width:100%" placeholder="zh-CN-XiaoxiaoNeural" /></div>
          </div>
          <div style="margin-top:10px">
            <label>简介</label><input v-model="aForm.description" style="width:100%" />
          </div>
          <div class="row" style="margin-top:16px;justify-content:flex-end">
            <button @click="aBox=null">取消</button>
            <button class="primary" @click="saveAvatar">保存</button>
          </div>
        </div>
      </div>
    </section>

    <!-- ---------------------- 人格预设 ---------------------- -->
    <section v-if="tab==='roles'">
      <div class="card">
        <h2>平台人格预设</h2>
        <p class="muted" style="font-size:12px;margin:0 0 10px">
          平台预设只读。点「派生」复制一份成为自己的角色，即可随意调整，不影响其他家庭。
        </p>
        <table v-if="rolePresets.length">
          <thead><tr><th>名称</th><th>简介</th><th>音色</th><th>操作</th></tr></thead>
          <tbody>
            <tr v-for="r in rolePresets" :key="r.id">
              <td>{{r.name}}</td>
              <td class="muted">{{r.description}}</td>
              <td>{{r.tts_voice||'—'}}</td>
              <td><button @click="openDerive(r)">派生为我的角色</button></td>
            </tr>
          </tbody>
        </table>
        <div v-else class="empty">暂无平台预设</div>
      </div>

      <div class="card">
        <div class="row" style="justify-content:space-between">
          <h2>我的角色</h2>
          <button class="primary" @click="editRole(null)">原创角色</button>
        </div>
        <table v-if="myRoles.length">
          <thead><tr><th>名称</th><th>简介</th><th>母版</th><th>音色</th><th>绑定到设备</th><th>操作</th></tr></thead>
          <tbody>
            <tr v-for="r in myRoles" :key="r.id">
              <td>{{r.name}}</td>
              <td class="muted">{{r.description}}</td>
              <td class="muted" style="font-size:12px">{{parentName(r)}}</td>
              <td>{{r.tts_voice||'—'}}</td>
              <td>
                <select :value="agentBind_dev(r.id)" @change="bindRoleTo(r,$event)">
                  <option value="">选择设备</option>
                  <option v-for="d in devices" :key="d.id" :value="d.id">{{d.name}}</option>
                </select>
              </td>
              <td class="row">
                <button @click="editRole(r)">编辑</button>
                <button v-if="r.parent_id" @click="restoreRole(r)">还原为预设</button>
                <button class="danger" @click="removeRole(r)">删除</button>
              </td>
            </tr>
          </tbody>
        </table>
        <div v-else class="empty">还没有自己的角色，可从上方预设派生，或点「原创角色」</div>
      </div>

      <!-- 派生弹窗 -->
      <div v-if="deriveBox" class="mask" @click.self="deriveBox=null">
        <div class="modal" style="max-width:480px">
          <button class="close" @click="deriveBox=null">&times;</button>
          <h2>派生自我的角色</h2>
          <p class="muted" style="font-size:12px;margin:0 0 10px">
            复制「{{deriveBox.name}}」的全部设定成为独立副本；之后平台预设怎么改，都不影响你这份。
          </p>
          <div><label>新角色名称</label><input v-model="deriveName" style="width:100%" :placeholder="deriveBox.name" /></div>
          <div class="row" style="margin-top:16px;justify-content:flex-end">
            <button @click="deriveBox=null">取消</button>
            <button class="primary" :disabled="busy" @click="doDerive">派生</button>
          </div>
        </div>
      </div>

      <!-- 角色编辑弹窗：基本信息 + 性格 10 维（档位按钮组，与 /api/roles/traits 对齐） -->
      <div v-if="rEditBox" class="mask" @click.self="closeRole">
        <div class="modal" style="max-width:860px">
          <button class="close" @click="closeRole">&times;</button>
          <h2>{{rEdit.id?'编辑角色':'原创角色'}}</h2>
          <div class="grid g2">
            <div><label>名称</label><input v-model="rEdit.name" style="width:100%" /></div>
            <div><label>音色</label><input v-model="rEdit.tts_voice" style="width:100%" /></div>
          </div>
          <div style="margin-top:10px">
            <label>简介</label><input v-model="rEdit.description" style="width:100%" />
          </div>
          <div style="margin-top:10px">
            <label>特别交代（对这个角色说话方式的额外要求）</label>
            <textarea v-model="rEdit.system_prompt" style="min-height:90px"></textarea>
          </div>
          <div style="margin-top:12px">
            <label>性格（点档位即可，每格下面是这一档的实际行为）</label>
            <div v-for="spec in traitSpecs" :key="spec.name" class="traitrow">
              <div class="dim">{{spec.label}}</div>
              <div>
                <div class="bands">
                  <button v-for="o in spec.options" :key="String(o.value)"
                          :class="{on: isBandOn(spec, o.value)}"
                          @click="setBand(spec, o.value)">{{o.label}}</button>
                </div>
                <div class="eff">{{bandEffect(spec, rEdit.traits[spec.name])}}</div>
              </div>
            </div>
            <div class="muted" style="font-size:12px;margin-top:6px">
              派生角色的「性格」默认继承母版；改哪项就只覆盖哪项。
            </div>
          </div>
          <div class="row" style="margin-top:16px;justify-content:flex-end">
            <button @click="closeRole">取消</button>
            <button class="primary" :disabled="busy" @click="saveRole">保存</button>
          </div>
        </div>
      </div>
    </section>

    <!-- ---------------------- 用量统计 ---------------------- -->
    <section v-if="tab==='usage'">
      <div class="card">
        <div class="row" style="justify-content:space-between">
          <h2>用量统计</h2>
          <div class="row">
            <select v-model="usageFilter">
              <option value="">全部用途</option>
              <option value="chat">chat 对话</option>
              <option value="light">light 轻任务</option>
              <option value="embed">embed 向量化</option>
              <option value="rerank">rerank 重排</option>
            </select>
            <button @click="loadUsage">刷新</button>
          </div>
        </div>
        <div v-if="usageSummary" class="grid g4">
          <div class="kpi"><div class="n">{{usageSummary.calls}}</div><div class="l">总调用次数</div></div>
          <div class="kpi"><div class="n">{{usageSummary.total_tokens}}</div><div class="l">总 tokens</div></div>
          <div class="kpi">
            <div class="n" :style="{color:usageSummary.failed_calls?'var(--bad)':'var(--ok)'}">
              {{usageSummary.failed_calls}}</div>
            <div class="l">失败次数</div>
          </div>
          <div class="kpi">
            <div class="n" style="font-size:18px">{{usageSummary.prompt_tokens}} / {{usageSummary.completion_tokens}}</div>
            <div class="l">输入 / 输出 tokens</div>
          </div>
        </div>
        <div v-else class="empty">暂无用量数据</div>
      </div>

      <div class="card" v-if="usageSummary && Object.keys(usageSummary.by_usage||{}).length">
        <h2>按用途分布（tokens）</h2>
        <table>
          <thead><tr><th>用途</th><th class="num">tokens</th></tr></thead>
          <tbody>
            <tr v-for="(v,k) in usageSummary.by_usage" :key="k">
              <td>{{usageName(k)}}</td>
              <td class="num">{{v}}</td>
            </tr>
          </tbody>
        </table>
      </div>

      <div class="card" v-if="usageSummary && (usageSummary.by_day||[]).length">
        <h2>近 {{usageSummary.by_day.length}} 天 tokens</h2>
        <div class="bars">
          <div v-for="p in usageSummary.by_day" :key="p.date" style="flex:1">
            <div class="b" :style="{height:barHeight(p.total_tokens)+'px'}"
                 :title="p.date+' 共 '+p.total_tokens+' tokens'"></div>
            <div class="x">{{p.date.slice(5)}}</div>
          </div>
        </div>
      </div>

      <div class="card">
        <h2>最近调用流水</h2>
        <table v-if="usageRows.length">
          <thead><tr><th>时间</th><th>来源</th><th>用途</th><th>模型</th><th class="num">tokens</th><th>结果</th></tr></thead>
          <tbody>
            <tr v-for="r in usageRows" :key="r.id">
              <td class="muted">{{fmt(r.created_at)}}</td>
              <td>{{r.source||'—'}}</td>
              <td><span class="tag">{{usageName(r.usage)}}</span></td>
              <td>{{r.provider_name||'—'}}<div class="muted" style="font-size:12px">{{r.model}}</div></td>
              <td class="num">{{r.total_tokens}}</td>
              <td><span class="tag" :class="r.ok?'ok':'bad'">{{r.ok?'成功':'失败'}}</span></td>
            </tr>
          </tbody>
        </table>
        <div v-else class="empty">暂无调用记录</div>
      </div>
    </section>
  </template>
</div>

<script src="/static/vendor/vue.global.prod.js"></script>
<script>
const { createApp } = Vue;

createApp({
  data(){
    return {
      // token 与 user 的存储 key 与管理后台（index.html）**刻意保持一致**：
      // 两个入口共用一套登录态。普通用户在 /user 登录后打开 /，管理后台能直接
      // 识别出「已登录但非管理员」并显示横幅 + 隐藏管理 tab，而不是又弹一次登录框。
      token: localStorage.getItem('elder_token') || '',
      user: JSON.parse(localStorage.getItem('elder_user') || '{}'),
      tab: 'devices',
      tabs: [
        {k:'devices',n:'我的设备'},{k:'membership',n:'会员情况'},{k:'reminders',n:'提醒'},
        {k:'memory',n:'记忆管理'},{k:'avatars',n:'形象'},{k:'roles',n:'人格预设'},
        {k:'usage',n:'用量统计'}
      ],
      err: '', busy: false,
      loginForm: { username:'', password:'' },
      // 设备
      devices: [], devForm: { device_id:'', name:'我的陪伴助手' },
      codeBox: null, agentBind: {},
      // 会员
      membership: null, plans: [], payment: null, orders: [],
      // 提醒
      curDeviceId: null, reminders: [], events: [],
      rBox: null, rForm: null, timesText:'', weekText:'', monthText:'',
      // 记忆
      memories: [], tone: null, personaPrompt: '',
      // 形象
      avatars: [], aBox: null, aForm: null,
      // 角色
      rolePresets: [], myRoles: [], traitSpecs: [],
      deriveBox: null, deriveName: '',
      rEditBox: false, rEdit: null,
      // 用量
      usageSummary: null, usageRows: [], usageFilter: ''
    };
  },
  computed: {
    // 设备/角色下拉共用的「全部可见角色」（平台预设 + 我的）
    allRoles(){
      return this.rolePresets.concat(this.myRoles);
    }
  },
  methods:{
    // 与管理后台同一套 fetch 包装：Bearer 注入、401 回登录态、detail 人话化
    async api(path, opt){
      const res = await fetch(path, Object.assign({
        headers: Object.assign(
          {'Content-Type':'application/json'},
          this.token ? {Authorization:'Bearer '+this.token} : {}
        )
      }, opt || {}));
      if (res.status === 401){ this.token=''; localStorage.removeItem('elder_token'); return null; }
      const text = await res.text();
      let data = null;
      try { data = text ? JSON.parse(text) : null; } catch(e){ data = text; }
      if (!res.ok){ throw new Error(this.errText(data, res.status)); }
      return data;
    },
    errText(data, status){
      const d = data && data.detail;
      if (typeof d === 'string' && d) return d;
      if (Array.isArray(d)){
        return d.map(it => {
          const loc = Array.isArray(it && it.loc) ? it.loc.join('.') : '';
          return (loc ? loc + '：' : '') + ((it && it.msg) || JSON.stringify(it));
        }).join('；');
      }
      if (d && typeof d === 'object'){
        try { return JSON.stringify(d); } catch(e){ /* 落到下面 */ }
      }
      return 'HTTP ' + status;
    },
    async doLogin(){
      this.busy = true; this.err = '';
      try{
        const r = await fetch('/api/auth/login', {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify(this.loginForm)
        });
        const d = await r.json();
        if (!r.ok) throw new Error(d.detail || '登录失败');
        this.token = d.access_token;
        this.user = {username:d.username, id:d.user_id, is_admin:d.is_admin};
        localStorage.setItem('elder_token', this.token);
        localStorage.setItem('elder_user', JSON.stringify(this.user));
        await this.loadAll();
      }catch(e){ this.err = e.message; }
      finally{ this.busy = false; }
    },
    logout(){ this.token=''; localStorage.removeItem('elder_token'); },
    async loadAll(){
      this.err = '';
      await Promise.all([this.loadDevices(), this.loadMembership(), this.loadAvatars(), this.loadRoles()]);
      if (this.curDeviceId) await this.loadReminders();
    },

    // -------- 设备 --------
    async loadDevices(){
      try{
        const r = await this.api('/api/devices'); if(!r) return;
        this.devices = r;
        if (!this.curDeviceId && r.length) this.curDeviceId = r[0].id;
      }catch(e){ this.err = '设备列表加载失败：' + e.message; }
    },
    async createDevice(){
      if (!this.devForm.device_id){ this.err = '请填写设备标识（MAC）'; return; }
      this.busy = true;
      try{
        await this.api('/api/devices', {method:'POST', body:JSON.stringify(this.devForm)});
        this.devForm = {device_id:'', name:'我的陪伴助手'};
        await this.loadDevices();
      }catch(e){ this.err = e.message; }
      finally{ this.busy = false; }
    },
    async genCode(d){
      try{
        this.codeBox = await this.api('/api/devices/'+d.id+'/code', {method:'POST'});
      }catch(e){ this.err = e.message; }
    },
    async applyAvatar(d, ev){
      const v = ev.target.value;
      try{
        if (v) await this.api('/api/avatars/'+v+'/apply/'+d.id, {method:'POST'});
        else await this.api('/api/devices/'+d.id, {method:'PATCH', body:JSON.stringify({avatar_id:0})});
        await this.loadDevices();
      }catch(e){ this.err = e.message; }
    },
    async bindAgent(d, ev){
      const v = Number(ev.target.value);
      if (!v){ return; }
      try{
        await this.api('/api/devices/'+d.id+'/agent', {method:'POST', body:JSON.stringify({role_id:v})});
        this.agentBind = Object.assign({}, this.agentBind, {[d.id]: v});
      }catch(e){ this.err = e.message; await this.loadDevices(); }
    },
    async removeDevice(d){
      if (!confirm('删除设备「'+d.name+'」及其全部提醒？')) return;
      try{
        await this.api('/api/devices/'+d.id, {method:'DELETE'});
        await this.loadDevices();
      }catch(e){ this.err = e.message; }
    },
    copy(t){ navigator.clipboard && navigator.clipboard.writeText(t); },

    // -------- 会员 --------
    async loadMembership(){
      try{
        const [m, p, pay, o] = await Promise.all([
          this.api('/api/membership'),
          this.api('/api/membership/plans'),
          this.api('/api/membership/payment-info'),
          this.api('/api/membership/orders/mine?limit=50')
        ]);
        this.membership = m; this.plans = p || []; this.payment = pay; this.orders = o || [];
      }catch(e){ this.err = '会员信息加载失败：' + e.message; }
    },
    quotaText(q){
      if (!q) return '—';
      if (q.unlimited) return '不限时长';
      const used = Math.round((q.used_seconds||0)/60);
      const limit = Math.round((q.limit_seconds||0)/60);
      return '已用 ' + used + ' 分钟 / 上限 ' + limit + ' 分钟';
    },
    orderStatusName(s){
      return {pending:'待支付', notified:'已通知，待核对', confirmed:'已开通',
              rejected:'已驳回', cancelled:'已取消', expired:'已过期'}[s] || s;
    },
    orderClass(s){
      return s==='confirmed' ? 'ok' : (s==='rejected'||s==='expired') ? 'bad' : '';
    },

    // -------- 提醒（与管理后台同一套表单与端点）--------
    async loadReminders(){
      if (!this.curDeviceId) return;
      try{
        const r = await this.api('/api/reminders?device_pk='+this.curDeviceId);
        if (r) this.reminders = r;
        const e = await this.api('/api/devices/'+this.curDeviceId+'/events?limit=50');
        if (e) this.events = e;
      }catch(e){ this.err = '提醒加载失败：' + e.message; }
    },
    blankReminder(){
      return { title:'', speak_text:'', rtype:0, schedule_kind:1,
        times_of_day:['08:00'], weekdays:[], month_days:[], interval_days:1,
        once_date:null, start_date:null, end_date:null, dose:'',
        require_confirm:true, repeat_interval_min:10, repeat_times:3,
        escalate_after_min:30, confirm_methods:['voice','button'], enabled:true };
    },
    editReminder(r){
      this.rForm = r ? JSON.parse(JSON.stringify(r)) : this.blankReminder();
      this.timesText = (this.rForm.times_of_day||[]).join(', ');
      this.weekText = (this.rForm.weekdays||[]).join(',');
      this.monthText = (this.rForm.month_days||[]).join(',');
      this.rBox = true;
    },
    async saveReminder(){
      this.rForm.times_of_day = this.timesText.split(/[,，\s]+/).filter(Boolean);
      this.rForm.weekdays = this.weekText.split(/[,，\s]+/).filter(Boolean).map(Number);
      this.rForm.month_days = this.monthText.split(/[,，\s]+/).filter(Boolean).map(Number);
      const body = JSON.parse(JSON.stringify(this.rForm));
      delete body.id; delete body.device_id; delete body.creator_id;
      delete body.created_at; delete body.updated_at; delete body.next_fire_at;
      try{
        if (this.rForm.id){
          await this.api('/api/reminders/'+this.rForm.id, {method:'PATCH', body:JSON.stringify(body)});
        }else{
          await this.api('/api/reminders?device_pk='+this.curDeviceId, {method:'POST', body:JSON.stringify(body)});
        }
        this.rBox = false; await this.loadReminders();
      }catch(e){ this.err = e.message; }
    },
    async toggleReminder(r){
      try{
        await this.api('/api/reminders/'+r.id+'/toggle', {method:'POST'});
        await this.loadReminders();
      }catch(e){ this.err = e.message; }
    },
    async removeReminder(r){
      if (!confirm('删除提醒「'+r.title+'」？')) return;
      try{
        await this.api('/api/reminders/'+r.id, {method:'DELETE'});
        await this.loadReminders();
      }catch(e){ this.err = e.message; }
    },

    // -------- 记忆 --------
    async loadMemory(){
      this.err = '';
      try{
        const [list, tone, prompt] = await Promise.all([
          this.api('/api/memory?limit=100'),
          this.api('/api/memory/persona/profile'),
          this.api('/api/memory/persona/prompt')
        ]);
        this.memories = list || [];
        this.tone = tone;
        this.personaPrompt = (prompt && prompt.detail) || '';
      }catch(e){ this.err = '记忆加载失败：' + e.message; }
    },
    async removeMemory(m){
      if (!confirm('删除这条记忆？删除后机器人不会再提起它。')) return;
      try{
        await this.api('/api/memory/'+m.id+'?reason=' + encodeURIComponent('家属在用户端删除'),
                       {method:'DELETE'});
        await this.loadMemory();
      }catch(e){ this.err = e.message; }
    },

    // -------- 形象 --------
    async loadAvatars(){
      try{
        const r = await this.api('/api/avatars'); if(r) this.avatars = r;
      }catch(e){ this.err = '形象列表加载失败：' + e.message; }
    },
    editAvatar(a){
      this.aForm = a ? JSON.parse(JSON.stringify(a))
                     : {name:'', description:'', tts_voice:''};
      this.aBox = true;
    },
    async saveAvatar(){
      if (!this.aForm.name){ this.err = '请填写形象名称'; return; }
      const body = JSON.parse(JSON.stringify(this.aForm));
      delete body.id; delete body.record_type; delete body.owner_id; delete body.created_at;
      try{
        if (this.aForm.id) await this.api('/api/avatars/'+this.aForm.id, {method:'PATCH', body:JSON.stringify(body)});
        else await this.api('/api/avatars', {method:'POST', body:JSON.stringify(body)});
        this.aBox = false; await this.loadAvatars();
      }catch(e){ this.err = e.message; }
    },
    async removeAvatar(a){
      if (!confirm('删除形象「'+a.name+'」？')) return;
      try{
        await this.api('/api/avatars/'+a.id, {method:'DELETE'});
        await this.loadAvatars();
      }catch(e){ this.err = e.message; }
    },
    async applyAvatarTo(a, ev){
      const v = Number(ev.target.value);
      if (!v){ return; }
      try{
        await this.api('/api/avatars/'+a.id+'/apply/'+v, {method:'POST'});
        await this.loadDevices();
      }catch(e){ this.err = e.message; }
    },

    // -------- 角色 / 人格预设 --------
    async loadRoles(){
      this.err = '';
      try{
        const [list, specs] = await Promise.all([
          this.api('/api/roles?scope=all'),
          this.api('/api/roles/traits')
        ]);
        this.rolePresets = (list && list.presets) || [];
        this.myRoles = (list && list.mine) || [];
        this.traitSpecs = (specs && specs.traits) || [];
      }catch(e){ this.err = '角色加载失败：' + e.message; }
    },
    parentName(r){
      if (!r.parent_id) return '原创';
      const p = this.allRoles.filter(x => x.id === r.parent_id)[0];
      return p ? p.name : ('母版 #' + r.parent_id);
    },
    // 角色 -> 设备绑定方向与设备页共用一张本地映射（详情接口不返回 agent_id）
    agentBind_dev(roleId){
      for (const k in this.agentBind){
        if (this.agentBind[k] === roleId) return Number(k);
      }
      return '';
    },
    async bindRoleTo(r, ev){
      const v = Number(ev.target.value);
      if (!v){ return; }
      try{
        await this.api('/api/devices/'+v+'/agent', {method:'POST', body:JSON.stringify({role_id:r.id})});
        this.agentBind = Object.assign({}, this.agentBind, {[v]: r.id});
      }catch(e){ this.err = e.message; }
    },
    openDerive(r){
      this.deriveBox = r; this.deriveName = r.name; 
    },
    async doDerive(){
      const name = (this.deriveName||'').trim() || this.deriveBox.name;
      this.busy = true;
      try{
        await this.api('/api/roles/'+this.deriveBox.id+'/derive',
                       {method:'POST', body:JSON.stringify({name})});
        this.deriveBox = null;
        await this.loadRoles();
      }catch(e){ this.err = e.message; }
      finally{ this.busy = false; }
    },
    editRole(r){
      // 编辑态用 traits_effective 显示当前实际生效的性格；
      // 保存时整体作为 overlay 提交（改哪项覆盖哪项）。
      this.rEdit = r ? JSON.parse(JSON.stringify(r)) : {
        name:'', description:'', system_prompt:'', tts_voice:'', traits:{} };
      this.rEdit.traits = Object.assign({}, this.rEdit.traits_effective || this.rEdit.traits || {});
      this.rEditBox = true;
    },
    closeRole(){ this.rEditBox = false; this.rEdit = null; },
    isBandOn(spec, value){
      const cur = this.rEdit ? this.rEdit.traits[spec.name] : undefined;
      return String(cur) === String(value);
    },
    setBand(spec, value){
      if (!this.rEdit) return;
      this.rEdit.traits[spec.name] = value;
    },
    bandEffect(spec, value){
      const hit = (spec.options||[]).filter(o => String(o.value) === String(value))[0];
      if (!hit) return '⚠️ 当前值 ' + String(value) + ' 不在任何档位里，请选一个档位。';
      return hit.effect || hit.label;
    },
    async saveRole(){
      if (!this.rEdit.name){ this.err = '请填写角色名称'; return; }
      this.busy = true;
      try{
        const body = {name:this.rEdit.name, description:this.rEdit.description||'',
                      system_prompt:this.rEdit.system_prompt||'',
                      tts_voice:this.rEdit.tts_voice||'', traits:this.rEdit.traits||{}};
        if (this.rEdit.id){
          await this.api('/api/roles/'+this.rEdit.id, {method:'PATCH', body:JSON.stringify(body)});
        }else{
          await this.api('/api/roles', {method:'POST', body:JSON.stringify(body)});
        }
        this.closeRole();
        await this.loadRoles();
      }catch(e){ this.err = e.message; }
      finally{ this.busy = false; }
    },
    async restoreRole(r){
      if (!confirm('把「'+r.name+'」的性格与提示词还原为平台预设当前值？\n' +
                   '机器人学到的说话习惯会保留。')) return;
      try{
        await this.api('/api/roles/'+r.id+'/restore', {method:'POST', body:'{}'});
        await this.loadRoles();
      }catch(e){ this.err = e.message; }
    },
    async removeRole(r){
      if (!confirm('删除角色「'+r.name+'」？已绑定它的设备将恢复无人格状态。')) return;
      try{
        await this.api('/api/roles/'+r.id, {method:'DELETE'});
        await this.loadRoles();
      }catch(e){ this.err = e.message; }
    },

    // -------- 用量 --------
    async loadUsage(){
      this.err = '';
      try{
        const q = this.usageFilter ? '?usage=' + encodeURIComponent(this.usageFilter) : '';
        const [s, rows] = await Promise.all([
          this.api('/api/usage/summary' + q),
          this.api('/api/usage/rows?limit=50' + (this.usageFilter ? '&usage=' + encodeURIComponent(this.usageFilter) : ''))
        ]);
        this.usageSummary = s;
        this.usageRows = rows || [];
      }catch(e){ this.err = '用量统计加载失败：' + e.message; }
    },
    usageName(u){
      return {chat:'对话', light:'轻任务', embed:'向量化', rerank:'重排'}[u] || u || '—';
    },

    // -------- 展示辅助 --------
    fmt(v){
      if (!v) return '—';
      const d = new Date(v);
      if (isNaN(d.getTime())) return v;
      const p = n => String(n).padStart(2,'0');
      return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes());
    },
    barHeight(n){
      const max = Math.max(1, ...(this.usageSummary ? this.usageSummary.by_day.map(s=>s.total_tokens) : [1]));
      return Math.round(8 + (n / max) * 100);
    },
    typeName(t){ return ['服药','日程','喝水','运动','自定义'][t] || '自定义'; },
    kindName(r){
      const k = r.schedule_kind;
      if (k===0) return '一次 '+ (r.once_date||'');
      if (k===1) return '每天';
      if (k===2) return '每周 ' + (r.weekdays||[]).map(w=>'一二三四五六日'[w-1]).join('');
      if (k===3) return '每月 ' + (r.month_days||[]).join('、') + ' 号';
      if (k===4) return '每 ' + r.interval_days + ' 天';
      return '—';
    },
    stateName(s){ return ['待触发','已响铃','已确认','超时未确认','已跳过'][s] || '—'; },
    stateClass(s){ return s===2?'ok':(s===3?'bad':(s===1?'warn':'')); },
    methodName(m){ return ['—','语音','按键','手机端','自动'][m] || '—'; }
  },
  watch:{
    curDeviceId(){ this.loadReminders(); },
    tab(t){
      // 各页按需加载：登录时只拉设备/会员/形象/角色四个概览页，
      // 重页（提醒/记忆/用量）进 tab 才拉，失败只红当前页的错误条，不白屏。
      if (t === 'reminders') this.loadReminders();
      if (t === 'memory') this.loadMemory();
      if (t === 'usage') this.loadUsage();
    }
  },
  async mounted(){
    if (!this.token) return;
    // token 在但 user 对象不在（如只清了一半 localStorage）：先找 /api/auth/me 补身份
    if (!this.user || !this.user.id){
      try{
        const me = await this.api('/api/auth/me');
        if (me){
          this.user = {username:me.username, id:me.id, is_admin:me.is_admin};
          localStorage.setItem('elder_user', JSON.stringify(this.user));
        }
      }catch(e){ this.err = e.message; }
    }
    if (this.token) await this.loadAll();
  }
}).mount('#app');
</script>
</body>
</html>
